<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>角色晶石台账</title>
<!-- ============================================================
     角色晶石台账 · 独立记录面板
     ------------------------------------------------------------
     稳定链接：https://dycxlcvxv00.github.io/baozhan-game/index-records.html
     结构：顶部栏(含 + 加角色) → 汇总统计 → 列标题条 → 角色卡片（横向一行一卡）
     列标题：4 个标签在顶部共享一次，各卡片只填数值（不重复标签文本）
     录入：每卡 4 个半透明输入框，提交后自动累计并刷新单卡与顶部汇总
     明细：卡片最右端 ▼ 展开每日明细（含当日收入=售价-人工，自动算）
     存储：localStorage 自动保存，顶部可导出/导入 JSON 备份
     ============================================================ -->
<style>
  :root{
    --bg0:#060912; --bg1:#0b1322;
    --panel:rgba(16,24,44,0.55);
    --glass:rgba(255,255,255,0.04);
    --line:rgba(125,165,225,0.16);
    --txt:#eaf0ff; --dim:#93a4c4; --mute:#6c7da0;
    --accent:#2fe6d0; --accent2:#9b7bff; --gold:#ffcf6b; --ok:#57e39b;
    --el:var(--accent);
    /* 行内布局：序号 / 角色信息 / 7 数据列 / 展开 —— 列头与卡片共用，保证对齐 */
    --c-idx:82px; --c-who:262px; --c-exp:44px;
    --cols:7;   /* 数据列数：当前剩余 / 已获取 / 已出售 / 收入 / 人工费用 / 净利润 / 秘境消耗 */
    /* 7 个数据列的总宽 = 整行宽 − 序号 − 角色信息 − 展开。汇总区复用同一条公式，
       这样顶部「角色数量」正好压住「序号＋角色信息」，后 7 项与 7 个数据列逐列对齐。 */
    --c-cells: calc(100% - var(--c-idx) - var(--c-who) - var(--c-exp));
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 50% -12%, #16243f 0%, rgba(22,36,63,0) 60%),
      radial-gradient(900px 600px at 12% 110%, rgba(34,28,72,0.55) 0%, rgba(34,28,72,0) 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    background-attachment:fixed;
    color:var(--txt); font-size:14px; line-height:1.5;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  ::selection{background:rgba(47,230,208,0.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
  ::-webkit-scrollbar-thumb{background:rgba(125,165,225,0.22);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(47,230,208,0.4)}

  .wrap{max-width:1600px;margin:0 auto;padding:22px 26px 56px}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(11px) saturate(120%); -webkit-backdrop-filter:blur(11px) saturate(120%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 4px 14px rgba(0,0,0,0.30);
    position:relative;
  }

  /* ---------- 顶部栏 ---------- */
  #topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 20px;min-height:54px;margin-bottom:14px}
  #topbar .brand{
    font-weight:800;font-size:18px;letter-spacing:1px;white-space:nowrap;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #topbar .sep{width:1px;height:22px;background:var(--line)}
  #topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    height:28px;padding:0 12px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;
    background:var(--glass);border:1px solid var(--line);color:var(--dim);font-size:12.5px;
    transition:.18s;white-space:nowrap;font-family:inherit;
  }
  button.chip{cursor:pointer}
  button.chip:hover{color:var(--txt);border-color:rgba(125,165,225,0.42)}
  .chip.on{color:var(--accent);border-color:rgba(47,230,208,0.5)}
  .chip.saved{color:var(--ok);border-color:rgba(87,227,155,0.4)}
  .chip.time{color:var(--gold);border-color:rgba(255,207,107,0.38);font-variant-numeric:tabular-nums}
  .chip.time.hit{animation:flash .7s ease}
  /* 云端同步状态：灰=待连接 / 黄=同步中 / 绿=已同步 / 红=失败 */
  .chip.cloud{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-variant-numeric:tabular-nums}
  .chip.cloud .dot{
    width:7px;height:7px;border-radius:50%;flex:none;
    background:var(--dim);box-shadow:0 0 0 3px rgba(255,255,255,0.05);
    transition:background .25s,box-shadow .25s;
  }
  .chip.cloud.syncing{color:var(--gold);border-color:rgba(255,207,107,0.38)}
  .chip.cloud.syncing .dot{background:var(--gold);animation:pulse 1s ease-in-out infinite}
  .chip.cloud.ok{color:var(--ok);border-color:rgba(87,227,155,0.4)}
  .chip.cloud.ok .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(87,227,155,0.16)}
  .chip.cloud.err{color:#ff6b6b;border-color:rgba(255,107,107,0.45)}
  .chip.cloud.err .dot{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,0.16)}
  .chip.cloud.off{opacity:.62;cursor:pointer}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  @media (max-width:1180px){ .chip.cloud{display:none} }
  /* 加号：新增角色 */
  .chip.add{
    color:var(--accent);border-color:rgba(47,230,208,0.45);background:rgba(47,230,208,0.10);
    font-weight:700;padding:0 14px;
  }
  .chip.add:hover{background:rgba(47,230,208,0.18)}
  .chip.add .plus{font-size:16px;line-height:1;font-weight:800;margin-top:-1px}
  /* 记录全部：一键提交所有卡片里填了值的录入框 */
  .chip.commitall{
    color:var(--accent);border-color:rgba(47,230,208,0.55);
    background:linear-gradient(180deg,rgba(47,230,208,0.16),rgba(47,230,208,0.08));
    font-weight:700;padding:0 14px;
  }
  .chip.commitall .tick{font-size:14px;line-height:1;font-weight:900;margin-top:-1px}
  .chip.commitall .cnt{
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(47,230,208,0.22);color:var(--accent);
    font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
    transition:.18s;
  }
  /* 有内容待提交：金色高亮 + 呼吸，提示"该记录了" */
  .chip.commitall.on{
    color:var(--gold);border-color:rgba(255,207,107,0.62);
    background:linear-gradient(180deg,rgba(255,207,107,0.22),rgba(255,207,107,0.10));
    animation:pulse 1.7s ease-in-out infinite;
  }
  .chip.commitall.on .cnt{background:rgba(255,207,107,0.3);color:var(--gold)}
  .chip.commitall:hover{transform:translateY(-1px)}
  .chip.commitall:active{transform:translateY(0) scale(0.97)}
  .chip.commitall.ok{animation:none}
  /* 今日结算：把缺的日期按明细补齐。紫色系，与青色的「记录全部」区分 */
  .chip.settle{
    color:var(--accent2);border-color:rgba(155,123,255,0.55);
    background:linear-gradient(180deg,rgba(155,123,255,0.16),rgba(155,123,255,0.07));
    font-weight:700;padding:0 14px;
  }
  .chip.settle .tick{font-size:14px;line-height:1;font-weight:900;margin-top:-1px}
  .chip.settle .cnt{
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(155,123,255,0.24);color:var(--accent2);
    font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  }
  /* 有待结算的日子：金色高亮 + 呼吸，提示"该结算了" */
  .chip.settle.on{
    color:var(--gold);border-color:rgba(255,207,107,0.62);
    background:linear-gradient(180deg,rgba(255,207,107,0.22),rgba(255,207,107,0.10));
    animation:pulse 1.7s ease-in-out infinite;
  }
  .chip.settle.on .cnt{background:rgba(255,207,107,0.3);color:var(--gold)}
  .chip.settle:hover{transform:translateY(-1px)}
  .chip.settle:active{transform:translateY(0) scale(0.97)}
  /* 今天的已结算完：变灰下沉，表示"今天不用再点了" */
  .chip.settle.done{
    color:var(--dim);border-color:rgba(125,165,225,0.24);
    background:rgba(125,165,225,0.06);animation:none;font-weight:600;
  }
  .chip.settle.done .cnt{background:rgba(125,165,225,0.16);color:var(--dim)}
  .chip.settle.done:hover{transform:none}
  /* 全屏按钮：图标随状态切换 */
  .chip.iconbtn{padding:0 10px;font-size:15px;line-height:1}
  .chip.iconbtn .fs-off{display:none}
  .chip.iconbtn.on .fs-on{display:none}
  .chip.iconbtn.on .fs-off{display:inline}
  /* 全屏态：铺满视口，内容更宽松 */
  body.fs .wrap{max-width:100%;padding:10px 16px 26px}
  body.fs #topbar{position:sticky;top:0;z-index:30}

  /* ---------- 汇总统计 ---------- */
  /* 汇总区：与下方 .colhead 同构（同为 flex + 相同的 flex 基准），
     保证任意视口宽度下都与数据列逐列对齐。
     —— 为什么不用 grid：.colhead 的 7 个数据列是 flex:1 会随视口压缩，
        而 grid 的固定 calc 列宽不会，窄视口下右侧几项会逐列偏移。
     结构：角色数量(跨 序号+角色信息) + 7 个数据格 + 展开占位 */
  #summary{
    display:flex;align-items:stretch;margin-bottom:16px;
  }
  /* 第 1 格：跨「序号 + 角色信息」，右边界正好压在「当前剩余晶石」左边界 */
  #summary .sm.s-roles{
    flex:0 0 auto;width:calc(var(--c-idx) + var(--c-who) + 1px);
    padding:11px 16px;
  }
  /* 7 个数据格：与 .cells 的 7 列同比例伸缩 */
  #summary .sm.s-data{flex:1 1 0;min-width:0}
  /* 展开按钮占位：让末项右边界与最后一个数据列一致 */
  #summary .sm.s-exp{display:block;flex:0 0 calc(var(--c-exp) + 1px);width:calc(var(--c-exp) + 1px);
    padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none}
  /* 窄视口：放弃逐列对齐，退回等分网格
     断点 1660px = .wrap 的 max-width(1600) + 左右 padding(52)，
     即视口宽到能容纳完整 1600px 内容时才启用逐列对齐 */
  @media (max-width:1660px){
    #summary{display:grid;grid-template-columns:repeat(4,1fr);column-gap:10px}
    #summary .sm.s-roles{width:auto;flex:none;padding:11px 16px}
    #summary .sm.s-data{flex:none}
    #summary .sm.s-exp{display:none}
  }
  @media (max-width:980px){
    #summary{grid-template-columns:repeat(2,1fr)}
  }
  .sm{padding:11px 16px;display:flex;flex-direction:column;gap:2px;overflow:hidden;align-items:center;text-align:center}
  .sm::after{content:none}
  .sm .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .sm .k .ico{width:14px;height:14px;flex:0 0 auto;display:inline-flex;
    align-items:center;justify-content:center;opacity:.9;color:var(--el)}
  .sm .k .ico svg{width:14px;height:14px;display:block}
  .sm .v{font-size:24px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .sm.c-roles{--el:#2fe6d0}   .sm.c-roles   .v{color:var(--accent)}
  .sm.c-left {--el:#57e39b}   .sm.c-left    .v{color:var(--ok)}
  .sm.c-gain {--el:#7fd4ff}   .sm.c-gain    .v{color:#7fd4ff}
  .sm.c-sold {--el:#9b7bff}   .sm.c-sold    .v{color:var(--accent2)}
  .sm.c-money{--el:#ffcf6b}   .sm.c-money   .v{color:var(--gold)}
  .sm.c-labor{--el:#ff8a5c}   .sm.c-labor   .v{color:#ff8a5c}
  .sm.c-net  {--el:#57e39b}   .sm.c-net     .v{color:var(--ok)}
  .sm.c-chaos{--el:#c77bff}   .sm.c-chaos   .v{color:#c77bff}
  .sm .v.neg{color:#ff6b6b !important}
  .sm .v.flash{animation:flash .7s ease}
  @keyframes flash{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}

  /* ---------- 列标题条（顶部共享一次，竖向对齐各卡片） ---------- */
  .colhead{
    display:flex;align-items:stretch;margin-bottom:6px;
    padding:0;border-radius:11px;background:rgba(255,255,255,0.028);
    border:1px solid rgba(125,165,225,0.10);
  }
  .colhead .h-idx{flex:0 0 var(--c-idx)}
  .colhead .h-who{
    flex:0 0 var(--c-who);padding:8px 14px 8px 0;
    font-size:11px;letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;
    display:flex;align-items:center;
  }
  .colhead .h-cells{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);min-width:0}
  .colhead .h-cell{
    padding:8px 12px;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--dim);
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-right:1px solid rgba(125,165,225,0.08);
    display:flex;align-items:center;justify-content:center;
  }
  .colhead .h-cell:last-child{border-right:0}
  .colhead .h-exp{flex:0 0 var(--c-exp)}

  /* ---------- 角色卡片 ---------- */
  #cards{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;flex-direction:column}
  .card{
    --el:var(--accent);
    display:flex;align-items:stretch;
    padding:0; overflow:hidden; transition:.16s;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--el);opacity:.8;pointer-events:none;z-index:2;
  }
  .card:hover{
    border-color:color-mix(in srgb,var(--el) 34%,transparent);
    box-shadow:0 4px 16px rgba(0,0,0,0.40);
  }

  /* 序号 */
  .idx{
    flex:0 0 var(--c-idx);display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--el);letter-spacing:0;gap:7px;
  }
  /* 角色信息区（靠左）—— 默认只读展示，点「修改」才变可编辑 */
  .who{
    flex:0 0 var(--c-who);min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;
    padding:8px 14px 8px 0;border-right:1px solid rgba(125,165,225,0.10);text-align:left;
  }
  /* 第一行：角色名 + 等级/职业/账号（同一行） */
  .who .line1{display:flex;align-items:baseline;gap:5px;min-width:0;flex-wrap:nowrap}
  .who .nm{
    font-size:14.5px;font-weight:800;letter-spacing:.2px;
    padding:2px 0;border-radius:6px;flex:0 0 auto;
    background:transparent;border:1px solid transparent;
    color:var(--txt);font-family:inherit;outline:none;transition:.16s;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;
  }
  .who .nm.empty{color:var(--mute);font-weight:600}
  /* 编辑态（点「修改」后）才允许输入 */
  .who.editing .nm{
    padding:2px 7px;cursor:text;flex:0 1 auto;min-width:60px;
    background:rgba(47,230,208,0.09);border-color:rgba(47,230,208,0.5);
  }
  .who .meta{display:flex;align-items:baseline;gap:5px;font-size:11.5px;color:var(--mute);min-width:0;flex:0 1 auto;overflow:hidden}
  .who .meta .lv{color:var(--gold);font-weight:700;white-space:nowrap}
  .who .meta .job{color:var(--el);white-space:nowrap;font-weight:600}
  .who .meta .acct{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;
  }
  .who .tagnone{color:var(--mute);font-size:11px;opacity:.75;white-space:nowrap}
  .who .ops{margin-left:auto;display:flex;gap:4px;align-items:center;flex:0 0 auto;align-self:center}
  .who .ob{
    height:20px;padding:0 8px;border-radius:6px;flex:0 0 auto;
    border:1px solid transparent;background:transparent;color:var(--mute);
    cursor:pointer;font-size:11px;line-height:1;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .who .ob:hover{color:var(--txt);border-color:rgba(125,165,225,0.42);background:rgba(255,255,255,0.05)}
  .who .ob.edit:hover{color:var(--accent);border-color:rgba(47,230,208,0.5);background:rgba(47,230,208,0.10)}
  .who .ob.del:hover{color:#ff8a8a;border-color:rgba(255,107,107,0.45);background:rgba(255,107,107,0.10)}
  .who.editing{border-right-color:rgba(47,230,208,0.3)}

  /* 第二行：4 个功能开关（开=绿 / 未开=灰） + 财富值 */
  .who .line2{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:nowrap}
  .feats{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .feat{
    font-size:11px;line-height:1.7;padding:1px 8px;border-radius:20px;white-space:nowrap;
    border:1px solid;font-weight:600;cursor:default;transition:.15s;
  }
  /* 未开启：灰 */
  .feat.off{color:var(--mute);border-color:rgba(125,165,225,0.18);background:rgba(255,255,255,0.02);opacity:.72}
  /* 已开启：绿 */
  .feat.on{color:var(--ok);border-color:rgba(87,227,155,0.55);background:rgba(87,227,155,0.12)}
  .wealth{
    margin-left:auto;display:flex;align-items:baseline;gap:4px;flex:0 0 auto;white-space:nowrap;
  }
  .wealth .wk{font-size:11px;color:var(--mute)}
  .wealth .wv{font-size:12.5px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums}
  .wealth .wv.neg{color:#ff6b6b}

  /* 数据 4 格：上=累计值(居中)，下=录入框 */
  .cells{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);min-width:0}
  .cell{
    padding:7px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;align-items:center;
    border-right:1px solid rgba(125,165,225,0.08);
  }
  /* 字段名：宽屏由顶部列标题条统一提供，窄屏(列标题条隐藏)才在每格内显示 */
  .cell .k{display:none;font-size:10.5px;color:var(--mute);letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cell:last-child{border-right:0}
  .cell .v{
    font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;line-height:1.15;
    text-align:center;width:100%;
  }
  .cell .v.ok{color:var(--ok)}
  .cell .v.purple{color:var(--accent2)}
  .cell .v.gold{color:var(--ok)}          /* 已出售晶石总价格 → 绿 */
  .cell .v.plain{color:#ff6b6b}           /* 人工费用 → 红 */
  .cell .v.chaos{color:#c77bff}           /* 秘境消耗晶石 → 紫 */
  .cell .v.inc{color:var(--txt)}          /* 净利润 → 正绿负红，见下 */
  .cell .v.inc.pos{color:var(--ok)}
  .cell .v.inc.neg{color:#ff6b6b}
  /* 已获取晶石：纯白偏亮，压成灰色，视觉上退到次要层级 */
  .cell .v.gain{color:var(--dim)}
  .cell .v.hit{animation:flash .7s ease}

  /* 只读格（当日收入）：上方数值 + 下方「自动」占位，与录入格等高对齐 */
  .cell.ro{position:relative}
  .cell.ro .auto{
    width:100%;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;letter-spacing:.6px;color:var(--mute);
    background:rgba(255,255,255,0.028);border:1px dashed rgba(125,165,225,0.16);
  }

  /* 半透明录入框 */
  .input{
    width:100%;height:26px;padding:0 9px;border-radius:7px;
    background:rgba(255,255,255,0.055);
    border:1px solid rgba(125,165,225,0.20);
    color:var(--txt);font-size:12.5px;font-family:inherit;
    font-variant-numeric:tabular-nums;outline:none;transition:.16s;min-width:0;
    text-align:center;
  }
  .input::placeholder{color:var(--mute);opacity:.72;font-size:11.5px}
  .input:hover{background:rgba(255,255,255,0.075);border-color:rgba(125,165,225,0.34)}
  .input:focus{
    background:rgba(47,230,208,0.09);border-color:rgba(47,230,208,0.55);
  }
  .input::-webkit-outer-spin-button,.input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .input[type=number]{-moz-appearance:textfield;appearance:textfield}

  /* ---------- 卡片内「记录」按钮（序号右侧小圆钮） ---------- */
  .btnrec{
    flex:0 0 30px;width:30px;height:30px;border-radius:50%;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(47,230,208,0.10);
    border:1px solid rgba(47,230,208,0.34);color:rgba(47,230,208,0.6);
    font-size:13px;font-family:inherit;transition:.16s;
  }
  .btnrec:hover{
    background:rgba(47,230,208,0.22);border-color:rgba(47,230,208,0.7);
    color:var(--accent);transform:scale(1.08);
  }
  .btnrec:active{transform:scale(0.94)}
  .btnrec .tick{line-height:1;font-weight:900;margin-top:-1px}
  /* 有未提交内容时高亮，提示"该记录了" */
  .btnrec.dirty{
    background:linear-gradient(180deg,rgba(255,207,107,0.26),rgba(255,207,107,0.14));
    border-color:rgba(255,207,107,0.62);color:var(--gold);
    animation:pulse 1.5s ease-in-out infinite;
    box-shadow:0 0 12px rgba(255,207,107,0.35);
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

  /* 展开按钮 */
  .expand{
    flex:0 0 var(--c-exp);display:flex;align-items:center;justify-content:center;
    background:transparent;border:0;border-left:1px solid rgba(125,165,225,0.10);
    color:var(--mute);cursor:pointer;transition:.18s;font-family:inherit;
  }
  .expand:hover{color:var(--el);background:color-mix(in srgb,var(--el) 10%,transparent)}
  .expand .arw{display:inline-block;transition:transform .25s ease;font-size:13px;line-height:1}
  .row.open .expand{color:var(--el);background:color-mix(in srgb,var(--el) 10%,transparent)}
  .row.open .expand .arw{transform:rotate(180deg)}

  /* ---------- 展开的明细区 ---------- */
  .detail{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .25s ease;margin-top:0}
  .row.open .detail{max-height:1200px;opacity:1;margin-top:6px}
  .detail-inner{padding:12px 0 13px;border-radius:12px}
  .detail-head{padding:0 14px}
  .dt-empty{padding:14px}
  .detail-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;color:var(--mute);letter-spacing:.4px}
  .detail-head .ttl2{color:var(--el);font-weight:700;font-size:12.5px}
  .detail-head .right2{margin-left:auto;display:flex;gap:8px;align-items:center}
  .mini{
    height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;cursor:pointer;
    background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--dim);
    font-family:inherit;transition:.18s;
  }
  .mini:hover{color:var(--txt);border-color:rgba(125,165,225,0.4)}
  .mini.danger:hover{color:#ff8a8a;border-color:rgba(255,107,107,0.5)}

  table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;table-layout:fixed}
  /* 列宽由 JS 按上方卡片的实际像素写入（见 syncDetailCols），保证 4 个数据列与卡片格中心对齐 */
  table.dt th{
    font-weight:600;color:var(--mute);font-size:11px;
    padding:6px 10px;border-bottom:1px solid rgba(125,165,225,0.14);white-space:nowrap;text-align:center;
    overflow:hidden;text-overflow:ellipsis;
  }
  table.dt td{padding:6px 10px;border-bottom:1px solid rgba(125,165,225,0.06);white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
  table.dt tbody tr:hover{background:rgba(255,255,255,0.025)}
  table.dt td.d{color:var(--dim)}
  table.dt td.t{color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;letter-spacing:-.2px;opacity:.92}
  table.dt td.t .wee{font-style:normal;font-family:inherit;font-size:10px;font-weight:700;
    color:var(--accent2);background:rgba(155,123,255,0.14);border-radius:4px;
    padding:1px 4px;margin-left:4px;vertical-align:1px}   /* 凌晨录入（00:00~07:59，归前一天） */
  table.dt td.n.inc{color:var(--accent)}       /* 本次获取晶石：单次增量，恒 ≥ 0 */
  table.dt th.th-t{color:var(--mute)}
  table.dt td.n{font-weight:800}
  table.dt td.n.ok{color:var(--ok)} table.dt td.n.purple{color:var(--accent2)}
  table.dt td.n.gold{color:var(--gold)} table.dt td.n.plain{color:var(--txt)}
  table.dt td.n.income{color:var(--ok)}

  table.dt td.n.zero{color:var(--mute);font-weight:600}
  table.dt td.n.inc-zero{color:var(--mute);font-weight:600}
  table.dt tfoot td{
    padding:8px 10px;font-weight:800;color:var(--txt);border-top:1px solid rgba(125,165,225,0.18);
    border-bottom:0;font-size:12.5px;
  }
  table.dt .del{
    width:22px;height:22px;border-radius:6px;border:1px solid transparent;
    background:transparent;color:var(--mute);cursor:pointer;font-size:12px;line-height:1;
    font-family:inherit;padding:0;transition:.15s;
  }
  table.dt .del:hover{color:#ff8a8a;border-color:rgba(255,107,107,0.45);background:rgba(255,107,107,0.10)}
  .dt-empty{padding:14px;text-align:center;color:var(--mute);font-size:12.5px}

  .empty-tip{padding:26px;text-align:center;color:var(--mute);font-size:13px}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);
    background:rgba(11,19,34,0.95);border:1px solid rgba(47,230,208,0.45);color:var(--accent);
    padding:9px 18px;border-radius:22px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 弹窗：新增 / 编辑角色 ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(3,6,14,0.72);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:80;
  }
  .mask.show{opacity:1;pointer-events:auto}
  .modal{
    width:440px;max-width:100%;padding:20px 22px 18px;border-radius:16px;
    transform:translateY(12px) scale(.98);transition:transform .22s cubic-bezier(.2,.9,.3,1.1);
  }
  .mask.show .modal{transform:translateY(0) scale(1)}
  .modal h2{
    margin:0 0 3px;font-size:16.5px;font-weight:800;letter-spacing:.4px;
    display:flex;align-items:center;gap:8px;
  }
  .modal h2 .bar{width:3px;height:15px;border-radius:2px;background:var(--accent);display:inline-block}
  .modal .hint{font-size:12px;color:var(--mute);margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.5px}
  .field label .req{color:var(--accent);margin-left:3px}
  .field label .tip{color:var(--mute);font-weight:400;letter-spacing:0}
  .field input{
    width:100%;height:34px;padding:0 11px;border-radius:9px;
    background:rgba(255,255,255,0.055);border:1px solid rgba(125,165,225,0.22);
    color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:.16s;
  }
  .field input::placeholder{color:var(--mute);opacity:.75;font-size:12.5px}
  .field input:hover{background:rgba(255,255,255,0.075);border-color:rgba(125,165,225,0.36)}
  .field input:focus{background:rgba(47,230,208,0.09);border-color:rgba(47,230,208,0.55)}
  .field input.bad{border-color:rgba(255,107,107,0.6);box-shadow:0 0 0 3px rgba(255,107,107,0.12)}
  .field .err{font-size:11px;color:#ff8a8a;margin-top:4px;display:none}
  .field.bad .err{display:block}
  /* 字段下面的静态说明（不是报错，常显） */
  .field .fhint{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.55}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  /* ---------- 结算结果弹窗 ---------- */
  .settle-modal{
    width:620px;max-width:100%;
    /* 弹窗本身不超视口，内部列表滚动 —— 否则补多天时会被切掉、看不到后面几天 */
    max-height:calc(100vh - 40px);display:flex;flex-direction:column;
  }
  .settle-modal .st-list{flex:1 1 auto;min-height:0}
  .settle-modal .modal-foot{flex:0 0 auto}
  .settle-modal h2 .bar{background:var(--accent2)}
  .st-list{max-height:min(56vh,460px);overflow:auto;margin:0 -4px 0 0;padding-right:4px}
  .settle-modal .st-list{max-height:none}
  .st-list::-webkit-scrollbar{width:8px}
  .st-list::-webkit-scrollbar-thumb{background:rgba(125,165,225,0.24);border-radius:4px}
  .st-list::-webkit-scrollbar-track{background:transparent}
  .st-day{
    border:1px solid rgba(125,165,225,0.18);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,0.022);
  }
  .st-day:last-child{margin-bottom:2px}
  /* 空白日：这天一条明细都没有（流水全 0、剩余沿用前值）——淡化处理 */
  .st-day.is-blank{
    background:rgba(125,165,225,0.030);
    border-style:dashed;border-color:rgba(125,165,225,0.20);
  }
  .st-day.is-blank .st-num .v{color:var(--dim)}
  .st-head{
    display:flex;align-items:center;gap:9px;margin-bottom:9px;
    font-size:13.5px;font-weight:800;color:var(--txt);
  }
  .st-head .dt{color:var(--accent2);font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .st-day.is-blank .st-head .dt{color:var(--dim)}
  .st-head .tag{
    font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:rgba(87,227,155,0.16);color:var(--ok);letter-spacing:.3px;
  }
  .st-head .tag.today{background:rgba(255,207,107,0.18);color:var(--gold)}
  .st-head .tag.blank{background:rgba(125,165,225,0.13);color:var(--mute)}
  .st-head .wk{font-size:11.5px;color:var(--mute);font-weight:600}
  .st-nums{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;
  }
  .st-num{display:flex;flex-direction:column;gap:3px;min-width:0}
  .st-num .k{font-size:10.5px;color:var(--mute);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st-num .v{font-size:14px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums}
  .st-num .v.acc{color:var(--accent)}
  .st-num .v.gold{color:var(--gold)}
  .st-num .v.pos{color:var(--ok)}
  .st-num .v.neg{color:#ff6b6b}
  .st-num .v.dim{color:var(--dim)}
  .st-roles{
    margin-top:9px;padding-top:9px;border-top:1px dashed rgba(125,165,225,0.16);
    font-size:11.5px;color:var(--dim);line-height:1.75;
  }
  .st-roles b{color:var(--txt);font-weight:700}
  .st-roles .bl{color:var(--mute);font-style:normal}
  .st-none{text-align:center;padding:26px 10px;color:var(--mute);font-size:13px;line-height:1.8}
  .st-none .big{font-size:26px;display:block;margin-bottom:8px;opacity:.6}
  @media (max-width:640px){
    .st-nums{grid-template-columns:repeat(2,1fr)}
    .settle-modal{padding:18px 16px 16px}
  }
  .mbtn{
    height:34px;padding:0 18px;border-radius:17px;font-size:13px;cursor:pointer;
    background:rgba(22,31,56,0.9);color:var(--dim);border:1px solid var(--line);
    font-family:inherit;transition:.18s;font-weight:600;
  }
  .mbtn:hover{color:var(--txt);border-color:rgba(125,165,225,0.45)}
  .mbtn.primary{
    color:#04231f;background:linear-gradient(135deg,var(--accent),#5ce8d8);
    border-color:transparent;font-weight:700;
  }
  .mbtn.primary:hover{background:linear-gradient(135deg,#46e9d6,#7ff0e2)}

  @media (max-width:1280px){ :root{--c-who:270px} }
  @media (max-width:1080px){
    .card{flex-wrap:wrap}
    .colhead .h-who{flex:1 1 160px}
    .who{flex:1 1 160px;border-right:0}
    .who .nm{min-width:0}
    .colhead .h-cells{flex:1 1 100%;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(125,165,225,0.10);--cols:2}
    .colhead .h-cell:nth-child(2n){border-right:0}
    .cells{flex:1 1 100%;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(125,165,225,0.10);--cols:2}
    .cell:nth-child(2n){border-right:0}
    .cell:nth-child(-n+4){border-bottom:1px solid rgba(125,165,225,0.08)}
    /* 窄屏：记录按钮随序号区一起放大，手指好按 */
    .expand{flex:0 0 100%;height:26px;border-left:0;border-top:1px solid rgba(125,165,225,0.10)}
    .colhead .h-exp{display:none}
    .colhead{display:none}   /* 窄屏字段名回填到每格 */
    .cell .k{display:block}
  }
  @media (max-width:720px){
    .wrap{padding:14px 12px 40px}
    #summary{grid-template-columns:repeat(2,1fr)}
    #topbar{padding:10px 14px;min-height:0;gap:10px}
    .sm .v{font-size:20px}
    .idx{flex:0 0 84px;font-size:20px;gap:9px}
    .btnrec{flex:0 0 34px;width:34px;height:34px;font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 顶部栏 ========== -->
  <header id="topbar" class="panel">
    <span class="brand">角色晶石台账</span>
    <button class="chip commitall" id="btnCommitAll" type="button"
            title="一次性记录所有卡片里填写了数值的内容">
      <span class="tick">✓</span>记录全部
      <span class="cnt" id="commitCnt">0</span>
    </button>
    <button class="chip settle" id="btnSettle" type="button"
            title="把还没结算的日期按明细补齐">
      <span class="tick">✓</span><span id="settleTxt">今日结算</span>
      <span class="cnt" id="settleCnt">0</span>
    </button>
    <span class="sep"></span>
    <span class="chip on" id="tbCount">0 个角色</span>
    <span class="chip time" id="tbChanged" title="本次数据改动时间">最后更改 --:--</span>
    <span class="chip cloud" id="tbCloud" title="点击立即与云端同步一次">
      <span class="dot" id="cloudDot"></span><span id="cloudTxt">云端待连接</span>
    </span>
    <span class="right">
      <button class="chip add" id="btnAdd" type="button" title="新增一个角色卡片"><span class="plus">＋</span>新增角色</button>
      <span class="chip saved" id="tbSaved">已自动保存</span>
      <button class="chip" id="btnExport" type="button">导出备份</button>
      <button class="chip" id="btnImport" type="button">导入备份</button>
      <button class="chip iconbtn" id="btnFull" type="button" title="全屏显示" aria-label="全屏显示">
        <span class="fs-on">⛶</span><span class="fs-off">⤡</span>
      </button>
    </span>
  </header>

  <!-- ========== 汇总统计 ========== -->
  <section id="summary"></section>

  <!-- ========== 列标题条（顶部共享一次） ========== -->
  <div class="colhead" id="colhead">
    <div class="h-idx"></div>
    <div class="h-who">角色信息</div>
    <div class="h-cells">
      <div class="h-cell">当前剩余晶石</div>
      <div class="h-cell">已获取晶石</div>
      <div class="h-cell">已出售晶石</div>
      <div class="h-cell">收入</div>
      <div class="h-cell">人工费用</div>
      <div class="h-cell">净利润</div>
      <div class="h-cell">秘境消耗晶石</div>
    </div>
    <div class="h-exp"></div>
  </div>

  <!-- ========== 角色卡片 ========== -->
  <main id="cards"></main>
  <input id="fileInput" type="file" accept="application/json,.json" hidden />

</div>

<div class="toast" id="toast"></div>

<!-- ========== 弹窗：新增 / 编辑角色（账号 / 角色名 / 职业 / 等级） ========== -->
<div class="mask" id="mask">
  <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <h2 id="mdTitle"><span class="bar"></span><span id="mdTitleTxt">新增角色</span></h2>
    <div class="hint" id="mdHint">填写以下 4 项信息，保存后生成一张角色卡片</div>

    <div class="field">
      <label for="fAccount">账号<span class="req">*</span></label>
      <input id="fAccount" type="text" maxlength="48" autocomplete="off" placeholder="登录账号，必填" />
      <div class="err">请填写账号</div>
    </div>
    <div class="field">
      <label for="fName">角色名</label>
      <input id="fName" type="text" maxlength="24" autocomplete="off" placeholder="游戏内角色名（可留空）" />
    </div>
    <div class="field">
      <label for="fJob">职业</label>
      <input id="fJob" type="text" maxlength="16" autocomplete="off" placeholder="如 法师 / 战士（可留空）" />
    </div>
    <div class="field">
      <label for="fLevel">等级</label>
      <input id="fLevel" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="如 45（可留空）" />
      <div class="err">等级请填数字</div>
    </div>
    <div class="field">
      <label for="fWealth">财富值</label>
      <input id="fWealth" type="text" inputmode="decimal" maxlength="16" autocomplete="off" placeholder="如 12000（可留空）" />
      <div class="err">财富值请填数字</div>
    </div>
    <div class="field">
      <label for="fInitLeft">初始存量晶石</label>
      <input id="fInitLeft" type="text" inputmode="decimal" maxlength="16" autocomplete="off" placeholder="开始记流水时已有多少（可留空）" />
      <div class="err">初始存量请填数字</div>
      <div class="fhint">留空或填 0 时，第一条录入会整条算作「本次获取」。想让首条只算增量，就填上开始记流水时手里的晶石数。</div>
    </div>

    <div class="modal-foot">
      <button class="mbtn" type="button" id="mdCancel">取消</button>
      <button class="mbtn primary" type="button" id="mdOk">确定</button>
    </div>
  </div>
</div>

<!-- ========== 弹窗：结算结果 ========== -->
<div class="mask" id="settleMask">
  <div class="modal panel settle-modal" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <h2 id="stTitle"><span class="bar"></span><span id="stTitleTxt">结算完成</span></h2>
    <div class="hint" id="stHint">已按明细补齐缺失日期</div>
    <div class="st-list" id="stList"></div>
    <div class="modal-foot">
      <button class="mbtn" type="button" id="stClose">知道了</button>
    </div>
  </div>
</div>

<!-- 数据文件名。单独放一个 script（而不是写在下面的大脚本里），是为了让它
     在「任何页面脚本跑之前」就已是可读的全局值。
     端到端测试另有一个更靠网络层的钩子 window.__DATA_FILENAME__（见下面
     dataFilename() 的注释），优先于这个变量。
     页面自己只用这一个变量，改成别的值不影响正常使用。 -->
<script>window.__DATA_PATH__ = 'data.json';</script>

<script>
/* ============================================================
 * 数据区 —— 初始角色（其余角色用顶部 ＋ 按钮新增）
 * ------------------------------------------------------------
 * 两类字段语义不同：
 *   ① 时点状态「当前剩余晶石」—— 以最新一条录入为准（覆盖，不累加）
 *      录多少就是当前还剩多少，代表盘点实际值
 *   ② 流水「已出售 / 收入 / 人工费用 / 秘境消耗」—— 基准值 + 明细累加
 *      代表"累计发生了多少"
 *   id        内部唯一标识
 *   account   账号（可留空，即在卡片「角色名」处直接录入）
 *   name      角色名
 *   level     等级    job 职业
 *   gemsLeft / gemsSold / soldValue / laborCost / chaosCost  历史累计基准
 *   initLeft  初始存量：开始记流水之前手里已有的晶石，用作首条记录的起算基准
 *   records[] 明细 [{date, time, gemsLeft, daySold, dayValue, dayLabor, chaosCost}]
 * ============================================================ */
let ACCOUNTS = [
  { id:'a1', account:'', name:'', level:'', job:'',
  gemsLeft:0, gemsSold:0, soldValue:0, laborCost:0, chaosCost:0,
  wealth:0, initLeft:0, records:[], flags:{} }
];

/* 日结快照库：{ '2026-09-23': {date, accounts:[...], total:{...}}, ... }
 * 与 ACCOUNTS 一起存进 localStorage / 云端 data.json */
let SNAPSHOTS = {};

const RING_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function serial(n){ return n <= 10 ? RING_NUMS[n-1] : String(n); }
const THEME = ['#2fe6d0','#9b7bff','#ffcf6b','#7fd4ff','#ff8a5c','#57e39b','#c77bff','#ff6b6b'];

/* ============================================================
 * 工具
 * ============================================================ */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 数字：无千分号 */
function num(n){
  const v = Number(n) || 0;
  if (Number.isInteger(v)) return String(v);
  return String(Math.round(v * 100) / 100);
}
function intNum(n){ return num(Math.round(Number(n) || 0)); }
function money(n){ return '¥' + num(n); }
function today(){
  /* 结算日：每日 08:00 为一天的起点 —— 凌晨 0:00~7:59（熬夜时段）的录入
     仍归属前一天，快照、「今日结算」、自动结算全部按这个口径。
     录入的 date 字段由 pushRec 写入 today()，因此归属天然一致。
     历史已生成的快照不受影响（已固化的不重算，重算也只由数据变化驱动）。 */
  const d = new Date(), p = x => String(x).padStart(2,'0');
  if(d.getHours() < 8) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
/* 日期加减天数：'2026-09-23' + 1 → '2026-09-24'。用 UTC 运算避开时区/夏令时干扰 */
function addDays(dateStr, n){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ''));
  if(!m) return '';
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  d.setUTCDate(d.getUTCDate() + (Number(n) || 0));
  const p = x => String(x).padStart(2,'0');
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth()+1) + '-' + p(d.getUTCDate());
}
/* 闭区间日期列表：dateRange('2026-09-18','2026-09-22') → 5 个日期（含首尾） */
function dateRange(from, to){
  const out = [];
  let cur = String(from || ''), end = String(to || '');
  if(!cur || !end || cur > end) return out;
  let guard = 0;
  while(cur <= end && guard++ < 4000){ out.push(cur); cur = addDays(cur, 1); }
  return out;
}
/* 当前时间 HH:MM:SS —— 录入明细时一并写入，精确到秒 */
function nowTime(){
  const d = new Date(), p = x => String(x).padStart(2,'0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
/* 排序用：把「日期 + 时间」拼成可比字符串；旧记录无 time 视为 00:00:00 */
function recStamp(r){ return String(r.date || '') + ' ' + String(r.time || '00:00:00'); }
/* 净利润（单条记录） = 收入 − 人工费用 */
function income(r){ return (Number(r.dayValue)||0) - (Number(r.dayLabor)||0); }
function incomeText(r){ const v = income(r); return (v > 0 ? '+' : '') + num(v); }

/* 汇总角色数据
 * 「当前剩余晶石」= 时点状态 —— 以最新一条录入为准（覆盖，不累加）
 * 其余 4 项 = 流水 —— 基准值 + 明细累加
 * 字段：gemsLeft 当前剩余 / gemsSold 已出售 / soldValue 收入 /
 *       laborCost 人工费用 / chaosCost 秘境消耗晶石 */
function totals(c){
  /* 流水字段：累加 */
  const t = { gemsLeft:0, gemsSold:Number(c.gemsSold)||0,
              soldValue:Number(c.soldValue)||0, laborCost:Number(c.laborCost)||0,
              chaosCost:Number(c.chaosCost)||0 };
  (c.records||[]).forEach(function(r){
    t.gemsSold  += Number(r.daySold)   || 0;
    t.soldValue += Number(r.dayValue)  || 0;
    t.laborCost += Number(r.dayLabor)  || 0;
    t.chaosCost += Number(r.chaosCost) || 0;
  });
  /* 剩余：取时序上最后一条录入的值；没有明细时退回基准值 */
  t.gemsLeft = latestLeft(c);
  return t;
}

/* 按时间升序排列明细
 * 注意：日期+时间只精确到秒，同一秒内可能有多条，排序结果不稳定。
 * 而 records 数组本身是「只追加」的，天然就是录入顺序，
 * 因此以「数组下标」为主键、时间为辅键排序，保证同一秒内也按录入先后排列。 */
function recsAsc(c){
  return (c.records||[]).map(function(r, i){ return { r:r, i:i }; })
    .sort(function(a, b){
      const ka = recStamp(a.r) + '#' + String(a.i).padStart(6,'0');
      const kb = recStamp(b.r) + '#' + String(b.i).padStart(6,'0');
      return ka.localeCompare(kb);
    })
    .map(function(x){ return x.r; });
}
/* 最新一次的剩余晶石 —— 时序上最后一条；无明细则为基准值 */
function latestLeft(c){
  const recs = c.records || [];
  if(!recs.length) return Number(c.gemsLeft) || 0;
  const asc = recsAsc(c);
  return Number(asc[asc.length - 1].gemsLeft) || 0;
}

/* 已获取晶石 = 逐条累加「本条剩余 − 上一条剩余」，但只统计「增长」
 * ------------------------------------------------------------
 * 规则：
 *   本次剩余 > 上次剩余  → 差值即为本次获取的晶石，累加
 *   本次剩余 ≤ 上次剩余  → 说明只是卖出 / 自己消耗了，本次获取记 0
 * 因此结果恒 ≥ 0，不会出现负数。
 * 用 recsAsc() 保证按录入先后遍历（同一秒内也稳定）。
 *
 * 基准值 leftBase()：首条记录的参考起点。
 *   角色可以填「初始存量」——就是开始记流水之前手里已经有的晶石。
 *   填了它，首条就从它起算，不会把老本算成「今天获取的」。
 *   没填（=0）则退回老行为：首条相对 0，整条都算作本次获取。
 * ------------------------------------------------------------
 * 单条增量（供明细表逐条展示）：返回 deltas[]，与 recsAsc() 同序。 */
function gainedDeltas(c){
  const recs = recsAsc(c);
  const out = [];
  let prev = leftBase(c);
  recs.forEach(function(r){
    const cur  = Number(r.gemsLeft) || 0;
    const diff = cur - prev;
    out.push(diff > 0 ? diff : 0);   /* 下降/持平 → 本次获取 0 */
    prev = cur;
  });
  return out;
}
/* 首条记录的参考起点 = 角色的「初始存量」（老数据没有则 0） */
function leftBase(c){
  return Number(c && c.initLeft) || 0;
}
function gained(c){
  return gainedDeltas(c).reduce(function(a, b){ return a + b; }, 0);
}

/* 净利润 = 收入 − 人工费用（角色级） */
function netProfit(c){ const t = totals(c); return t.soldValue - t.laborCost; }

/* 顶部汇总：gemsLeft = 各角色「最新剩余」相加（盘库总额），其余为流水累加 */
function summarize(list){
  return list.reduce(function(a,c){
    const t = totals(c);
    a.gemsLeft += t.gemsLeft; a.gemsSold += t.gemsSold;
    a.soldValue += t.soldValue; a.laborCost += t.laborCost;
    a.chaosCost += t.chaosCost; a.gained += gained(c);
    a.profit += (t.soldValue - t.laborCost);
    return a;
  }, { roles:list.length, gemsLeft:0, gained:0, gemsSold:0,
       soldValue:0, laborCost:0, profit:0, chaosCost:0 });
}
/* 已废弃：保留仅为兼容旧引用，实际使用 netProfit() */
function roleIncome(c){ return netProfit(c); }

/* ============================================================
 * 日结快照（按明细日期分天）
 * ------------------------------------------------------------
 * 用途：每天第一次打开页面，点一下「今日结算」把缺的日子补上。
 *       连续几天没打开也没关系，一次把缺的全部补齐。
 *
 * 统计口径：
 *   把每条明细按 date 归到那一天，**当天单独算一套指标**。
 *   「本次获取」每天独立从 0 起算（不接前一天的末尾）：
 *     当天按时间升序逐条比较剩余，增长才计，下降/持平记 0。
 *   完全没录入明细的日子 → 跳过，不生成快照。
 *
 * 字段与 totals() 保持一致，但不含「基准值」——
 *   快照只反映「当天录入的明细」，基准值是账号初始值，不属于某一天。
 * ============================================================ */

/* 把某角色的明细按日期分组 → { '2026-09-23': [rec, ...] }，各天内按录入先后排序 */
function groupRecordsByDate(c){
  const asc = recsAsc(c);
  const map = {};
  asc.forEach(function(r){
    const d = String(r.date || '').trim();
    if(!d) return;
    if(!map[d]) map[d] = [];
    map[d].push(r);
  });
  return map;
}

/* 算某角色「某一天的明细集合」的指标
 * 与 totals() 同口径，但只吃传入的这些记录，且不叠加基准值。
 *
 * 关键：prev 的起点 = **当天第一条之前的那一条**（可能是几天前录的）——
 *   9/21 剩100 → 9/23 剩150（9/22 没录）
 *     9/21：prev = 初始存量        → 增长 100
 *     9/23：prev = 100（取自 9/21）→ 增长  50      ← 不再把 150 整条算成当天获取
 * 若当天就是首条，则以「初始存量」leftBase() 起算。 */
function dayTotals(c, dayRecs){
  const t = { gemsLeft:0, gained:0, gemsSold:0, soldValue:0,
              laborCost:0, profit:0, chaosCost:0, recordCount:0 };
  if(!dayRecs || !dayRecs.length) return t;
  /* 当天第一条的起点：找它在全量时序里的前一条 */
  const asc = recsAsc(c);
  const first = dayRecs[0];
  const gi = asc.indexOf(first);
  let prev = (gi > 0)
    ? (Number(asc[gi - 1].gemsLeft) || 0)     /* 接上上一条（可能在前几天） */
    : leftBase(c);                            /* 真是首条 → 用初始存量 */
  dayRecs.forEach(function(r){
    const cur = Number(r.gemsLeft) || 0;
    const diff = cur - prev;
    if(diff > 0) t.gained += diff;      /* 只统计增长 */
    prev = cur;
    t.gemsSold  += Number(r.daySold)   || 0;
    t.soldValue += Number(r.dayValue)  || 0;
    t.laborCost += Number(r.dayLabor)  || 0;
    t.chaosCost += Number(r.chaosCost) || 0;
    t.recordCount++;
  });
  /* 当天最后一条的剩余 = 当天收工时的存量 */
  t.gemsLeft = Number(dayRecs[dayRecs.length - 1].gemsLeft) || 0;
  t.profit = t.soldValue - t.laborCost;
  return t;
}

/* 求「某一天的起始存量」= 该天之前最后一条分录的剩余。
 * 传 null 表示求「全时段末尾」的存量。
 * 用途：给空白天找它当天的存量（沿用之前最后一次录入的值）。 */
function priorLeft(c, dateOrNull){
  const asc = recsAsc(c);
  if(!asc.length) return Number(c && c.gemsLeft) || 0;
  if(!dateOrNull){                            /* 末尾：最后一条的剩余 */
    return Number(asc[asc.length - 1].gemsLeft) || 0;
  }
  /* 在这天之前（不含这天）的最后一条 —— 按日期比较，跨天也成立 */
  const d = String(dateOrNull);
  let found = null;
  for(let i = 0; i < asc.length; i++){
    const rd = String(asc[i].date || '').trim();
    if(rd && rd < d) found = Number(asc[i].gemsLeft) || 0;
  }
  if(found !== null) return found;
  /* 这天之前没有任何记录 → 用初始存量（可能为 0） */
  return leftBase(c);
}

/* 空白天：某个角色当天一条明细都没有
 * 生成的仍是一条「在册」记录，只是各项流水为 0、
 * 剩余沿用这天的起始存量。 */
function blankDayTotals(c, date){
  const t = { gemsLeft:0, gained:0, gemsSold:0, soldValue:0,
              laborCost:0, profit:0, chaosCost:0, recordCount:0 };
  t.gemsLeft = priorLeft(c, date);
  return t;
}

/* 生成「某一天」的完整快照
 * ------------------------------------------------------------
 * 两种日子：
 *   有明细 → 该角色算当天的实际指标
 *   空 白 → 该角色仍**在册**（列出来），但流水全 0、剩余沿用之前的存量
 *           ——「空白天也给一张快照」的需求，保证日历不断档。
 * 一天一个角色都没有在册 → 返回 null（不该发生，日期区间由 settle 保证） */
function snapshotForDay(date, accounts){
  const rows = [];
  const total = { roles:0, gemsLeft:0, gained:0, gemsSold:0,
                  soldValue:0, laborCost:0, profit:0, chaosCost:0, recordCount:0 };

  (accounts || ACCOUNTS).forEach(function(c){
    const byDate = groupRecordsByDate(c);
    const dayRecs = byDate[date];
    /* 角色要「这天之前已经出现过」才在册 ——
       否则新建角色会把历史上每一天都补出一条空记录 */
    const firstDate = firstRecordDate(c);

    let t, hasRecs = !!(dayRecs && dayRecs.length);
    if(hasRecs){
      t = dayTotals(c, dayRecs);
    }else{
      /* 从没录入过，或这天早于它的首条记录 → 这天与它无关，跳过 */
      if(!firstDate || date < firstDate) return;
      t = blankDayTotals(c, date);            /* 空白天：在册、流水 0 */
    }

    rows.push({
      id: c.id, account: c.account, name: c.name,
      level: c.level, job: c.job,
      gemsLeft:  t.gemsLeft,   gained:  t.gained,
      gemsSold:  t.gemsSold,   soldValue: t.soldValue,
      laborCost: t.laborCost,  profit:  t.profit,
      chaosCost: t.chaosCost,  recordCount: t.recordCount,
      blank: !hasRecs                          /* 标记：这天空白 */
    });
    total.gemsLeft  += t.gemsLeft;   total.gained   += t.gained;
    total.gemsSold  += t.gemsSold;   total.soldValue += t.soldValue;
    total.laborCost += t.laborCost;  total.profit   += t.profit;
    total.chaosCost += t.chaosCost;  total.recordCount += t.recordCount;
  });

  if(!rows.length) return null;                 /* 这一天谁都还没在册 → 不生成 */
  total.roles = rows.length;

  return {
    date: date,
    generatedAt: new Date().toISOString(),
    device: (typeof DEVICE === 'string' ? DEVICE : ''),
    accounts: rows,
    total: total
  };
}

/* 列出「有明细的所有日期」，升序 */
function allRecordDates(accounts){
  const set = {};
  (accounts || ACCOUNTS).forEach(function(c){
    (c.records || []).forEach(function(r){
      const d = String(r.date || '').trim();
      if(d) set[d] = true;
    });
  });
  return Object.keys(set).sort();
}

/* 某角色最早一条明细的日期（没有则返回 ''） */
function firstRecordDate(c){
  const asc = recsAsc(c);
  for(let i = 0; i < asc.length; i++){
    const d = String(asc[i].date || '').trim();
    if(d) return d;
  }
  return '';
}

/* 要结算的完整日期区间 = 首条明细那天 → 今天（含首尾）
 * 「空白天也给一张快照」—— 所以区间中间一天都不漏。
 * 若首条明细在未来（日期填错），退化为只有那几天，不会拉出长城。 */
function settleRange(accounts){
  const all = allRecordDates(accounts);
  if(!all.length) return [];
  const from = all[0];
  const t = today();
  const to = (from > t) ? all[all.length - 1] : t;   /* 正常情况补到"今天" */
  return dateRange(from, to);
}

/* 扫描：哪些日期还没有快照？
 * 返回 { missing:[日期...], all:[日期...], done:[日期...] } */
function pendingSettleDates(accounts, snaps){
  const all = settleRange(accounts);
  const have = snaps || SNAPSHOTS || {};
  const missing = all.filter(function(d){ return !have[d]; });
  const done = all.filter(function(d){ return !!have[d]; });
  return { missing: missing, all: all, done: done };
}

/* 执行结算：补齐所有缺失日期（含无录入的"空白天"）
 * 返回 { added:[{date, snap}...], skipped:[日期...], missingBefore:[...] } */
function settle(accounts, snaps){
  const store = snaps || SNAPSHOTS || {};
  const pend = pendingSettleDates(accounts, store);
  const added = [], skipped = [];

  pend.missing.forEach(function(d){
    const snap = snapshotForDay(d, accounts);
    if(snap){
      store[d] = snap;
      added.push({ date: d, snap: snap });
    }else{
      skipped.push(d);                       /* 那天所有角色都还没在册 → 理论不会走到 */
    }
  });

  added.sort(function(a, b){ return a.date.localeCompare(b.date); });
  return { added: added, skipped: skipped, missingBefore: pend.missing };
}

/* 已结算的日期列表（升序） */
function settledDates(){
  return Object.keys(SNAPSHOTS || {}).sort();
}

/* 自动快照：不用手动点「今日结算」，页面在恰当时机自己补齐/刷新
 * ------------------------------------------------------------
 * 由调用方在四个时机触发（本函数只管算，不落库不推送）：
 *   启动加载后 / 云端数据 adopt 后 / 每次录入提交后 / 手动拉取云端后
 *
 * 规则：
 *   1. 历史缺的天（含空白天）→ 补齐 —— 与手动结算同口径（settle 的逻辑）
 *   2. 已有快照的日期 → 全部重算一遍，但**内容比较**：
 *      数值由明细算出而明细只追加不改 → 正常重算结果与旧快照一致，视为没动；
 *      只有数据真的变了才覆盖（跨天补录、改名/改初始存量等都能自然跟上）。
 *   3. 「今天」→ 总是重算：当天反复录入，快照始终反映最新状态。
 *
 * 为什么敢全量重算：snapshotForDay 是纯函数（数据不变结果不变），
 *   sameContent 剔除 generatedAt / device 两个"生成痕迹"字段 —— 内容没变
 *   就不动旧快照（generatedAt 保持首次生成时间），也不会触发多余推送。
 *   个人台账量级（几十天 × 几角色）全量重算是毫秒级，无需增量优化。
 *
 * 返回 { added:[日期...], refreshed:[日期...] }，由调用方决定落库与提示。 */
function autoSettle(){
  const out = { added:[], refreshed:[] };
  if(!ACCOUNTS.length) return out;
  const store = SNAPSHOTS || {};
  const t = today();

  function sameContent(a, b){
    return JSON.stringify({ ac:a.accounts, tt:a.total })
        === JSON.stringify({ ac:b.accounts, tt:b.total });
  }
  function put(d){
    const s = snapshotForDay(d, ACCOUNTS);
    if(!s) return;                              /* 那天谁都还没在册 → 无从生成 */
    if(!store[d]){ store[d] = s; out.added.push(d); }
    else if(!sameContent(store[d], s)){ store[d] = s; out.refreshed.push(d); }
    /* 内容一致 → 保持原样（不换 generatedAt，也不触发推送） */
  }

  /* 1) 历史缺失天（今天单独走规则 3） */
  pendingSettleDates(ACCOUNTS, store).missing.forEach(function(d){
    if(d !== t) put(d);
  });

  /* 2) 已有快照的日期全部重算 + 内容比较（幂等） */
  Object.keys(store).forEach(function(d){
    if(d !== t) put(d);
  });

  /* 3) 今天：总是重算 */
  put(t);

  return out;
}

/* ============================================================
 * 存储
 * ============================================================ */
const LS_KEY = 'gem-ledger-v2';

/* 最后更改时间 = 本次数据改动时间（不是实时时钟）
 * 只在真正写入数据时更新，刷新页面后保持为上次改动时间 */
function fmtChangeTime(d){
  const p = function(x){ return String(x).padStart(2,'0'); };
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' '
       + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function stampChanged(el){
  const box = el || document.getElementById('tbChanged');
  if(!box) return;
  box.textContent = '最后更改 ' + fmtChangeTime(new Date());
  box.classList.remove('hit'); void box.offsetWidth; box.classList.add('hit');
}
/* 刷新页面后：从 localStorage 恢复上次改动时间 */
function restoreChanged(iso){
  const box = document.getElementById('tbChanged');
  if(!box) return;
  if(!iso){ box.textContent = '最后更改 --:--'; return; }
  const d = new Date(iso);
  if(isNaN(d.getTime())){ box.textContent = '最后更改 --:--'; return; }
  box.textContent = '最后更改 ' + fmtChangeTime(d);
  box.title = '本次数据改动时间：' + d.toLocaleString('zh-CN', {hour12:false});
}

function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      v:DATA_V, savedAt:new Date().toISOString(), updatedBy:DEVICE,
      snapshots: SNAPSHOTS || {},
      accounts: ACCOUNTS.map(function(c){
        return { id:c.id, account:c.account, name:c.name, level:c.level, job:c.job,
                 gemsLeft:c.gemsLeft, gemsSold:c.gemsSold, soldValue:c.soldValue,

      })
    }));
    stampChanged();
    flashSaved();
    schedulePush();          /* 本地先落地，云端防抖合并推送 */
  }catch(e){}
}
function loadLocal(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){ return null; }
  if(!raw) return null;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return null; }
  if(!data || !Array.isArray(data.accounts) || !data.accounts.length) return null;
  ACCOUNTS = data.accounts.map(function(s, i){
    return {
      id: s.id || ('a' + (i+1)),

      level: s.level != null ? s.level : '', job: s.job || '',
      gemsLeft: Number(s.gemsLeft)||0, gemsSold: Number(s.gemsSold)||0,
      soldValue: Number(s.soldValue)||0, laborCost: Number(s.laborCost)||0,
      chaosCost: Number(s.chaosCost)||0,
      wealth: Number(s.wealth)||0,
      initLeft: Number(s.initLeft)||0,
      records: Array.isArray(s.records) ? s.records.map(function(r){
        /* 兼容旧记录：缺 time 补 00:00:00，缺 chaosCost 补 0 */
        return { date:r.date || '', time:r.time || '00:00:00',
                 gemsLeft:Number(r.gemsLeft)||0, daySold:Number(r.daySold)||0,
                 dayValue:Number(r.dayValue)||0, dayLabor:Number(r.dayLabor)||0,

  /* 日结快照：老数据没有这个字段，补空对象 */
  SNAPSHOTS = (data.snapshots && typeof data.snapshots === 'object' && !Array.isArray(data.snapshots))
            ? data.snapshots : {};
  return data.savedAt || null;   /* 返回上次改动时间，供顶部标签恢复 */
}

/* ============================================================
 * 云端同步（GitHub 私有仓库 baozhan-data / data.json）
 * ------------------------------------------------------------
 *   读取：打开页面时拉一次；若云端 savedAt 比本地新，用云端覆盖本地
 *   写入：任何改动 → localStorage（立刻）+ 云端（防抖 1.2s 合并推送）
 *   冲突：以 savedAt 较新的一方为准（最后写入者胜）
 *   离线：推送失败不清本地数据，下次改动重试；点状态胶囊可手动重试
 *
 * 安全说明：GitHub token 不写在页面里，统一由 Cloudflare Worker 保管。
 *   页面只知道 Worker 地址，拿不到 token，也就无法被扒走。
 *   Worker 源码见仓库 worker/proxy.js，部署步骤见维护文档第五章。
 * ============================================================ */
const CFG = {
  /* Worker 地址：形如 https://xxx.yyy.workers.dev
     部署好 Worker 后把地址填在这里（末尾不要带斜杠）
     也支持用 URL 参数临时指定，不改代码就能试：
       .../index-records.html?cloud=https://xxx.yyy.workers.dev */
  api   : '',
  owner : 'dycxlcvxv00',
  repo  : 'baozhan-data',
  path  : (typeof window !== 'undefined' && window.__DATA_PATH__) || 'data.json',
  token : '',                 /* 仅本机调试可填；填了会被 GitHub 推送保护拦下，别提交 */
  branch: 'main'
};
/* URL 上的 ?cloud= 优先于源码里的配置（方便部署后立即验证） */
(function(){
  try{
    const q = new URLSearchParams(location.search).get('cloud');
    if(q) CFG.api = q.trim().replace(/\/+$/, '');
    else if(window.__WORKER__) CFG.api = String(window.__WORKER__).replace(/\/+$/, '');
  }catch(e){}
})();
/* 数据版本：v3 起与云端结构对齐 */
const DATA_V = 3;

/* 本设备的固定标识，写进 updatedBy，便于看出是哪台设备改的 */
const DEVICE = (function(){
  let d = '';
  try{ d = localStorage.getItem('gem-ledger-device') || ''; }catch(e){}
  if(!d){
    d = '设备-' + Math.random().toString(36).slice(2, 7);
    try{ localStorage.setItem('gem-ledger-device', d); }catch(e){}
  }
  return d;
})();

/* 从 ACCOUNTS + SNAPSHOTS 抽出可序列化的一份 */
function serialize(){
  return {
    v: DATA_V,
    savedAt: new Date().toISOString(),
    updatedBy: DEVICE,
    snapshots: SNAPSHOTS || {},
    accounts: ACCOUNTS.map(function(c){
      return { id:c.id, account:c.account, name:c.name, level:c.level, job:c.job,
               gemsLeft:c.gemsLeft, gemsSold:c.gemsSold, soldValue:c.soldValue,
               laborCost:c.laborCost, chaosCost:c.chaosCost||0, wealth:Number(c.wealth)||0,
                 initLeft:Number(c.initLeft)||0,
               records:c.records || [], flags:c.flags || {} };
    })
  };
}

/* --- 状态胶囊 --- */
function cloudUI(state, text){
  const chip = document.getElementById('tbCloud');
  const txt  = document.getElementById('cloudTxt');
  if(!chip) return;
  chip.classList.remove('syncing','ok','err','off');
  if(state) chip.classList.add(state);
  if(txt && text) txt.textContent = text;
}
function cloudTime(){
  return new Date().toLocaleTimeString('zh-CN', {hour12:false}).slice(0,5);
}

/* --- 云端读写 --- */
/* base64 编解码（直连 GitHub 时用；Worker 模式下不涉及）—— 中文安全 */
function b64encode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64decode(b64){
  return decodeURIComponent(escape(atob(String(b64).replace(/\s/g, ''))));
}

/* 两种后端：优先 Worker 中转（token 在服务端），否则直连 GitHub（本机调试） */
function apiBase(){
  if(CFG.api) return CFG.api.replace(/\/+$/, '');
  return '';
}
function useWorker(){ return !!apiBase(); }

/* 端点：Worker 模式下是 /data.json，直连模式下是 GitHub Contents API
 *
 * __DATA_FILENAME__ 是给端到端测试留的「网络层改写钩子」：
 * 测试要把数据文件换成 data.test.json（与正式数据隔离），这件事只能在
 * 页面加载前、由网络层决定 —— 页面的 CFG.path 是常量，而 cloudInit() 在页面
 * 加载瞬间就按它去拉云端，等测试跑到 page.evaluate 再改路径，首次拉取早已发出。
 * 不设这个钩子时，行为与从前完全一致（就是 CFG.path = data.json）。 */
function dataFilename(){
  return (typeof window !== 'undefined' && window.__DATA_FILENAME__) || CFG.path;
}
function readURL(){
  const b = apiBase();
  return (b ? b + '/' + dataFilename() : 'https://api.github.com/repos/' + CFG.owner + '/' + CFG.repo + '/contents/' + dataFilename())
         + '?t=' + Date.now();
}
function writeURL(){
  const b = apiBase();
  return b ? b + '/' + dataFilename()
           : 'https://api.github.com/repos/' + CFG.owner + '/' + CFG.repo + '/contents/' + dataFilename();
}
function cloudHeaders(){
  if(useWorker()) return { 'Content-Type':'application/json' };
  return { 'Authorization':'Bearer ' + CFG.token,
           'Accept':'application/vnd.github+json',
           'Content-Type':'application/json' };
}
/* Worker 返回 { data, sha }；GitHub 返回 { content(base64), sha } —— 统一成 { data, sha, raw } */
function normalizeRead(j){
  if(!j) return { data:null, sha:'', raw:null };
  if(typeof j === 'object' && ('data' in j || 'sha' in j) && !('content' in j)){
    return { data: j.data || null, sha: j.sha || '', raw: j };
  }
  let data = null;
  if(j && j.content){
    try{ data = JSON.parse(b64decode(j.content)); }catch(e){ data = null; }
  }
  return { data:data, sha:(j && j.sha) || '', raw:j };
}

/* 拉取云端数据 → {data, sha, raw}；无文件时 {data:null, sha:'', raw:null} */
async function cloudPull(){
  const r = await fetch(readURL(), { headers: cloudHeaders(), cache:'no-store' });
  if(r.status === 404) return { data:null, sha:'', raw:null };
  if(!r.ok){
    const e = await r.json().catch(function(){ return {}; });
    throw new Error('拉取失败 ' + r.status + (e && e.message ? '：' + e.message : ''));
  }
  return normalizeRead(await r.json());
}

/* 推送本地数据 → 整份覆盖 data.json */
async function cloudPush(payload){
  let body;
  if(useWorker()){
    /* Worker 自己处理 sha，页面只管交数据 */
    body = JSON.stringify({ data: payload, by: DEVICE });
  }else{
    const { sha } = await cloudPull();          /* 先拿最新 sha，避免 409 */
    body = JSON.stringify({
      message: 'data: ' + (payload.savedAt || '').replace('T',' ').slice(0,19)
               + ' · ' + (payload.accounts || []).length + ' 个角色 · ' + DEVICE,
      content: b64encode(JSON.stringify(payload, null, 2) + '\n'),
      branch: CFG.branch,
      ...(sha ? { sha } : {})
    });
  }
  const r = await fetch(writeURL(), { method:'PUT', headers: cloudHeaders(), body: body });
  if(!r.ok){
    const e = await r.json().catch(function(){ return {}; });
    throw new Error('推送失败 ' + r.status + (e && e.message ? '：' + e.message : ''));
  }
  return r.json();
}

/* 把云端 accounts + snapshots 灌进内存 */
function adopt(data){
  ACCOUNTS = (data.accounts || []).map(function(s, i){
    return {
      id: s.id || ('a' + (i+1)),
      account: s.account || '', name: s.name || '',
      level: s.level != null ? s.level : '', job: s.job || '',
      gemsLeft: Number(s.gemsLeft)||0, gemsSold: Number(s.gemsSold)||0,
      soldValue: Number(s.soldValue)||0, laborCost: Number(s.laborCost)||0,
      chaosCost: Number(s.chaosCost)||0,
      wealth: Number(s.wealth)||0,
      initLeft: Number(s.initLeft)||0,
      records: Array.isArray(s.records) ? s.records.map(function(r){
        return { date:r.date || '', time:r.time || '00:00:00',
                 gemsLeft:Number(r.gemsLeft)||0, daySold:Number(r.daySold)||0,
                 dayValue:Number(r.dayValue)||0, dayLabor:Number(r.dayLabor)||0,
                 chaosCost:Number(r.chaosCost)||0 };
      }) : [],
      flags: (s.flags && typeof s.flags === 'object') ? s.flags : {}
    };
  });
  SNAPSHOTS = (data.snapshots && typeof data.snapshots === 'object' && !Array.isArray(data.snapshots))
            ? data.snapshots : {};
}

function writeCache(data){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
}

/* 防抖推送：连续改动合并成一次网络请求
 * 失败会自动退避重试（3s → 8s → 20s → 60s），断网恢复后无需手动点。
 * 重试用尽后停手，但 pushPending 保持 true，用户下次改动或点胶囊即可续推。 */
let pushTimer = null, pushPending = false, pushRetry = 0, retryTimer = null;
const RETRY_DELAYS = [3000, 8000, 20000, 60000];

/* 改动序号：每产生一次待推送的改动就 +1。
 *
 * 为什么需要它（修的是一个真实的数据丢失竞态）：
 *   doPush() 里有 await cloudPush() —— 请求在飞的这段时间（几十毫秒到几秒），
 *   用户完全可能又改了一次，schedulePush() 会正确地再次 pushPending = true、
 *   再排一次 doPush。可是等在飞的那个请求回来时，老代码会**无条件**
 *   pushPending = false，把用户刚产生的那次改动标记给抹掉。
 *   接着下一次 doPush() 一进来看到 pushPending 已是 false，直接 return ——
 *   于是最后那次改动永远推不上去，本地看着是对的、云端是旧的。
 *   （端到端测试里每跑必现：结算 → 追录 → 再结算，最后一份快照进不了云端。）
 * 修法：推送前记下序号，回来时若序号已经变了，说明推送期间有新改动，
 *   就不能清 pushPending，而要立刻再推一次。 */
let pushSeq = 0;

function schedulePush(delay){
  if(!useWorker() && !CFG.token) return;    /* 纯本地模式不推送 */
  pushPending = true;
  pushSeq++;
  clearTimeout(retryTimer);
  cloudUI('syncing', '同步中…');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, typeof delay === 'number' ? delay : 1200);
}
async function doPush(){
  if(!pushPending) return;
  const seqAtSend = pushSeq;                /* 记住这次推的是第几版数据 */
  const payload = serialize();
  try{
    const res = await cloudPush(payload);
    clearTimeout(retryTimer);
    if(pushSeq !== seqAtSend){
      /* 推送期间又有新改动 → 别清标记，马上再推一次 */
      pushRetry = 0;
      pushTimer = setTimeout(doPush, 0);
      return;
    }
    pushPending = false;
    pushRetry = 0;
    /* Worker 会把云端独有的快照日期并进来，这里把合并结果收回本地，
       避免下次推送又"少"了那几天 */
    if(res && res.mergedSnapshots && typeof res.mergedSnapshots === 'object'
       && Array.isArray(res.mergedFromCloud) && res.mergedFromCloud.length){
      res.mergedFromCloud.forEach(function(d){
        if(res.mergedSnapshots[d] && !SNAPSHOTS[d]) SNAPSHOTS[d] = res.mergedSnapshots[d];
      });
      payload.snapshots = SNAPSHOTS;
      writeCache(payload);
      syncSettleBtn();
    }
    writeCache(payload);
    cloudUI('ok', '云端已同步 ' + cloudTime());
    syncCloudDetail(payload);
  }catch(err){
    console.warn('[云同步]', err);
    const d = RETRY_DELAYS[pushRetry];
    if(d != null){
      pushRetry++;
      const secs = Math.round(d / 1000);
      cloudUI('err', '同步失败·' + secs + 's 后重试');
      const chip = document.getElementById('tbCloud');
      if(chip) chip.title = String(err.message || err) + '\n将在 ' + secs + ' 秒后自动重试';
      clearTimeout(retryTimer);
      retryTimer = setTimeout(doPush, d);
    }else{
      cloudUI('err', '同步失败·点击重试');
      const chip = document.getElementById('tbCloud');
      if(chip) chip.title = String(err.message || err) + '\n已重试多次，点这里手动再试';
    }
  }
}

/* 点状态胶囊：手动同步
 * 以「本机推上去」为主（Worker 会把云端独有的快照合并进来，两边都不丢）；
 * 只有本机从未存过数据、而云端有时，才反过来拉云端。 */
async function cloudManual(){
  pushRetry = 0;                    /* 手动触发 → 重置退避计数 */
  clearTimeout(retryTimer); clearTimeout(pushTimer);
  cloudUI('syncing', '同步中…');
  try{
    const localSaved = latestStampLocal();

    /* 本机完全没数据 → 只能拉云端 */
    if(!localSaved){
      const { data } = await cloudPull();
      if(data && data.accounts && data.accounts.length){
        adopt(data); writeCache(data); render();
        const _auto = autoSettle();          /* 拉回的云端数据自动补齐缺的快照 */
        if(_auto.added.length || _auto.refreshed.length) saveLocal();
        restoreChanged(data.savedAt);
        cloudUI('ok', '已拉取云端 ' + cloudTime());
        toast('已从云端恢复数据');
      }else{
        cloudUI('ok', '云端已接通 ' + cloudTime());
        toast('云端也还没有数据');
      }
      syncCloudDetail(data);
      return;
    }

    /* 本机有数据 → 推上去（Worker 负责合并云端独有的快照） */
    const seqAtSend = pushSeq;              /* 同 doPush：别抹掉推送期间的新改动 */
    const res = await cloudPush(serialize());
    if(pushSeq === seqAtSend) pushPending = false;
    if(res && res.mergedSnapshots && Array.isArray(res.mergedFromCloud)){
      res.mergedFromCloud.forEach(function(d){
        if(res.mergedSnapshots[d] && !SNAPSHOTS[d]) SNAPSHOTS[d] = res.mergedSnapshots[d];
      });
      syncSettleBtn();
    }
    saveLocal();
    await doPush();                 /* 用统一路径落库，顺便刷新胶囊 */
    toast('本机数据已推送到云端');
  }catch(err){
    cloudUI('err', '同步失败·点击重试');
    const chip = document.getElementById('tbCloud');
    if(chip) chip.title = String(err.message || err);
    toast('同步失败：' + (err.message || err));
  }
}

/* 本地已保存数据的 savedAt */
function latestStampLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return d && d.savedAt ? d.savedAt : null;
  }catch(e){ return null; }
}

/* 悬浮提示里带上云端信息 */
function syncCloudDetail(data){
  const chip = document.getElementById('tbCloud');
  if(!chip) return;
  if(data && data.savedAt){
    const by = data.updatedBy ? ' · ' + data.updatedBy : '';
    const n  = (data.accounts || []).length;
    chip.title = '云端数据：' + data.savedAt.replace('T',' ').slice(0,19) + by
               + '\n' + n + ' 个角色 · 点击立即同步一次';
  }else{
    chip.title = '点击立即与云端同步一次';
  }
}

/* 打开页面：拉云端 → 比时间戳决定用哪份；然后挂上自动推送 */
async function cloudInit(){
  /* 两个后端都没配 → 纯本地模式，不报错，正常能用 */
  if(!useWorker() && !CFG.token){
    cloudUI('off', '未接云端');
    const chip = document.getElementById('tbCloud');
    if(chip) chip.title = '还没配置云端地址，数据只存在本机浏览器里\n'
                        + '配置方法见「角色晶石台账-维护文档」第五章';
    return;
  }
  cloudUI('syncing', '连接云端…');
  let remote = null, sha = '';
  try{
    const r = await cloudPull();
    remote = r.data; sha = r.sha;
    syncCloudDetail(remote);
  }catch(err){
    cloudUI('err', '云端未连接·点击重试');
    const chip = document.getElementById('tbCloud');
    if(chip) chip.title = String(err.message || err);
    return;                                  /* 离线也能用，本地照常 */
  }

  const localSaved  = latestStampLocal();
  const remoteSaved = remote && remote.savedAt;
  const remoteHasData = !!(remote && remote.accounts && remote.accounts.length);

  if(remoteHasData && (!localSaved || new Date(remoteSaved) > new Date(localSaved))){
    /* 云端更新 → 采用云端 */
    adopt(remote); writeCache(remote); render();
    const _auto = autoSettle();              /* 云端数据落地后自动补齐缺的快照 */
    if(_auto.added.length || _auto.refreshed.length) saveLocal();
    restoreChanged(remoteSaved);
    cloudUI('ok', '云端已同步 ' + cloudTime());
  }else{
    cloudUI('ok', '云端已接通 ' + cloudTime());
    /* 云端还是空的、本机有「用户真正录入过」的数据 → 首次上云
       注意：localSaved 为空说明本机也没存过东西，绝不要把初始空壳推上去 */
    if(!remoteHasData && ACCOUNTS.length && localSaved){
      schedulePush(300);
    }
  }
}

document.getElementById('tbCloud').addEventListener('click', cloudManual);

/* 关页前若还有没推上去的改动，尽量补一次（用 sendBeacon 会带不上认证头，
   所以这里是同步尽力而为，失败也无妨：localStorage 里一定有） */
window.addEventListener('beforeunload', function(){
  if(pushPending){ clearTimeout(pushTimer); doPush(); }
});

 * 渲染
 * ============================================================ */

function ico(name){ return '<span class="ico">' + (ICONS[name] || '') + '</span>'; }

function renderSummary(sum, animate){
  /* 第 1 项 s-roles 跨「序号 + 角色信息」；后 7 项 s-data 各占 1 个数据列宽；
     末尾 s-exp 是展开按钮的占位，无内容 —— 与 .colhead 结构一一对应 */
  const items = [
    { cls:'c-roles', slot:'s-roles', ico:'roles', key:'roles',      k:'角色数量',         v:num(sum.roles) },
    { cls:'c-left',  slot:'s-data',  ico:'gem',   key:'gemsLeft',   k:'剩余晶石总量',     v:intNum(sum.gemsLeft) },
    { cls:'c-gain',  slot:'s-data',  ico:'gain',  key:'gained',     k:'已获取晶石总量',   v:num(sum.gained) },
    { cls:'c-sold',  slot:'s-data',  ico:'box',   key:'gemsSold',   k:'出售晶石总量',     v:intNum(sum.gemsSold) },
    { cls:'c-money', slot:'s-data',  ico:'money', key:'soldValue',  k:'总收入',           v:money(sum.soldValue) },
    { cls:'c-labor', slot:'s-data',  ico:'tool',  key:'laborCost',  k:'总支出（人工支出）', v:money(sum.laborCost) },
    { cls:'c-net',   slot:'s-data',  ico:'trend', key:'profit',     k:'净利润（总）',     v:money(sum.profit) },
    { cls:'c-chaos', slot:'s-data',  ico:'chaos', key:'chaosCost',  k:'秘境消耗晶石总量', v:intNum(sum.chaosCost) }
  ];
  document.getElementById('summary').innerHTML = items.map(function(i){
    return '<div class="sm panel ' + i.cls + ' ' + i.slot + '">'
      + '<span class="k">' + ico(i.ico) + i.k + '</span>'
      + '<span class="v" data-sum="' + i.key + '">' + i.v + '</span>'
      + '</div>';
  }).join('') + '<div class="sm s-exp" aria-hidden="true"></div>';
  /* 负值标红：已获取、净利润、秘境消耗都可能为负 */
  [['gained','neg'],['profit','neg'],['chaosCost','neg']].forEach(function(pair){
    const el = document.querySelector('[data-sum="'+pair[0]+'"]');
    if(el) el.classList.toggle(pair[1], parseFloat(el.textContent.replace(/[^\d.-]/g,'')) < 0);
  });
  if(animate){ items.forEach(function(i){
    if(i.key === 'roles') return;
    const el = document.querySelector('[data-sum="'+i.key+'"]');
    if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }); }
}
function refreshNumbers(i){
  const row = document.querySelector('.row[data-i="'+i+'"]');
  if(row){
    const c = ACCOUNTS[i];
    const t = totals(c);
    /* 7 列：当前剩余 / 已获取 / 已出售 / 收入 / 人工费用 / 净利润 / 秘境消耗 */
    setV(row,'gemsLeft',  intNum(t.gemsLeft), 'hit');
    /* 已获取晶石：累加相邻剩余的增长量，恒 ≥ 0；显示为灰色，弱化视觉层级 */
    const g = gained(c);
    setV(row,'gained', g, 'hit');
    setV(row,'gemsSold',  intNum(t.gemsSold), 'hit');
    setV(row,'soldValue', money(t.soldValue), 'hit');
    setV(row,'laborCost', money(t.laborCost), 'hit');
    /* 净利润 = 收入 − 人工费用 */
    const p = t.soldValue - t.laborCost;
    setV(row,'profit', money(p), 'hit');
    const pEl = row.querySelector('[data-v="profit"]');
    if(pEl){
      pEl.classList.toggle('pos', p > 0);
      pEl.classList.toggle('neg', p < 0);
    }
    setV(row,'chaosCost', intNum(t.chaosCost), 'hit');
  }
  const sum = summarize(ACCOUNTS);
  setText('[data-sum="roles"]',     num(sum.roles));
  setText('[data-sum="gemsLeft"]',  intNum(sum.gemsLeft),  true);
  setText('[data-sum="gained"]',    num(sum.gained),       true);
  setText('[data-sum="gemsSold"]',  intNum(sum.gemsSold),  true);
  setText('[data-sum="soldValue"]', money(sum.soldValue),  true);
  setText('[data-sum="laborCost"]', money(sum.laborCost),  true);
  setText('[data-sum="profit"]',    money(sum.profit),     true);
  setText('[data-sum="chaosCost"]', intNum(sum.chaosCost), true);
  [['gain','gained'],['net','profit'],['chaos','chaosCost']].forEach(function(pair){
    const el = document.querySelector('[data-sum="'+pair[1]+'"]');
    if(el) el.classList.toggle('neg', parseFloat(String(el.textContent).replace(/[^\d.-]/g,'')) < 0);
  });
}
function setV(row, key, html, anim){
  const el = row.querySelector('[data-v="'+key+'"]');
  if(!el) return;
  el.textContent = html;
  if(anim){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
}
function setText(sel, html, anim){
  const el = document.querySelector(sel);
  if(!el) return;
  el.textContent = html;
  if(anim){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* 明细表：日期+时间 | 剩余 | 已获取 | 已出售 | 收入 | 人工 | 净利润 | 秘境消耗 | 操作 */
function detailHTML(i){
  const c = ACCOUNTS[i];
  const recs = c.records || [];
  /* 稳定时序：先按时间升序（同一秒按录入先后），再反转得到"最新在最上" */
  const asc = recsAsc(c);
  const ordered = asc.slice().reverse();
  /* 「本次获取晶石」= 单次增量（不是累计）：本次剩余 − 上次剩余，负数记 0。
     直接用 gainedDeltas()，与卡片上的「已获取晶石」总数共用同一份计算，
     明细各行的增量之和 === 卡片显示的总数，两处永远一致。
     净利润仍是单条记录的「收入 − 人工」，本就与累计无关。 */
  const deltas = gainedDeltas(c);          /* 与 asc 同序，负增量已归 0 */
  const idxOf = new Map();
  asc.forEach(function(r, k){ idxOf.set(r, k); });
  const rows = ordered.length ? ordered.map(function(r){
    const oi = recs.indexOf(r);
    const k  = idxOf.get(r);
    const z = v => (Number(v)||0) === 0 ? ' zero' : '';
    const gInc = deltas[k] || 0;           /* 本次获取晶石：单次增量，恒 ≥ 0 */
    const pSingle = income(r);
    const pCls = pSingle > 0 ? ' income' : (pSingle < 0 ? ' neg' : ' inc-zero');
    /* 凌晨标记：00:00~07:59 的录入按结算日归属前一天，给个视觉提示 */
    const weeHour = parseInt(String(r.time || '').split(':')[0], 10);
    const wee = (weeHour >= 0 && weeHour < 8) ? '<i class="wee">凌晨</i>' : '';
    return '<tr>'
      + '<td class="d">' + esc(r.date || '') + '</td>'
      + '<td class="t">' + esc(r.time || '--:--:--') + wee + '</td>'
      + '<td class="n ok'+z(r.gemsLeft)+'">' + intNum(r.gemsLeft) + '</td>'
      + '<td class="n inc' + (gInc === 0 ? ' zero' : '') + '">' + num(gInc) + '</td>'
      + '<td class="n purple'+z(r.daySold)+'">' + intNum(r.daySold) + '</td>'
      + '<td class="n gold'+z(r.dayValue)+'">' + num(r.dayValue) + '</td>'
      + '<td class="n plain'+z(r.dayLabor)+'">' + num(r.dayLabor) + '</td>'
      + '<td class="n'+pCls+'">' + money(pSingle) + '</td>'
      + '<td class="n chaos'+z(r.chaosCost)+'">' + intNum(r.chaosCost) + '</td>'
      + '<td><button class="del" type="button" title="删除这条记录" '
      +   'data-del="' + i + '" data-ri="' + oi + '">✕</button></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="10"><div class="dt-empty">暂无录入记录 —— 在上方输入框填入当前数据，回车即自动记一条</div></td></tr>';

  return '<div class="detail-inner panel">'
    + '<div class="detail-head">'
    +   '<span class="ttl2">' + esc(c.name || '未命名角色') + ' · 每日明细</span>'
    +   '<span>共 ' + recs.length + ' 条</span>'
    +   '<span class="right2"><button class="mini danger" type="button" data-clear="' + i + '">清空明细</button></span>'
    + '</div>'
    + '<table class="dt">'
    + '<colgroup><col class="c-date" /><col class="c-time" />'
    +   '<col class="c-num" /><col class="c-num" /><col class="c-num" /><col class="c-num" />'
    +   '<col class="c-num" /><col class="c-num" /><col class="c-num" /><col class="c-act" /></colgroup>'
    + '<thead><tr>'
    +   '<th>日期</th><th>时间</th><th>剩余晶石</th><th>本次获取晶石</th><th>已出售晶石</th>'
    +   '<th>收入</th><th>人工费用</th><th>净利润</th><th>秘境消耗</th><th></th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table></div>';
}

/* 明细表列宽按上方卡片实际像素对齐
   colgroup: [日期, 时间, 剩余, 已获取, 已出售, 收入, 人工, 净利润, 秘境消耗, 展开] */
function syncDetailCols(i){
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if(!row) return;
  const tbl = row.querySelector('table.dt');
  if(!tbl || !tbl.querySelector('colgroup')) return;
  const cols = tbl.querySelectorAll('colgroup col');
  const idx = row.querySelector('.idx');
  const who = row.querySelector('.who');
  const exp = row.querySelector('.expand');
  if(!idx || !who || !exp) return;

  const tblW = tbl.getBoundingClientRect().width;
  const actW = exp.getBoundingClientRect().width;
  /* 日期列 = 序号列 + 角色信息列（与卡片左半部分完全等宽） */
  const dateW = idx.getBoundingClientRect().width + who.getBoundingClientRect().width;
  /* 数据列 = 卡片 .cell 的实际宽度，逐个量取，列数变化也能自适应 */
  const cellEls = row.querySelectorAll('.cell');
  const px = v => Math.round(v * 100) / 100 + 'px';

  /* 时间列独立占一小段，从日期列右侧「借」出，不破坏数据列与卡片的对齐 */
  const timeW = 78;
  cols[0].style.width = px(Math.max(dateW - timeW, 60));
  cols[1].style.width = px(timeW);
  /* 7 个数据列逐一按卡片 .cell 的实际宽度写入，保证与列标题条 7 栏严格对齐 */
  const n = cellEls.length;
  for(let k = 0; k < n; k++){
    const w = cellEls[k] ? cellEls[k].getBoundingClientRect().width
                         : (tblW - dateW - actW) / Math.max(n, 1);
    if(cols[k + 2]) cols[k + 2].style.width = px(w);
  }
  if(cols[n + 2]) cols[n + 2].style.width = px(actW);
}

function syncAllDetailCols(){
  ACCOUNTS.forEach(function(_, i){ syncDetailCols(i); });
}
const FEATURES = [
  { key:'bag',     label:'背包' },
  { key:'chaos',   label:'混沌' },
  { key:'market',  label:'市集' },
  { key:'pet',     label:'宠物' }
];
/* 财富值：一个独立的数值，和等级一样由「修改」弹窗直接填写，
   不参与任何自动计算，也不随每日录入变化。 */
function wealth(c){ return Number(c.wealth) || 0; }

/* 角色信息：第一行 角色名+等级/职业/账号；第二行 4 个功能开关 + 财富值 */
function whoHTML(c, i){
  const meta = [];
  if(c.level !== '' && c.level != null) meta.push('<span class="lv">Lv.' + esc(c.level) + '</span>');
  if(c.job) meta.push('<span class="job">' + esc(c.job) + '</span>');
  if(c.account) meta.push('<span class="acct">' + esc(c.account) + '</span>');
  if(!meta.length) meta.push('<span class="tagnone">未填写账号信息</span>');

  const ops = '<button class="ob edit" type="button" data-edit="' + i + '" title="修改账号信息">修改</button>'
            + '<button class="ob del" type="button" data-rm="' + i + '" title="删除该角色卡片">✕</button>';

  const flags = c.flags || {};
  const feats = FEATURES.map(function(f){
    const on = !!flags[f.key];
    return '<span class="feat ' + (on ? 'on' : 'off') + '" '
      + 'data-feat="' + i + '" data-key="' + f.key + '" '
      + 'title="点击切换「' + f.label + '」状态（当前：' + (on ? '已开启' : '未开启') + '）">'
      + f.label + '</span>';
  }).join('');

  const w = wealth(c);
  const wCls = w < 0 ? 'wv neg' : 'wv';

  return '<div class="who">'
    + '<div class="line1">'
    +   '<div class="nm' + (c.name ? '' : ' empty') + '">' + (c.name ? esc(c.name) : '未命名角色') + '</div>'
    +   '<div class="meta">' + meta.join('') + '</div>'
    +   '<span class="ops">' + ops + '</span>'
    + '</div>'
    + '<div class="line2">'
    +   '<span class="feats">' + feats + '</span>'
    +   '<span class="wealth"><span class="wk">财富值</span><span class="' + wCls + '" data-w="' + i + '">'
    +     money(w) + '</span></span>'
    + '</div>'
    + '</div>';
}

/* 一行一卡：序号 | 角色信息（只读/可编辑） | 7 数值格(居中) + 录入框 | ▼
   7 列：当前剩余晶石 / 已获取晶石 / 已出售晶石 / 收入 / 人工费用 / 净利润 / 秘境消耗晶石
   其中「已获取晶石」「净利润」自动计算，其余 5 项可录入 */
function cardHTML(c, i){
  const color = THEME[i % THEME.length];
  const t = totals(c);
  /* 已获取晶石：累加相邻剩余的增长量，恒 ≥ 0 */
  const g = gained(c);
  /* 净利润 = 收入 − 人工费用 */
  const p = t.soldValue - t.laborCost;
  const pCls = p > 0 ? ' pos' : (p < 0 ? ' neg' : '');
  const cell = (vkey, vhtml, cls, ph, k, tip) =>
    '<div class="cell"' + (tip ? ' title="' + tip + '"' : '') + '>'
    + '<span class="k">' + (k || '') + '</span>'
    + '<span class="v ' + cls + '" data-v="' + vkey + '">' + vhtml + '</span>'
    + '<input class="input" type="number" inputmode="decimal" step="any" '
    +   'data-i="' + i + '" data-f="' + vkey + '" placeholder="' + ph + '" />'
    + '</div>';
  /* 只读数值格（自动算出，无需录入） */
  const roCell = (vkey, vhtml, cls, tip, k) =>
    '<div class="cell ro" title="' + tip + '">'
    + '<span class="k">' + (k || '') + '</span>'
    + '<span class="v ' + cls + '" data-v="' + vkey + '">' + vhtml + '</span>'
    + '<span class="auto">自动</span>'
    + '</div>';

  return '<div class="row" data-i="' + i + '">'
    + '<article class="card panel" style="--el:' + color + '">'
    +   '<div class="idx">'
    +     serial(i+1)
    +     '<button class="btnrec" type="button" data-save="' + i + '" '
    +       'title="记录本卡片填写的数值，并自动保存">'
    +       '<span class="tick">✓</span></button>'
    +   '</div>'
    +   whoHTML(c, i)
    +   '<div class="cells">'
    +     cell('gemsLeft',  intNum(t.gemsLeft), 'ok',     '现有多少填多少', '当前剩余晶石',
    +            '当前剩余晶石是「时点值」：每次录入以最新一次为准，不累加。现在还剩多少就填多少。')
    +     roCell('gained', g, 'gain',
    +            '已获取晶石 = 逐条累加「本次剩余 − 上次剩余」的增长量；本次剩余未超过上次则记 0', '已获取晶石')
    +     cell('gemsSold',  intNum(t.gemsSold), 'purple', '本次出售',      '已出售晶石')
    +     cell('soldValue', money(t.soldValue), 'gold',   '本次收入',      '收入')
    +     cell('laborCost', money(t.laborCost), 'plain',  '本次人工',      '人工费用')
    +     roCell('profit', money(p), 'inc' + pCls,
    +            '净利润 = 收入 − 人工费用', '净利润')
    +     cell('chaosCost', intNum(t.chaosCost), 'chaos', '秘境消耗晶石',  '秘境消耗晶石')
    +   '</div>'
    +   '<button class="expand" type="button" data-toggle="' + i + '" title="展开每日明细" aria-expanded="false">'
    +     '<span class="arw">▼</span></button>'
    + '</article>'
    + '<div class="detail" id="detail-' + i + '">' + detailHTML(i) + '</div>'
    + '</div>';
}

function render(){
  const box = document.getElementById('cards');
  box.innerHTML = ACCOUNTS.length
    ? ACCOUNTS.map(cardHTML).join('')
    : '<div class="empty-tip panel">暂无角色 —— 点右上角「＋ 新增角色」添加</div>';
  renderSummary(summarize(ACCOUNTS));
  document.getElementById('tbCount').textContent = ACCOUNTS.length + ' 个角色';
  syncCommitAll();
  syncSettleBtn();
