<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>角色晶石台账</title>
<!-- ============================================================
     角色晶石台账 · 独立记录面板
     ------------------------------------------------------------
     稳定链接：https://dycxlcvxv00.github.io/baozhan-game/index-records.html
     定位：本页只做"记录展示"，不引用其它模块。
     结构：顶部栏 → 汇总统计 → 角色卡片（横向紧凑，一行一卡）
     扩展：内容全部来自脚本区 ACCOUNTS 数组；加角色 = 往数组里加一项。
     ============================================================ -->
<style>
  :root{
    --bg0:#060912; --bg1:#0b1322;
    --panel:rgba(16,24,44,0.55);
    --glass:rgba(255,255,255,0.04);
    --line:rgba(125,165,225,0.16);
    --txt:#eaf0ff; --dim:#93a4c4; --mute:#6c7da0;
    --accent:#2fe6d0;   /* 青绿：主数据 */
    --accent2:#9b7bff;  /* 紫：次数据 */
    --gold:#ffcf6b;     /* 暗金：金额 */
    --ok:#57e39b;       /* 绿：剩余/正向 */
    --el:var(--accent); /* 每卡主题色，由脚本覆盖 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 50% -12%, #16243f 0%, rgba(22,36,63,0) 60%),
      radial-gradient(900px 600px at 12% 110%, rgba(34,28,72,0.55) 0%, rgba(34,28,72,0) 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    background-attachment:fixed;
    color:var(--txt); font-size:14px; line-height:1.5;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  ::selection{background:rgba(47,230,208,0.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
  ::-webkit-scrollbar-thumb{background:rgba(125,165,225,0.22);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(47,230,208,0.4)}

  .wrap{max-width:1600px;margin:0 auto;padding:22px 26px 56px}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(11px) saturate(120%); -webkit-backdrop-filter:blur(11px) saturate(120%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 6px 22px rgba(0,0,0,0.36),
      0 0 0 1px rgba(47,230,208,0.05);
    position:relative;
  }

  /* ---------- 顶部栏 ---------- */
  #topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:0 20px;min-height:54px;margin-bottom:14px}
  #topbar .brand{
    font-weight:800;font-size:18px;letter-spacing:1px;white-space:nowrap;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #topbar .sep{width:1px;height:22px;background:var(--line)}
  #topbar .right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .chip{
    height:28px;padding:0 12px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;
    background:var(--glass);border:1px solid var(--line);color:var(--dim);font-size:12.5px;
    transition:.18s;white-space:nowrap;font-family:inherit;
  }
  .chip.on{color:var(--accent);border-color:rgba(47,230,208,0.5);box-shadow:0 0 12px rgba(47,230,208,0.25)}

  /* ---------- 汇总统计（一行四格） ---------- */
  #summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .sm{padding:11px 16px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .sm::after{
    content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,var(--el) 0%,transparent 68%);opacity:.10;pointer-events:none;
  }
  .sm .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .sm .k .ico{font-size:13px;opacity:.85}
  .sm .v{font-size:24px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .sm .v small{font-size:12.5px;font-weight:600;color:var(--dim);margin-left:4px;letter-spacing:0}
  .sm.c-roles{--el:#2fe6d0}   .sm.c-roles   .v{color:var(--accent)}
  .sm.c-left {--el:#57e39b}   .sm.c-left    .v{color:var(--ok)}
  .sm.c-sold {--el:#9b7bff}   .sm.c-sold    .v{color:var(--accent2)}
  .sm.c-money{--el:#ffcf6b}   .sm.c-money   .v{color:var(--gold)}

  /* ---------- 角色卡片：横向紧凑，一行一卡 ---------- */
  #cards{display:flex;flex-direction:column;gap:8px}
  .card{
    --el:var(--accent);
    display:flex;align-items:center;gap:0;
    padding:0 14px 0 0; overflow:hidden; transition:.16s;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--el);opacity:.9;pointer-events:none;
  }
  .card:hover{
    border-color:color-mix(in srgb,var(--el) 38%,transparent);
    box-shadow:0 6px 24px rgba(0,0,0,0.45),0 0 16px color-mix(in srgb,var(--el) 16%,transparent);
  }

  /* 序号 */
  .idx{
    flex:0 0 52px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.6px;
    font-variant-numeric:tabular-nums;
  }

  /* 角色名区（固定宽，防错位） */
  .who{
    flex:0 0 210px;min-width:0;display:flex;flex-direction:column;gap:2px;
    padding:8px 0;border-right:1px solid rgba(125,165,225,0.10);
  }
  .who .nm{
    font-size:15px;font-weight:800;letter-spacing:.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .who .sub{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mute);min-width:0}
  .who .sub .lv{color:var(--gold);font-weight:700;white-space:nowrap}
  .who .sub .job{
    color:var(--el);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .who .sub .acct{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;
  }

  /* 数据格 */
  .cells{flex:1;display:grid;grid-template-columns:repeat(4,1fr);min-width:0}
  .cell{
    padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0;
    border-right:1px solid rgba(125,165,225,0.08);
  }
  .cell:last-child{border-right:0}
  .cell .k{
    font-size:11px;color:var(--mute);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .cell .v{
    font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;
  }
  .cell .v small{font-size:10.5px;font-weight:600;color:var(--mute);margin-left:3px;letter-spacing:0}
  .cell .v.ok{color:var(--ok)}
  .cell .v.purple{color:var(--accent2)}
  .cell .v.gold{color:var(--gold)}
  .cell .v.plain{color:var(--txt)}
  .cell .v.dim{color:var(--mute);font-weight:700}

  .empty-tip{padding:26px;text-align:center;color:var(--mute);font-size:13px}

  @media (max-width:1180px){
    .who{flex:0 0 168px}
    .cells{grid-template-columns:repeat(2,1fr)}
    .cell{border-bottom:1px solid rgba(125,165,225,0.08)}
    .cell:nth-child(2n){border-right:0}
    .card{align-items:flex-start;padding-right:10px}
  }
  @media (max-width:720px){
    .wrap{padding:14px 12px 40px}
    #summary{grid-template-columns:repeat(2,1fr)}
    #topbar{padding:10px 14px;min-height:0;gap:10px}
    .idx{flex:0 0 38px}
    .who{flex:1 1 100%;border-right:0;border-bottom:1px solid rgba(125,165,225,0.10)}
    .card{flex-direction:column;align-items:stretch;padding:0 12px 8px}
    .cells{width:100%}
    .sm .v{font-size:20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 顶部栏 ========== -->
  <header id="topbar" class="panel">
    <span class="brand">角色晶石台账</span>
    <span class="sep"></span>
    <span class="chip on" id="tbCount">0 个角色</span>
  </header>

  <!-- ========== 汇总统计 ========== -->
  <section id="summary"></section>

  <!-- ========== 角色卡片 ========== -->
  <main id="cards"></main>

</div>

<script>
/* ============================================================
 * 数据区 —— 唯一改内容的地方
 * ------------------------------------------------------------
 * 每个角色一项。字段说明（金额单位：元 / 人民币）：
 *   account   账号
 *   name      角色名    level  等级    job  职业
 *   gemsLeft  当前剩余晶石
 *   gemsSold  已出售晶石总数
 *   soldValue 已出售晶石总价值（元）
 *   laborCost 人工费用（元）
 * ============================================================ */
const ACCOUNTS = [
  { account: 'zhanghao01', name: '示例角色一', level: 45, job: '法师', gemsLeft: 1200, gemsSold: 3400, soldValue: 2380.5, laborCost: 300 },
  { account: 'zhanghao02', name: '示例角色二', level: 38, job: '战士', gemsLeft: 860,  gemsSold: 2100, soldValue: 1470,   laborCost: 260 },
  { account: 'zhanghao03', name: '示例角色三', level: 52, job: '刺客', gemsLeft: 2450, gemsSold: 5600, soldValue: 3920,   laborCost: 420 },
  { account: 'zhanghao04', name: '示例角色四', level: 29, job: '牧师', gemsLeft: 430,  gemsSold: 980,  soldValue: 686,    laborCost: 180 },
  { account: 'zhanghao05', name: '示例角色五', level: 61, job: '游侠', gemsLeft: 3180, gemsSold: 7250, soldValue: 5075,   laborCost: 560 },
  { account: 'zhanghao06', name: '示例角色六', level: 33, job: '术士', gemsLeft: 640,  gemsSold: 1520, soldValue: 1064,   laborCost: 210 },
  { account: 'zhanghao07', name: '示例角色七', level: 47, job: '圣骑士', gemsLeft: 1720, gemsSold: 4180, soldValue: 2926, laborCost: 340 },
  { account: 'zhanghao08', name: '示例角色八', level: 25, job: '德鲁伊', gemsLeft: 300, gemsSold: 760,  soldValue: 532,   laborCost: 150 }
];

/* 卡片主题色：按顺序循环取用，让相邻卡片有区分度 */
const THEME = ['#2fe6d0', '#9b7bff', '#ffcf6b', '#7fd4ff', '#ff8a5c', '#57e39b', '#c77bff', '#ff6b6b'];

/* ============================================================
 * 工具函数
 * ============================================================ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function int(n) {
  return (Number(n) || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
}
/* 金额：¥ + 千分位 + 最多两位小数 */
function money(n) {
  const v = Number(n) || 0;
  return '¥' + v.toLocaleString('zh-CN', {
    minimumFractionDigits: (v % 1) ? 2 : 0,
    maximumFractionDigits: 2
  });
}
/* 汇总（从角色数据实时累加） */
function summarize(list) {
  return list.reduce((a, c) => {
    a.gemsLeft  += Number(c.gemsLeft)  || 0;
    a.gemsSold  += Number(c.gemsSold)  || 0;
    a.soldValue += Number(c.soldValue) || 0;
    a.laborCost += Number(c.laborCost) || 0;
    return a;
  }, { roles: list.length, gemsLeft: 0, gemsSold: 0, soldValue: 0, laborCost: 0 });
}

/* ============================================================
 * 渲染
 * ============================================================ */
function renderSummary(s) {
  const items = [
    { cls: 'c-roles', ico: '👤', k: '角色数量',       v: int(s.roles) + '<small>个</small>' },
    { cls: 'c-left',  ico: '💎', k: '剩余总晶石',     v: int(s.gemsLeft) + '<small>颗</small>' },
    { cls: 'c-sold',  ico: '📦', k: '已出售晶石总数', v: int(s.gemsSold) + '<small>颗</small>' },
    { cls: 'c-money', ico: '¥',  k: '出售晶石总价值', v: money(s.soldValue) }
  ];
  document.getElementById('summary').innerHTML = items.map(i =>
    `<div class="sm panel ${i.cls}">
       <span class="k"><span class="ico">${i.ico}</span>${i.k}</span>
       <span class="v">${i.v}</span>
     </div>`).join('');
}

/* 一行一卡：序号 | 角色名区 | 4 格数据 */
function cardHTML(c, i) {
  const color = THEME[i % THEME.length];
  const hasLv = c.level != null && c.level !== '';

  return `
  <article class="card panel" style="--el:${color}">
    <div class="idx">#${String(i + 1).padStart(2, '0')}</div>

    <div class="who">
      <div class="nm" title="${esc(c.name)}">${esc(c.name || '未命名角色')}</div>
      <div class="sub">
        ${hasLv ? `<span class="lv">Lv.${esc(c.level)}</span>` : ''}
        ${c.job ? `<span class="job">${esc(c.job)}</span>` : ''}
        <span class="acct" title="${esc(c.account)}">${esc(c.account || '—')}</span>
      </div>
    </div>

    <div class="cells">
      <div class="cell">
        <span class="k">当前剩余晶石</span>
        <span class="v ok">${int(c.gemsLeft)}<small>颗</small></span>
      </div>
      <div class="cell">
        <span class="k">已出售晶石总数</span>
        <span class="v purple">${int(c.gemsSold)}<small>颗</small></span>
      </div>
      <div class="cell">
        <span class="k">已出售晶石总价格</span>
        <span class="v gold">${money(c.soldValue)}</span>
      </div>
      <div class="cell">
        <span class="k">人工费用</span>
        <span class="v plain">${money(c.laborCost)}</span>
      </div>
    </div>
  </article>`;
}

function render() {
  const box = document.getElementById('cards');
  box.innerHTML = ACCOUNTS.length
    ? ACCOUNTS.map(cardHTML).join('')
    : '<div class="empty-tip panel">暂无角色数据 —— 在文件底部 ACCOUNTS 数组里添加</div>';
  renderSummary(summarize(ACCOUNTS));
  document.getElementById('tbCount').textContent = ACCOUNTS.length + ' 个角色';
}

render();
</script>
</body>
</html>
