<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>角色晶石台账</title>
<!-- ============================================================
     角色晶石台账 · 独立记录面板
     ------------------------------------------------------------
     稳定链接：https://dycxlcvxv00.github.io/baozhan-game/index-records.html
     定位：本页只做"记录展示"，与任何游戏项目无关，不引用其它模块。
     结构：顶部栏 → 汇总统计 → 角色卡片网格（一角色一卡片、卡内分区）
     扩展：内容全部来自脚本区 ACCOUNTS 数组；加角色 = 往数组里加一项。
     说明：密码默认打码，点击眼睛图标显示明文（本页公开可访问，注意防截图）。
     ============================================================ -->
<style>
  :root{
    --bg0:#060912; --bg1:#0b1322;
    --panel:rgba(16,24,44,0.55);
    --glass:rgba(255,255,255,0.04);
    --line:rgba(125,165,225,0.16);
    --txt:#eaf0ff; --dim:#93a4c4; --mute:#6c7da0;
    --accent:#2fe6d0;   /* 青绿：主数据 */
    --accent2:#9b7bff;  /* 紫：次数据 */
    --gold:#ffcf6b;     /* 暗金：金额 */
    --danger:#ff6b6b;
    --ok:#57e39b;       /* 绿：剩余/正向 */
    --el:var(--accent); /* 每卡主题色，由脚本覆盖 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 50% -12%, #16243f 0%, rgba(22,36,63,0) 60%),
      radial-gradient(900px 600px at 12% 110%, rgba(34,28,72,0.55) 0%, rgba(34,28,72,0) 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    background-attachment:fixed;
    color:var(--txt); font-size:14px; line-height:1.6;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  ::selection{background:rgba(47,230,208,0.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
  ::-webkit-scrollbar-thumb{background:rgba(125,165,225,0.22);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(47,230,208,0.4)}

  .wrap{max-width:1560px;margin:0 auto;padding:26px 28px 64px}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    backdrop-filter:blur(11px) saturate(120%); -webkit-backdrop-filter:blur(11px) saturate(120%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 0 36px rgba(40,70,120,0.10),
      0 10px 34px rgba(0,0,0,0.42),
      0 0 0 1px rgba(47,230,208,0.06);
    position:relative;
  }

  /* ---------- 顶部栏 ---------- */
  #topbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:0 24px;min-height:64px;margin-bottom:18px}
  #topbar .brand{
    font-weight:800;font-size:20px;letter-spacing:1px;white-space:nowrap;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #topbar .sep{width:1px;height:24px;background:var(--line)}
  #topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{
    height:30px;padding:0 13px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;
    background:var(--glass);border:1px solid var(--line);color:var(--dim);font-size:13px;
    transition:.18s;white-space:nowrap;font-family:inherit;
  }
  button.chip{cursor:pointer}
  button.chip:hover{color:var(--txt);border-color:rgba(125,165,225,0.42)}
  .chip.on{color:var(--accent);border-color:rgba(47,230,208,0.5);box-shadow:0 0 12px rgba(47,230,208,0.25)}
  .chip.warn{color:var(--gold);border-color:rgba(255,207,107,0.4)}

  /* ---------- 汇总统计 ---------- */
  #summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
  .sm{padding:16px 20px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .sm::after{
    content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle,var(--el) 0%,transparent 68%);opacity:.10;pointer-events:none;
  }
  .sm .k{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:7px}
  .sm .k .ico{font-size:15px;opacity:.85}
  .sm .v{font-size:32px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .sm .v small{font-size:14px;font-weight:600;color:var(--dim);margin-left:5px;letter-spacing:0}
  .sm .note{font-size:11.5px;color:var(--mute)}
  .sm.c-roles{--el:#2fe6d0}   .sm.c-roles   .v{color:var(--accent)}
  .sm.c-left {--el:#57e39b}   .sm.c-left    .v{color:var(--ok)}
  .sm.c-sold {--el:#9b7bff}   .sm.c-sold    .v{color:var(--accent2)}
  .sm.c-money{--el:#ffcf6b}   .sm.c-money   .v{color:var(--gold);font-size:29px}

  /* ---------- 卡片网格 ---------- */
  #cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(392px,1fr));align-items:start}
  .card{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:.22s;--el:var(--accent)}
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--el),transparent 78%);opacity:.85;pointer-events:none;
  }
  .card:hover{
    border-color:color-mix(in srgb,var(--el) 40%,transparent);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 14px 40px rgba(0,0,0,0.5),
      0 0 22px color-mix(in srgb,var(--el) 18%,transparent);
  }

  /* 卡头 */
  .card-head{display:flex;gap:13px;padding:15px 18px 13px;border-bottom:1px solid var(--line);align-items:flex-start}
  .avatar{
    width:52px;height:52px;flex:0 0 52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
    background:linear-gradient(140deg,color-mix(in srgb,var(--el) 22%,transparent),rgba(255,255,255,0.02));
    border:1px solid color-mix(in srgb,var(--el) 38%,transparent);
    color:var(--el);letter-spacing:.5px;
  }
  .card-head .id{flex:1;min-width:0}
  .card-head .name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card-head .name h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .card-head .name .idx{font-size:11px;color:var(--mute);letter-spacing:.8px;flex:0 0 auto}
  .card-head .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .tag{font-size:11px;line-height:1.75;padding:1px 9px;border-radius:20px;border:1px solid;background:rgba(255,255,255,0.05);white-space:nowrap}
  .tag.job{color:var(--el);border-color:color-mix(in srgb,var(--el) 45%,transparent)}
  .tag.lv{color:var(--gold);border-color:rgba(255,207,107,0.4)}

  /* 卡片主体 */
  .card-body{padding:2px 18px 12px;display:flex;flex-direction:column;flex:1}
  .sec{padding:12px 0 2px}
  .sec+.sec{border-top:1px solid rgba(125,165,225,0.10)}
  .sec h3{
    margin:0 0 9px;font-size:11.5px;font-weight:700;letter-spacing:1.6px;
    color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:7px;
  }
  .sec h3::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--el);opacity:.9}

  /* 字段行 */
  .f{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;
    padding:7px 10px;border-radius:9px;background:rgba(255,255,255,0.025);
    border:1px solid rgba(125,165,225,0.08);margin-bottom:6px}
  .f:last-child{margin-bottom:2px}
  .f .k{color:var(--dim);white-space:nowrap;flex:0 0 auto}
  .f .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
    display:flex;align-items:center;justify-content:flex-end;gap:6px}
  .f .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.2px}
  .f .v.gold{color:var(--gold)}
  .f .v.ok{color:var(--ok)}
  .f .v.purple{color:var(--accent2)}

  /* 密码显示/隐藏 */
  .pw{display:flex;align-items:center;gap:6px;min-width:0}
  .pw .mask{font-size:11px;letter-spacing:2px;color:var(--mute)}
  .pw .plain{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
    color:var(--txt);letter-spacing:.2px;max-width:160px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;cursor:pointer}
  .eye{
    flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
    background:rgba(255,255,255,0.04);color:var(--dim);cursor:pointer;font-size:12px;
    display:inline-flex;align-items:center;justify-content:center;transition:.18s;padding:0;
    font-family:inherit;line-height:1;
  }
  .eye:hover{color:var(--accent);border-color:rgba(47,230,208,0.45);background:rgba(47,230,208,0.08)}
  .eye.on{color:var(--gold);border-color:rgba(255,207,107,0.45);background:rgba(255,207,107,0.08)}

  /* 卡脚 */
  .card-foot{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 18px;border-top:1px solid var(--line);background:rgba(0,0,0,0.16);
  }
  .btn{
    height:30px;padding:0 14px;border-radius:15px;font-size:12.5px;cursor:pointer;
    background:rgba(22,31,56,0.9);color:var(--dim);border:1px solid var(--line);
    transition:.18s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{color:var(--txt);border-color:rgba(125,165,225,0.42)}
  .stamp{margin-left:auto;font-size:11px;color:var(--mute);white-space:nowrap}

  /* 底部提示条 */
  .notice{
    margin-top:22px;padding:13px 18px;font-size:12.5px;color:var(--dim);
    border-color:rgba(255,207,107,0.28);display:flex;gap:10px;align-items:flex-start;
  }
  .notice .ico{color:var(--gold);font-size:15px;line-height:1.4;flex:0 0 auto}
  .notice b{color:var(--gold)}
  .notice code{background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--accent)}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(11,19,34,0.95);border:1px solid rgba(47,230,208,0.45);color:var(--accent);
    padding:10px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;
    transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){
    .wrap{padding:16px 14px 46px}
    #cards{grid-template-columns:1fr}
    #topbar{padding:12px 16px;min-height:0;gap:12px}
    .sm .v{font-size:27px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 顶部栏 ========== -->
  <header id="topbar" class="panel">
    <span class="brand">角色晶石台账</span>
    <span class="sep"></span>
    <span class="chip on" id="tbCount">0 个角色</span>
    <span class="right">
      <button class="chip" id="tbToggleAll" type="button">显示全部密码</button>
      <span class="chip warn">公开页面 · 注意防截图</span>
    </span>
  </header>

  <!-- ========== 汇总统计 ========== -->
  <section id="summary"></section>

  <!-- ========== 角色卡片 ========== -->
  <main id="cards"></main>

  <!-- ========== 提示 ========== -->
  <div class="notice panel">
    <span class="ico">⚠</span>
    <span>
      <b>安全提示</b>：本页托管在公开可访问的 <code>GitHub Pages</code> 上，任何拿到链接的人都能打开。
      密码默认打码，但点击眼睛图标即可看到明文 —— 请不要在他人可见的屏幕上展开，也不要截图外发。<br>
      数据全部来自本文件底部的 <code>ACCOUNTS</code> 数组，改数据 = 改数组字段，顶部四项汇总会自动重算。
    </span>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 数据区 —— 唯一改内容的地方
 * ------------------------------------------------------------
 * 每个角色一项。字段说明（金额单位：元 / 人民币）：
 *   account   账号      password  密码
 *   name      角色名    level     等级    job  职业    icon  头像文字（留空取角色名首字）
 *   gemsLeft  当前剩余晶石
 *   gemsSold  已出售晶石总数
 *   soldValue 已出售晶石总价值（元）
 *   laborCost 人工费用（元）
 *   updated   更新时间（可留空）
 * ============================================================ */
const ACCOUNTS = [
  {
    account: 'zhanghao01',
    password: 'pass-0001',
    name: '示例角色一',
    level: 45,
    job: '法师',
    icon: '',
    gemsLeft: 1200,
    gemsSold: 3400,
    soldValue: 2380.5,
    laborCost: 300,
    updated: '2026-09-22'
  },
  {
    account: 'zhanghao02',
    password: 'pass-0002',
    name: '示例角色二',
    level: 38,
    job: '战士',
    icon: '',
    gemsLeft: 860,
    gemsSold: 2100,
    soldValue: 1470,
    laborCost: 260,
    updated: '2026-09-22'
  },
  {
    account: 'zhanghao03',
    password: 'pass-0003',
    name: '示例角色三',
    level: 52,
    job: '刺客',
    icon: '',
    gemsLeft: 2450,
    gemsSold: 5600,
    soldValue: 3920,
    laborCost: 420,
    updated: '2026-09-22'
  },
  {
    account: 'zhanghao04',
    password: 'pass-0004',
    name: '示例角色四',
    level: 29,
    job: '牧师',
    icon: '',
    gemsLeft: 430,
    gemsSold: 980,
    soldValue: 686,
    laborCost: 180,
    updated: '2026-09-22'
  }
];

/* 卡片主题色：按顺序循环取用，让相邻卡片有区分度 */
const THEME = ['#2fe6d0', '#9b7bff', '#ffcf6b', '#7fd4ff', '#ff8a5c', '#57e39b', '#c77bff', '#ff6b6b'];

/* ============================================================
 * 工具函数
 * ============================================================ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* 千分位整数 */
function int(n) {
  return (Number(n) || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });
}
/* 金额：¥ + 千分位 + 最多两位小数 */
function money(n) {
  const v = Number(n) || 0;
  return '¥' + v.toLocaleString('zh-CN', {
    minimumFractionDigits: (v % 1) ? 2 : 0,
    maximumFractionDigits: 2
  });
}
/* 汇总（从角色数据实时累加） */
function summarize(list) {
  return list.reduce((a, c) => {
    a.gemsLeft  += Number(c.gemsLeft)  || 0;
    a.gemsSold  += Number(c.gemsSold)  || 0;
    a.soldValue += Number(c.soldValue) || 0;
    a.laborCost += Number(c.laborCost) || 0;
    return a;
  }, { roles: list.length, gemsLeft: 0, gemsSold: 0, soldValue: 0, laborCost: 0 });
}

/* ============================================================
 * 渲染
 * ============================================================ */
function renderSummary(s) {
  const items = [
    { cls: 'c-roles', ico: '👤', k: '角色数量',       v: int(s.roles) + '<small>个</small>',   note: '当前在册账号数' },
    { cls: 'c-left',  ico: '💎', k: '剩余总晶石',     v: int(s.gemsLeft) + '<small>颗</small>', note: '所有角色当前持有合计' },
    { cls: 'c-sold',  ico: '📦', k: '已出售晶石总数', v: int(s.gemsSold) + '<small>颗</small>', note: '累计已售出合计' },
    { cls: 'c-money', ico: '¥',  k: '出售晶石总价值', v: money(s.soldValue),                   note: '人民币 · 累计销售额' }
  ];
  document.getElementById('summary').innerHTML = items.map(i =>
    `<div class="sm panel ${i.cls}">
       <span class="k"><span class="ico">${i.ico}</span>${i.k}</span>
       <span class="v">${i.v}</span>
       <span class="note">${i.note}</span>
     </div>`).join('');
}

function cardHTML(c, i) {
  const color = THEME[i % THEME.length];
  const initial = (c.icon && String(c.icon).trim()) || String(c.name || '?').trim().charAt(0);
  const uid = 'pw-' + i;
  const hasLv = c.level != null && c.level !== '';

  return `
  <article class="card panel" style="--el:${color}">
    <div class="card-head">
      <div class="avatar">${esc(initial)}</div>
      <div class="id">
        <div class="name">
          <h2>${esc(c.name || '未命名角色')}</h2>
          <span class="idx">#${String(i + 1).padStart(2, '0')}</span>
        </div>
        <div class="tags">
          ${hasLv ? `<span class="tag lv">Lv.${esc(c.level)}</span>` : ''}
          ${c.job ? `<span class="tag job">${esc(c.job)}</span>` : ''}
        </div>
      </div>
    </div>

    <div class="card-body">

      <div class="sec">
        <h3>账号信息</h3>
        <div class="f"><span class="k">账号</span><span class="v mono">${esc(c.account || '—')}</span></div>
        <div class="f">
          <span class="k">密码</span>
          <span class="v">
            <span class="pw">
              <span class="mask" data-mask="${uid}">●●●●●●●●</span>
              <span class="plain" data-plain="${uid}" style="display:none" title="点击收回">${esc(c.password || '')}</span>
              <button class="eye" type="button" data-eye="${uid}" title="显示密码">👁</button>
            </span>
          </span>
        </div>
        <div class="f"><span class="k">角色名</span><span class="v">${esc(c.name || '—')}</span></div>
        <div class="f"><span class="k">等级</span><span class="v gold">${hasLv ? 'Lv.' + esc(c.level) : '—'}</span></div>
        <div class="f"><span class="k">职业</span><span class="v">${esc(c.job || '—')}</span></div>
      </div>

      <div class="sec">
        <h3>晶石数据</h3>
        <div class="f"><span class="k">当前剩余晶石</span><span class="v ok">${int(c.gemsLeft)} 颗</span></div>
        <div class="f"><span class="k">已出售晶石总数</span><span class="v purple">${int(c.gemsSold)} 颗</span></div>
        <div class="f"><span class="k">已出售晶石总价格</span><span class="v gold">${money(c.soldValue)}</span></div>
      </div>

      <div class="sec">
        <h3>费用</h3>
        <div class="f"><span class="k">人工费用</span><span class="v">${money(c.laborCost)}</span></div>
      </div>

    </div>

    <div class="card-foot">
      <button class="btn" type="button" data-act="copy-account" data-i="${i}">复制账号</button>
      <button class="btn" type="button" data-act="copy-pw" data-i="${i}">复制密码</button>
      <span class="stamp">${c.updated ? '更新 ' + esc(c.updated) : ''}</span>
    </div>
  </article>`;
}

function render() {
  document.getElementById('cards').innerHTML = ACCOUNTS.map(cardHTML).join('');
  renderSummary(summarize(ACCOUNTS));
  document.getElementById('tbCount').textContent = ACCOUNTS.length + ' 个角色';
}

/* ---------- 交互 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function copyText(text, label) {
  const done = () => toast(label + ' 已复制');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (err) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else { fallback(); }
}

/* 密码显示/隐藏：mask / plain / eye 三者互斥 */
function showPw(uid, show) {
  const mask  = document.querySelector(`[data-mask="${uid}"]`);
  const plain = document.querySelector(`[data-plain="${uid}"]`);
  const eye   = document.querySelector(`[data-eye="${uid}"]`);
  if (!mask || !plain || !eye) return;
  mask.style.display  = show ? 'none' : '';
  plain.style.display = show ? '' : 'none';
  eye.style.display   = show ? 'none' : '';
  eye.classList.toggle('on', show);
}

document.addEventListener('click', function (e) {
  /* 眼睛 → 展开明文 */
  const eye = e.target.closest('[data-eye]');
  if (eye) { showPw(eye.dataset.eye, true); return; }

  /* 点击明文本身 → 收回打码 */
  const plainEl = e.target.closest('[data-plain]');
  if (plainEl) { showPw(plainEl.dataset.plain, false); return; }

  /* 卡脚按钮 */
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const c = ACCOUNTS[Number(btn.dataset.i)];
  if (!c) return;
  if (btn.dataset.act === 'copy-account') copyText(c.account || '', '账号');
  if (btn.dataset.act === 'copy-pw')      copyText(c.password || '', '密码');
});

/* 顶部：一键显示/隐藏全部密码 */
document.getElementById('tbToggleAll').addEventListener('click', function () {
  const btn = this;
  const isShowing = btn.textContent === '隐藏全部密码';
  ACCOUNTS.forEach(function (_, i) { showPw('pw-' + i, !isShowing); });
  btn.textContent = isShowing ? '显示全部密码' : '隐藏全部密码';
  btn.classList.toggle('on', !isShowing);
});

render();
</script>
</body>
</html>
