<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>角色晶石台账</title>
<!-- ============================================================
     角色晶石台账 · 独立记录面板
     ------------------------------------------------------------
     稳定链接：https://dycxlcvxv00.github.io/baozhan-game/index-records.html
     结构：顶部栏(含 + 加角色) → 汇总统计 → 列标题条 → 角色卡片（横向一行一卡）
     列标题：4 个标签在顶部共享一次，各卡片只填数值（不重复标签文本）
     录入：每卡 4 个半透明输入框，提交后自动累计并刷新单卡与顶部汇总
     明细：卡片最右端 ▼ 展开每日明细（含当日收入=售价-人工，自动算）
     存储：localStorage 自动保存，顶部可导出/导入 JSON 备份
     ============================================================ -->
<style>
  :root{
    --bg0:#060912; --bg1:#0b1322;
    --panel:rgba(16,24,44,0.55);
    --glass:rgba(255,255,255,0.04);
    --line:rgba(125,165,225,0.16);
    --txt:#eaf0ff; --dim:#93a4c4; --mute:#6c7da0;
    --accent:#2fe6d0; --accent2:#9b7bff; --gold:#ffcf6b; --ok:#57e39b;
    --el:var(--accent);
    /* 行内布局：序号 / 角色信息 / 4 数据列 / 展开 —— 列头与卡片共用，保证对齐 */
    --c-idx:56px; --c-who:230px; --c-exp:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 50% -12%, #16243f 0%, rgba(22,36,63,0) 60%),
      radial-gradient(900px 600px at 12% 110%, rgba(34,28,72,0.55) 0%, rgba(34,28,72,0) 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    background-attachment:fixed;
    color:var(--txt); font-size:14px; line-height:1.5;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  ::selection{background:rgba(47,230,208,0.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
  ::-webkit-scrollbar-thumb{background:rgba(125,165,225,0.22);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(47,230,208,0.4)}

  .wrap{max-width:1600px;margin:0 auto;padding:22px 26px 56px}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(11px) saturate(120%); -webkit-backdrop-filter:blur(11px) saturate(120%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 6px 22px rgba(0,0,0,0.36),
      0 0 0 1px rgba(47,230,208,0.05);
    position:relative;
  }

  /* ---------- 顶部栏 ---------- */
  #topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 20px;min-height:54px;margin-bottom:14px}
  #topbar .brand{
    font-weight:800;font-size:18px;letter-spacing:1px;white-space:nowrap;
    background:linear-gradient(90deg,#fff,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #topbar .sep{width:1px;height:22px;background:var(--line)}
  #topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    height:28px;padding:0 12px;border-radius:15px;display:inline-flex;align-items:center;gap:6px;
    background:var(--glass);border:1px solid var(--line);color:var(--dim);font-size:12.5px;
    transition:.18s;white-space:nowrap;font-family:inherit;
  }
  button.chip{cursor:pointer}
  button.chip:hover{color:var(--txt);border-color:rgba(125,165,225,0.42)}
  .chip.on{color:var(--accent);border-color:rgba(47,230,208,0.5);box-shadow:0 0 12px rgba(47,230,208,0.25)}
  .chip.saved{color:var(--ok);border-color:rgba(87,227,155,0.4)}
  /* 加号：新增角色 */
  .chip.add{
    color:var(--accent);border-color:rgba(47,230,208,0.45);background:rgba(47,230,208,0.10);
    font-weight:700;padding:0 14px;
  }
  .chip.add:hover{box-shadow:0 0 16px rgba(47,230,208,0.35);background:rgba(47,230,208,0.18)}
  .chip.add .plus{font-size:16px;line-height:1;font-weight:800;margin-top:-1px}

  /* ---------- 汇总统计 ---------- */
  #summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .sm{padding:11px 16px;display:flex;flex-direction:column;gap:2px;overflow:hidden;align-items:center;text-align:center}
  .sm::after{
    content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,var(--el) 0%,transparent 68%);opacity:.10;pointer-events:none;
  }
  .sm .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .sm .k .ico{font-size:13px;opacity:.85}
  .sm .v{font-size:24px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .sm.c-roles{--el:#2fe6d0}   .sm.c-roles   .v{color:var(--accent)}
  .sm.c-left {--el:#57e39b}   .sm.c-left    .v{color:var(--ok)}
  .sm.c-sold {--el:#9b7bff}   .sm.c-sold    .v{color:var(--accent2)}
  .sm.c-money{--el:#ffcf6b}   .sm.c-money   .v{color:var(--gold)}
  .sm .v.flash{animation:flash .7s ease}
  @keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.06);filter:brightness(1.35)}100%{transform:scale(1)}}

  /* ---------- 列标题条（顶部共享一次，竖向对齐各卡片） ---------- */
  .colhead{
    display:flex;align-items:stretch;margin-bottom:6px;
    padding:0;border-radius:11px;background:rgba(255,255,255,0.028);
    border:1px solid rgba(125,165,225,0.10);
  }
  .colhead .h-idx{flex:0 0 var(--c-idx)}
  .colhead .h-who{
    flex:0 0 var(--c-who);padding:8px 14px 8px 0;
    font-size:11px;letter-spacing:1.2px;color:var(--mute);text-transform:uppercase;
    display:flex;align-items:center;
  }
  .colhead .h-cells{flex:1;display:grid;grid-template-columns:repeat(4,1fr);min-width:0}
  .colhead .h-cell{
    padding:8px 12px;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--dim);
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-right:1px solid rgba(125,165,225,0.08);
    display:flex;align-items:center;justify-content:center;
  }
  .colhead .h-cell:last-child{border-right:0}
  .colhead .h-exp{flex:0 0 var(--c-exp)}

  /* ---------- 角色卡片 ---------- */
  #cards{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;flex-direction:column}
  .card{
    --el:var(--accent);
    display:flex;align-items:stretch;
    padding:0; overflow:hidden; transition:.16s;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--el);opacity:.9;pointer-events:none;z-index:2;
  }
  .card:hover{
    border-color:color-mix(in srgb,var(--el) 38%,transparent);
    box-shadow:0 6px 24px rgba(0,0,0,0.45),0 0 16px color-mix(in srgb,var(--el) 16%,transparent);
  }

  /* 序号 */
  .idx{
    flex:0 0 var(--c-idx);display:flex;align-items:center;justify-content:center;
    font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--el);letter-spacing:0;
  }

  /* 角色信息区（靠左）—— 默认只读展示，点「修改」才变可编辑 */
  .who{
    flex:0 0 var(--c-who);min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;
    padding:8px 14px 8px 0;border-right:1px solid rgba(125,165,225,0.10);text-align:left;
  }
  .who .nm{
    font-size:14.5px;font-weight:800;letter-spacing:.2px;
    width:100%;padding:2px 0;border-radius:6px;
    background:transparent;border:1px solid transparent;
    color:var(--txt);font-family:inherit;outline:none;transition:.16s;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default;
  }
  .who .nm.empty{color:var(--mute);font-weight:600;font-style:normal}
  /* 编辑态（点「修改」后）才允许输入 */
  .who.editing .nm{
    padding:2px 7px;cursor:text;
    background:rgba(47,230,208,0.09);border-color:rgba(47,230,208,0.5);
    box-shadow:0 0 0 3px rgba(47,230,208,0.10);
  }
  .who .sub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute);min-width:0;flex-wrap:wrap}
  .who .sub .lv{color:var(--gold);font-weight:700;white-space:nowrap}
  .who .sub .job{color:var(--el);white-space:nowrap;font-weight:600}
  .who .sub .acct{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;
  }
  .who .tagnone{color:var(--mute);font-size:11px;opacity:.75}
  /* 行内小按钮：修改 / 保存 / 取消 / 删除 */
  .who .ops{margin-left:auto;display:flex;gap:4px;align-items:center;flex:0 0 auto}
  .who .ob{
    height:20px;padding:0 8px;border-radius:6px;flex:0 0 auto;
    border:1px solid transparent;background:transparent;color:var(--mute);
    cursor:pointer;font-size:11px;line-height:1;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .who .ob:hover{color:var(--txt);border-color:rgba(125,165,225,0.42);background:rgba(255,255,255,0.05)}
  .who .ob.edit:hover{color:var(--accent);border-color:rgba(47,230,208,0.5);background:rgba(47,230,208,0.10)}
  .who .ob.save{color:var(--accent);border-color:rgba(47,230,208,0.5);background:rgba(47,230,208,0.12)}
  .who .ob.save:hover{box-shadow:0 0 12px rgba(47,230,208,0.3)}
  .who .ob.del:hover{color:#ff8a8a;border-color:rgba(255,107,107,0.45);background:rgba(255,107,107,0.10)}
  .who.editing{border-right-color:rgba(47,230,208,0.3)}

  /* 数据 4 格：上=累计值(居中)，下=录入框 */
  .cells{flex:1;display:grid;grid-template-columns:repeat(4,1fr);min-width:0}
  .cell{
    padding:7px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;align-items:center;
    border-right:1px solid rgba(125,165,225,0.08);
  }
  .cell:last-child{border-right:0}
  .cell .v{
    font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px;line-height:1.15;
    text-align:center;width:100%;
  }
  .cell .v.ok{color:var(--ok)}
  .cell .v.purple{color:var(--accent2)}
  .cell .v.gold{color:var(--gold)}
  .cell .v.plain{color:var(--txt)}
  .cell .v.hit{animation:flash .7s ease}

  /* 半透明录入框 */
  .input{
    width:100%;height:26px;padding:0 9px;border-radius:7px;
    background:rgba(255,255,255,0.055);
    border:1px solid rgba(125,165,225,0.20);
    color:var(--txt);font-size:12.5px;font-family:inherit;
    font-variant-numeric:tabular-nums;outline:none;transition:.16s;min-width:0;
    text-align:center;
  }
  .input::placeholder{color:var(--mute);opacity:.72;font-size:11.5px}
  .input:hover{background:rgba(255,255,255,0.075);border-color:rgba(125,165,225,0.34)}
  .input:focus{
    background:rgba(47,230,208,0.09);border-color:rgba(47,230,208,0.55);
    box-shadow:0 0 0 3px rgba(47,230,208,0.10);
  }
  .input::-webkit-outer-spin-button,.input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .input[type=number]{-moz-appearance:textfield;appearance:textfield}

  /* 展开按钮 */
  .expand{
    flex:0 0 var(--c-exp);display:flex;align-items:center;justify-content:center;
    background:transparent;border:0;border-left:1px solid rgba(125,165,225,0.10);
    color:var(--mute);cursor:pointer;transition:.18s;font-family:inherit;
  }
  .expand:hover{color:var(--el);background:color-mix(in srgb,var(--el) 10%,transparent)}
  .expand .arw{display:inline-block;transition:transform .25s ease;font-size:13px;line-height:1}
  .row.open .expand{color:var(--el);background:color-mix(in srgb,var(--el) 10%,transparent)}
  .row.open .expand .arw{transform:rotate(180deg)}

  /* ---------- 展开的明细区 ---------- */
  .detail{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .25s ease;margin-top:0}
  .row.open .detail{max-height:1200px;opacity:1;margin-top:6px}
  .detail-inner{padding:12px 14px 13px;border-radius:12px}
  .detail-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;color:var(--mute);letter-spacing:.4px}
  .detail-head .ttl2{color:var(--el);font-weight:700;font-size:12.5px}
  .detail-head .right2{margin-left:auto;display:flex;gap:8px;align-items:center}
  .mini{
    height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;cursor:pointer;
    background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--dim);
    font-family:inherit;transition:.18s;
  }
  .mini:hover{color:var(--txt);border-color:rgba(125,165,225,0.4)}
  .mini.danger:hover{color:#ff8a8a;border-color:rgba(255,107,107,0.5)}

  table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
  table.dt th{
    font-weight:600;color:var(--mute);font-size:11px;
    padding:6px 10px;border-bottom:1px solid rgba(125,165,225,0.14);white-space:nowrap;text-align:center;
  }
  table.dt td{padding:6px 10px;border-bottom:1px solid rgba(125,165,225,0.06);white-space:nowrap;text-align:center}
  table.dt tbody tr:hover{background:rgba(255,255,255,0.025)}
  table.dt td.d{color:var(--dim)}
  table.dt td.n{font-weight:800}
  table.dt td.n.ok{color:var(--ok)} table.dt td.n.purple{color:var(--accent2)}
  table.dt td.n.gold{color:var(--gold)} table.dt td.n.plain{color:var(--txt)}
  table.dt td.n.income{color:var(--ok)}
  table.dt td.n.zero{color:var(--mute);font-weight:600}
  table.dt td.n.inc-zero{color:var(--mute);font-weight:600}
  table.dt tfoot td{
    padding:8px 10px;font-weight:800;color:var(--txt);border-top:1px solid rgba(125,165,225,0.18);
    border-bottom:0;font-size:12.5px;
  }
  table.dt .del{
    width:22px;height:22px;border-radius:6px;border:1px solid transparent;
    background:transparent;color:var(--mute);cursor:pointer;font-size:12px;line-height:1;
    font-family:inherit;padding:0;transition:.15s;
  }
  table.dt .del:hover{color:#ff8a8a;border-color:rgba(255,107,107,0.45);background:rgba(255,107,107,0.10)}
  .dt-empty{padding:14px;text-align:center;color:var(--mute);font-size:12.5px}

  .empty-tip{padding:26px;text-align:center;color:var(--mute);font-size:13px}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);
    background:rgba(11,19,34,0.95);border:1px solid rgba(47,230,208,0.45);color:var(--accent);
    padding:9px 18px;border-radius:22px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:.25s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 弹窗：新增 / 编辑角色 ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(3,6,14,0.72);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:80;
  }
  .mask.show{opacity:1;pointer-events:auto}
  .modal{
    width:440px;max-width:100%;padding:20px 22px 18px;border-radius:16px;
    transform:translateY(12px) scale(.98);transition:transform .22s cubic-bezier(.2,.9,.3,1.1);
  }
  .mask.show .modal{transform:translateY(0) scale(1)}
  .modal h2{
    margin:0 0 3px;font-size:16.5px;font-weight:800;letter-spacing:.4px;
    display:flex;align-items:center;gap:8px;
  }
  .modal h2 .bar{width:3px;height:15px;border-radius:2px;background:var(--accent);display:inline-block}
  .modal .hint{font-size:12px;color:var(--mute);margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.5px}
  .field label .req{color:var(--accent);margin-left:3px}
  .field input{
    width:100%;height:34px;padding:0 11px;border-radius:9px;
    background:rgba(255,255,255,0.055);border:1px solid rgba(125,165,225,0.22);
    color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:.16s;
  }
  .field input::placeholder{color:var(--mute);opacity:.75;font-size:12.5px}
  .field input:hover{background:rgba(255,255,255,0.075);border-color:rgba(125,165,225,0.36)}
  .field input:focus{background:rgba(47,230,208,0.09);border-color:rgba(47,230,208,0.55);box-shadow:0 0 0 3px rgba(47,230,208,0.10)}
  .field input.bad{border-color:rgba(255,107,107,0.6);box-shadow:0 0 0 3px rgba(255,107,107,0.12)}
  .field .err{font-size:11px;color:#ff8a8a;margin-top:4px;display:none}
  .field.bad .err{display:block}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .mbtn{
    height:34px;padding:0 18px;border-radius:17px;font-size:13px;cursor:pointer;
    background:rgba(22,31,56,0.9);color:var(--dim);border:1px solid var(--line);
    font-family:inherit;transition:.18s;font-weight:600;
  }
  .mbtn:hover{color:var(--txt);border-color:rgba(125,165,225,0.45)}
  .mbtn.primary{
    color:#04231f;background:linear-gradient(135deg,var(--accent),#5ce8d8);
    border-color:transparent;font-weight:700;
  }
  .mbtn.primary:hover{box-shadow:0 0 18px rgba(47,230,208,0.4);filter:brightness(1.06)}

  @media (max-width:1280px){ :root{--c-who:190px} }
  @media (max-width:1080px){
    .card{flex-wrap:wrap}
    .colhead .h-who{flex:1 1 160px}
    .who{flex:1 1 160px;border-right:0}
    .colhead .h-cells{flex:1 1 100%;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(125,165,225,0.10)}
    .colhead .h-cell:nth-child(2n){border-right:0}
    .cells{flex:1 1 100%;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(125,165,225,0.10)}
    .cell:nth-child(2n){border-right:0}
    .cell:nth-child(-n+2){border-bottom:1px solid rgba(125,165,225,0.08)}
    .expand{flex:0 0 100%;height:26px;border-left:0;border-top:1px solid rgba(125,165,225,0.10)}
    .colhead .h-exp{display:none}
    .colhead{display:none}   /* 窄屏字段名回填到每格 */
    .cell .k{display:block}
  }
  @media (max-width:720px){
    .wrap{padding:14px 12px 40px}
    #summary{grid-template-columns:repeat(2,1fr)}
    #topbar{padding:10px 14px;min-height:0;gap:10px}
    .sm .v{font-size:20px}
    .idx{flex:0 0 44px;font-size:20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 顶部栏 ========== -->
  <header id="topbar" class="panel">
    <span class="brand">角色晶石台账</span>
    <span class="sep"></span>
    <span class="chip on" id="tbCount">0 个角色</span>
    <span class="right">
      <button class="chip add" id="btnAdd" type="button" title="新增一个角色卡片"><span class="plus">＋</span>新增角色</button>
      <span class="chip saved" id="tbSaved">已自动保存</span>
      <button class="chip" id="btnExport" type="button">导出备份</button>
      <button class="chip" id="btnImport" type="button">导入备份</button>
    </span>
  </header>

  <!-- ========== 汇总统计 ========== -->
  <section id="summary"></section>

  <!-- ========== 列标题条（顶部共享一次） ========== -->
  <div class="colhead" id="colhead">
    <div class="h-idx"></div>
    <div class="h-who">角色信息</div>
    <div class="h-cells">
      <div class="h-cell">当前剩余晶石</div>
      <div class="h-cell">已出售晶石总数</div>
      <div class="h-cell">已出售晶石总价格</div>
      <div class="h-cell">人工费用</div>
    </div>
    <div class="h-exp"></div>
  </div>

  <!-- ========== 角色卡片 ========== -->
  <main id="cards"></main>
  <input id="fileInput" type="file" accept="application/json,.json" hidden />

</div>

<div class="toast" id="toast"></div>

<!-- ========== 弹窗：新增 / 编辑角色（账号 / 角色名 / 职业 / 等级） ========== -->
<div class="mask" id="mask">
  <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="mdTitle">
    <h2 id="mdTitle"><span class="bar"></span><span id="mdTitleTxt">新增角色</span></h2>
    <div class="hint" id="mdHint">填写以下 4 项信息，保存后生成一张角色卡片</div>

    <div class="field">
      <label for="fAccount">账号<span class="req">*</span></label>
      <input id="fAccount" type="text" maxlength="48" autocomplete="off" placeholder="登录账号，必填" />
      <div class="err">请填写账号</div>
    </div>
    <div class="field">
      <label for="fName">角色名</label>
      <input id="fName" type="text" maxlength="24" autocomplete="off" placeholder="游戏内角色名（可留空）" />
    </div>
    <div class="field">
      <label for="fJob">职业</label>
      <input id="fJob" type="text" maxlength="16" autocomplete="off" placeholder="如 法师 / 战士（可留空）" />
    </div>
    <div class="field">
      <label for="fLevel">等级</label>
      <input id="fLevel" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="如 45（可留空）" />
      <div class="err">等级请填数字</div>
    </div>

    <div class="modal-foot">
      <button class="mbtn" type="button" id="mdCancel">取消</button>
      <button class="mbtn primary" type="button" id="mdOk">确定</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 数据区 —— 初始角色（其余角色用顶部 ＋ 按钮新增）
 * ------------------------------------------------------------
 * 累计值 = 基准值 + 所有明细累加
 *   id        内部唯一标识
 *   account   账号（可留空，即在卡片「角色名」处直接录入）
 *   name      角色名
 *   level     等级    job 职业
 *   gemsLeft / gemsSold / soldValue / laborCost  历史累计基准
 *   records[] 每日明细 [{date, gemsLeft, daySold, dayValue, dayLabor}]
 * ============================================================ */
let ACCOUNTS = [
  { id:'a1', account:'', name:'', level:'', job:'', gemsLeft:0, gemsSold:0, soldValue:0, laborCost:0, records:[] }
];

const RING_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
function serial(n){ return n <= 10 ? RING_NUMS[n-1] : String(n); }
const THEME = ['#2fe6d0','#9b7bff','#ffcf6b','#7fd4ff','#ff8a5c','#57e39b','#c77bff','#ff6b6b'];

/* ============================================================
 * 工具
 * ============================================================ */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 数字：无千分号 */
function num(n){
  const v = Number(n) || 0;
  if (Number.isInteger(v)) return String(v);
  return String(Math.round(v * 100) / 100);
}
function intNum(n){ return num(Math.round(Number(n) || 0)); }
function money(n){ return '¥' + num(n); }
function today(){
  const d = new Date(), p = x => String(x).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
/* 当日收入 = 当日售价 - 当日人工（自动算） */
function income(r){ return (Number(r.dayValue)||0) - (Number(r.dayLabor)||0); }
function incomeText(r){ const v = income(r); return (v > 0 ? '+' : '') + num(v); }

/* 累计值 = 基准 + 明细 */
function totals(c){
  const t = { gemsLeft:Number(c.gemsLeft)||0, gemsSold:Number(c.gemsSold)||0,
              soldValue:Number(c.soldValue)||0, laborCost:Number(c.laborCost)||0 };
  (c.records||[]).forEach(function(r){
    t.gemsLeft  += Number(r.gemsLeft)  || 0;
    t.gemsSold  += Number(r.daySold)   || 0;
    t.soldValue += Number(r.dayValue)  || 0;
    t.laborCost += Number(r.dayLabor)  || 0;
  });
  return t;
}
function summarize(list){
  return list.reduce(function(a,c){
    const t = totals(c);
    a.gemsLeft += t.gemsLeft; a.gemsSold += t.gemsSold;
    a.soldValue += t.soldValue; a.laborCost += t.laborCost;
    return a;
  }, { roles:list.length, gemsLeft:0, gemsSold:0, soldValue:0, laborCost:0 });
}

/* ============================================================
 * 存储
 * ============================================================ */
const LS_KEY = 'gem-ledger-v2';
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      v:2, savedAt:new Date().toISOString(),
      accounts: ACCOUNTS.map(function(c){
        return { id:c.id, account:c.account, name:c.name, level:c.level, job:c.job,
                 gemsLeft:c.gemsLeft, gemsSold:c.gemsSold, soldValue:c.soldValue,
                 laborCost:c.laborCost, records:c.records || [] };
      })
    }));
    flashSaved();
  }catch(e){}
}
function loadLocal(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){ return false; }
  if(!raw) return false;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return false; }
  if(!data || !Array.isArray(data.accounts) || !data.accounts.length) return false;
  ACCOUNTS = data.accounts.map(function(s, i){
    return {
      id: s.id || ('a' + (i+1)),
      account: s.account || '', name: s.name || '',
      level: s.level != null ? s.level : '', job: s.job || '',
      gemsLeft: Number(s.gemsLeft)||0, gemsSold: Number(s.gemsSold)||0,
      soldValue: Number(s.soldValue)||0, laborCost: Number(s.laborCost)||0,
      records: Array.isArray(s.records) ? s.records : []
    };
  });
  return true;
}

/* ============================================================
 * 渲染
 * ============================================================ */
function renderSummary(sum, animate){
  const items = [
    { cls:'c-roles', ico:'👤', key:'roles',     k:'角色数量',       v:num(sum.roles) },
    { cls:'c-left',  ico:'💎', key:'gemsLeft',  k:'剩余总晶石',     v:intNum(sum.gemsLeft) },
    { cls:'c-sold',  ico:'📦', key:'gemsSold',  k:'已出售晶石总数', v:intNum(sum.gemsSold) },
    { cls:'c-money', ico:'¥',  key:'soldValue', k:'出售晶石总价值', v:money(sum.soldValue) }
  ];
  document.getElementById('summary').innerHTML = items.map(function(i){
    return '<div class="sm panel ' + i.cls + '">'
      + '<span class="k"><span class="ico">' + i.ico + '</span>' + i.k + '</span>'
      + '<span class="v" data-sum="' + i.key + '">' + i.v + '</span>'
      + '</div>';
  }).join('');
  if(animate){ items.forEach(function(i){
    if(i.key === 'roles') return;
    const el = document.querySelector('[data-sum="'+i.key+'"]');
    if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  }); }
}
function refreshNumbers(i){
  const row = document.querySelector('.row[data-i="'+i+'"]');
  if(row){
    const t = totals(ACCOUNTS[i]);
    setV(row,'gemsLeft',  intNum(t.gemsLeft), 'hit');
    setV(row,'gemsSold',  intNum(t.gemsSold), 'hit');
    setV(row,'soldValue', money(t.soldValue), 'hit');
    setV(row,'laborCost', money(t.laborCost), 'hit');
  }
  const sum = summarize(ACCOUNTS);
  setText('[data-sum="roles"]',     num(sum.roles));
  setText('[data-sum="gemsLeft"]',  intNum(sum.gemsLeft),  true);
  setText('[data-sum="gemsSold"]',  intNum(sum.gemsSold),  true);
  setText('[data-sum="soldValue"]', money(sum.soldValue),  true);
}
function setV(row, key, html, anim){
  const el = row.querySelector('[data-v="'+key+'"]');
  if(!el) return;
  el.textContent = html;
  if(anim){ el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
}
function setText(sel, html, anim){
  const el = document.querySelector(sel);
  if(!el) return;
  el.textContent = html;
  if(anim){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}

/* 明细表：含「当日收入」= 当日售价 - 当日人工 */
function detailHTML(i){
  const c = ACCOUNTS[i];
  const recs = c.records || [];
  const rows = recs.length ? recs.slice().reverse().map(function(r){
    const oi = recs.indexOf(r);
    const z = v => (Number(v)||0) === 0 ? ' zero' : '';
    const inc = income(r);
    const icls = inc === 0 ? ' inc-zero' : ' income';
    return '<tr>'
      + '<td class="d">' + esc(r.date || '') + '</td>'
      + '<td class="n ok'+z(r.gemsLeft)+'">' + intNum(r.gemsLeft) + '</td>'
      + '<td class="n purple'+z(r.daySold)+'">' + intNum(r.daySold) + '</td>'
      + '<td class="n gold'+z(r.dayValue)+'">' + num(r.dayValue) + '</td>'
      + '<td class="n plain'+z(r.dayLabor)+'">' + num(r.dayLabor) + '</td>'
      + '<td class="n'+icls+'">' + incomeText(r) + '</td>'
      + '<td><button class="del" type="button" title="删除这条记录" '
      +   'data-del="' + i + '" data-ri="' + oi + '">✕</button></td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="7"><div class="dt-empty">暂无录入记录 —— 在上方输入框填入『当日』数据，回车即自动记一条</div></td></tr>';

  const s = recs.reduce(function(a,r){
    a.gemsLeft += Number(r.gemsLeft)||0; a.daySold += Number(r.daySold)||0;
    a.dayValue += Number(r.dayValue)||0; a.dayLabor += Number(r.dayLabor)||0;
    a.inc += income(r);
    return a;
  }, {gemsLeft:0,daySold:0,dayValue:0,dayLabor:0,inc:0});

  const foot = recs.length ? '<tfoot><tr>'
    + '<td>合计 ' + recs.length + ' 条</td>'
    + '<td>' + intNum(s.gemsLeft) + '</td>'
    + '<td>' + intNum(s.daySold) + '</td>'
    + '<td>' + num(s.dayValue) + '</td>'
    + '<td>' + num(s.dayLabor) + '</td>'
    + '<td>' + (s.inc > 0 ? '+' : '') + num(s.inc) + '</td>'
    + '<td></td></tr></tfoot>' : '';

  return '<div class="detail-inner panel">'
    + '<div class="detail-head">'
    +   '<span class="ttl2">' + esc(c.name || '未命名角色') + ' · 每日明细</span>'
    +   '<span>共 ' + recs.length + ' 条</span>'
    +   '<span class="right2"><button class="mini danger" type="button" data-clear="' + i + '">清空明细</button></span>'
    + '</div>'
    + '<table class="dt">'
    + '<thead><tr>'
    +   '<th>日期</th><th>剩余晶石</th><th>当日出售</th><th>当日售价</th>'
    +   '<th>当日人工</th><th>当日收入</th><th></th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + foot
    + '</table></div>';
}

/* 角色信息：只读展示 + 「修改」按钮（改内容走弹窗） */
function whoHTML(c, i){
  const meta = [];
  if(c.level !== '' && c.level != null) meta.push('<span class="lv">Lv.' + esc(c.level) + '</span>');
  if(c.job) meta.push('<span class="job">' + esc(c.job) + '</span>');
  if(c.account) meta.push('<span class="acct">' + esc(c.account) + '</span>');
  if(!meta.length) meta.push('<span class="tagnone">未填写账号信息</span>');

  const ops = '<button class="ob edit" type="button" data-edit="' + i + '" title="修改账号信息">修改</button>'
            + '<button class="ob del" type="button" data-rm="' + i + '" title="删除该角色卡片">✕</button>';

  return '<div class="who">'
    + '<div class="nm' + (c.name ? '' : ' empty') + '">'
    +   (c.name ? esc(c.name) : '未命名角色') + '</div>'
    + '<div class="sub">' + meta.join('') + '<span class="ops">' + ops + '</span></div>'
    + '</div>';
}

/* 一行一卡：序号 | 角色信息（只读/可编辑） | 4 数值格(居中) + 录入框 | ▼ */
function cardHTML(c, i){
  const color = THEME[i % THEME.length];
  const t = totals(c);
  const cell = (vkey, vhtml, cls, ph) =>
    '<div class="cell">'
    + '<span class="v ' + cls + '" data-v="' + vkey + '">' + vhtml + '</span>'
    + '<input class="input" type="number" inputmode="decimal" step="any" '
    +   'data-i="' + i + '" data-f="' + vkey + '" placeholder="' + ph + '" />'
    + '</div>';

  return '<div class="row" data-i="' + i + '">'
    + '<article class="card panel" style="--el:' + color + '">'
    +   '<div class="idx">' + serial(i+1) + '</div>'
    +   whoHTML(c, i)
    +   '<div class="cells">'
    +     cell('gemsLeft',  intNum(t.gemsLeft), 'ok',     '当日剩余')
    +     cell('gemsSold',  intNum(t.gemsSold), 'purple', '当日出售')
    +     cell('soldValue', money(t.soldValue), 'gold',   '当日售价')
    +     cell('laborCost', money(t.laborCost), 'plain',  '当日人工')
    +   '</div>'
    +   '<button class="expand" type="button" data-toggle="' + i + '" title="展开每日明细" aria-expanded="false">'
    +     '<span class="arw">▼</span></button>'
    + '</article>'
    + '<div class="detail" id="detail-' + i + '">' + detailHTML(i) + '</div>'
    + '</div>';
}

function render(){
  const box = document.getElementById('cards');
  box.innerHTML = ACCOUNTS.length
    ? ACCOUNTS.map(cardHTML).join('')
    : '<div class="empty-tip panel">暂无角色 —— 点右上角「＋ 新增角色」添加</div>';
  renderSummary(summarize(ACCOUNTS));
  document.getElementById('tbCount').textContent = ACCOUNTS.length + ' 个角色';
}

/* ============================================================
 * 交互
 * ============================================================ */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1700);
}
let savedTimer = null;
function flashSaved(){
  const el = document.getElementById('tbSaved');
  if(!el) return;
  el.textContent = '已自动保存 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
  clearTimeout(savedTimer);
  savedTimer = setTimeout(function(){ el.textContent = '已自动保存'; }, 2600);
}

/* 录入提交：把 4 个输入框收成一条当日记录（未填按 0） */
function commitEntry(i){
  const row = document.querySelector('.row[data-i="'+i+'"]');
  if(!row) return;
  const ins = row.querySelectorAll('.input');
  const vals = Array.prototype.map.call(ins, function(el){
    const v = parseFloat(el.value);
    return isFinite(v) ? v : 0;
  });
  if(vals.every(function(v){ return v === 0; })){
    toast('未填写任何数值（未录入按 0 计）');
    return;
  }
  ACCOUNTS[i].records = ACCOUNTS[i].records || [];
  const rec = { date:today(), gemsLeft:vals[0], daySold:vals[1], dayValue:vals[2], dayLabor:vals[3] };
  ACCOUNTS[i].records.push(rec);
  Array.prototype.forEach.call(ins, function(el){ el.value = ''; });
  refreshNumbers(i);
  const d = document.getElementById('detail-' + i);
  if(d) d.innerHTML = detailHTML(i);
  saveLocal();
  toast('已记录（当日收入 ' + incomeText(rec) + '）');
}

/* 键盘 */
document.addEventListener('keydown', function(e){
  const t = e.target;
  if(t.classList && t.classList.contains('input')){
    if(e.key === 'Enter'){ e.preventDefault(); commitEntry(Number(t.dataset.i)); }
    return;
  }
  if(t.classList && t.classList.contains('del') && e.key === 'Enter'){ e.preventDefault(); t.click(); }
  /* 弹窗：Esc 关闭，Enter 确定 */
  if(mask.classList.contains('show')){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); }
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); modalOk(); }
  }
});

/* ============================================================
 * 弹窗：新增 / 编辑角色（账号 / 角色名 / 职业 / 等级）
 * ============================================================ */
const mask = document.getElementById('mask');
const fAccount = document.getElementById('fAccount');
const fName    = document.getElementById('fName');
const fJob     = document.getElementById('fJob');
const fLevel   = document.getElementById('fLevel');
let modalMode = 'add';   // 'add' | 'edit'
let modalIdx  = -1;

function openModal(mode, idx){
  modalMode = mode; modalIdx = (idx == null ? -1 : idx);
  const c = (mode === 'edit') ? ACCOUNTS[modalIdx] : null;
  document.getElementById('mdTitleTxt').textContent = (mode === 'edit') ? '修改角色信息' : '新增角色';
  document.getElementById('mdHint').textContent = (mode === 'edit')
    ? '修改后点「确定」保存'
    : '填写以下 4 项信息，保存后生成一张角色卡片';
  fAccount.value = c ? (c.account || '') : '';
  fName.value    = c ? (c.name    || '') : '';
  fJob.value     = c ? (c.job     || '') : '';
  fLevel.value   = c ? (c.level   || '') : '';
  [fAccount, fName, fJob, fLevel].forEach(function(el){
    el.classList.remove('bad');
    el.closest('.field').classList.remove('bad');
  });
  mask.classList.add('show');
  setTimeout(function(){ fAccount.focus(); }, 80);
}
function closeModal(){
  mask.classList.remove('show');
}
function modalOk(){
  const account = fAccount.value.trim();
  const name    = fName.value.trim();
  const job     = fJob.value.trim();
  const lvRaw   = fLevel.value.trim();

  /* 账号必填 */
  let bad = false;
  if(!account){ fAccount.classList.add('bad'); fAccount.closest('.field').classList.add('bad'); bad = true; }
  else { fAccount.classList.remove('bad'); fAccount.closest('.field').classList.remove('bad'); }
  /* 等级必须是数字（可留空） */
  if(lvRaw !== '' && !/^\d+$/.test(lvRaw)){
    fLevel.classList.add('bad'); fLevel.closest('.field').classList.add('bad'); bad = true;
  } else { fLevel.classList.remove('bad'); fLevel.closest('.field').classList.remove('bad'); }
  if(bad){ (fAccount.classList.contains('bad') ? fAccount : fLevel).focus(); return; }

  const level = lvRaw === '' ? '' : Number(lvRaw);

  if(modalMode === 'edit'){
    const c = ACCOUNTS[modalIdx];
    c.account = account; c.name = name; c.job = job; c.level = level;
    /* 同步更新已展开明细的标题 */
    const tt = document.querySelector('.row[data-i="' + modalIdx + '"] .ttl2');
    if(tt) tt.textContent = (name || '未命名角色') + ' · 每日明细';
    render();
    saveLocal();
    toast('已保存修改');
  } else {
    ACCOUNTS.push({
      id:'a' + Date.now(), account:account, name:name, job:job, level:level,
      gemsLeft:0, gemsSold:0, soldValue:0, laborCost:0, records:[]
    });
    render();
    saveLocal();
    toast('已新增角色「' + (name || account) + '」');
  }
  closeModal();
}

document.getElementById('mdCancel').addEventListener('click', closeModal);
document.getElementById('mdOk').addEventListener('click', modalOk);
mask.addEventListener('click', function(e){ if(e.target === mask) closeModal(); });
[fAccount, fName, fJob, fLevel].forEach(function(el){
  el.addEventListener('input', function(){
    el.classList.remove('bad'); el.closest('.field').classList.remove('bad');
  });
});

/* ============================================================
 * 卡片交互
 * ============================================================ */
document.addEventListener('click', function(e){
  /* 展开 / 收起 */
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const row = tg.closest('.row');
    const open = row.classList.toggle('open');
    tg.setAttribute('aria-expanded', open ? 'true' : 'false');
    return;
  }
  /* 修改（弹窗编辑） */
  const ed = e.target.closest('[data-edit]');
  if(ed){ openModal('edit', Number(ed.dataset.edit)); return; }

  /* 删除单条明细 */
  const del = e.target.closest('[data-del]');
  if(del){
    const i = Number(del.dataset.del), ri = Number(del.dataset.ri);
    ACCOUNTS[i].records.splice(ri, 1);
    refreshNumbers(i);
    document.getElementById('detail-' + i).innerHTML = detailHTML(i);
    saveLocal();
    toast('已删除该条记录');
    return;
  }
  /* 清空该角色明细 */
  const cl = e.target.closest('[data-clear]');
  if(cl){
    const i = Number(cl.dataset.clear);
    const n = (ACCOUNTS[i].records || []).length;
    if(!n){ toast('本来就没有明细'); return; }
    if(!confirm('确定清空「' + (ACCOUNTS[i].name || ACCOUNTS[i].account || '未命名角色') + '」的 ' + n + ' 条明细？此操作不可撤销。')) return;
    ACCOUNTS[i].records = [];
    refreshNumbers(i);
    document.getElementById('detail-' + i).innerHTML = detailHTML(i);
    saveLocal();
    toast('已清空 ' + n + ' 条明细');
    return;
  }
  /* 删除角色卡片 */
  const rm = e.target.closest('[data-rm]');
  if(rm){
    const i = Number(rm.dataset.rm);
    if(!confirm('确定删除该角色卡片？其所有明细将一并删除。')) return;
    ACCOUNTS.splice(i, 1);
    render();
    saveLocal();
    toast('已删除该角色');
    return;
  }
});

/* ＋ 新增角色 → 打开弹窗 */
document.getElementById('btnAdd').addEventListener('click', function(){
  openModal('add');
});

/* 导出 / 导入 */
document.getElementById('btnExport').addEventListener('click', function(){
  const data = { v:2, exportedAt:new Date().toISOString(), accounts:ACCOUNTS };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gem-ledger-' + today() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('已导出备份 JSON');
});
document.getElementById('btnImport').addEventListener('click', function(){
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const data = JSON.parse(fr.result);
      if(!data || !Array.isArray(data.accounts)) throw new Error('bad');
      ACCOUNTS = data.accounts.map(function(s, i){
        return {
          id: s.id || ('a' + (i+1)),
          account: s.account || '', name: s.name || '',
          level: s.level != null ? s.level : '', job: s.job || '',
          gemsLeft: Number(s.gemsLeft)||0, gemsSold: Number(s.gemsSold)||0,
          soldValue: Number(s.soldValue)||0, laborCost: Number(s.laborCost)||0,
          records: Array.isArray(s.records) ? s.records : []
        };
      });
      render(); saveLocal();
      toast('已导入 ' + ACCOUNTS.length + ' 个角色');
    }catch(err){ toast('导入失败：不是有效的备份文件'); }
    e.target.value = '';
  };
  fr.readAsText(f);
});

/* ---------- 启动 ---------- */
loadLocal();
render();
</script>
</body>
</html>
