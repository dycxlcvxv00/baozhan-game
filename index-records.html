let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1700);
}
let savedTimer = null;
function flashSaved(){
  const el = document.getElementById('tbSaved');
  if(!el) return;
  el.textContent = '已自动保存 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
  clearTimeout(savedTimer);
  savedTimer = setTimeout(function(){ el.textContent = '已自动保存'; }, 2600);
}

/* 收集单张卡片录入框里的值
   —— 语义区别 ——
   「当前剩余晶石」是时点值：填了就以填的为准，留空表示本次不改动，
                    沿用当前最新剩余，绝不写成 0。
   其余 4 项是流水：填多少记多少（留空按 0）
   返回 null 表示该卡片没有任何待提交内容。 */
function collectRow(i){
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if(!row) return null;
  const ins = row.querySelectorAll('.input');
  const v = {};
  let anyFilled = false, leftFilled = false, filledCount = 0;
  Array.prototype.forEach.call(ins, function(el){
    const raw = el.value == null ? '' : String(el.value).trim();
    const n = parseFloat(raw);
    const ok = isFinite(n) && raw !== '';
    /* 余额是「时点值」：0 也是合法状态（晶石花光了），填 0 同样算有效录入；
       其余 4 项是流水：0 与留空等价，不触发提交。
       —— 修复：此前余额填 0 会被当成"没填"，整次提交被拒、按钮也不亮 */
    if(ok && (n !== 0 || el.dataset.f === 'gemsLeft')){ anyFilled = true; filledCount++; }
    if(el.dataset.f === 'gemsLeft' && ok) leftFilled = true;
    v[el.dataset.f] = ok ? n : 0;
  });
  if(!anyFilled) return null;
  return { ins:ins, v:v, leftFilled:leftFilled, filledCount:filledCount };
}

/* 把收集到的值落成一条记录 */
function pushRec(i, got){
  ACCOUNTS[i].records = ACCOUNTS[i].records || [];
  /* 剩余留空 → 沿用当前最新剩余（覆盖语义下，"不改动"才是正确默认） */
  const curLeft = latestLeft(ACCOUNTS[i]);
  /* 同时记录日期与时间，时间精确到秒 */
  const rec = {
    date: today(), time: nowTime(),
    gemsLeft:  got.leftFilled ? got.v.gemsLeft : curLeft,
    daySold:   got.v.gemsSold  || 0,
    dayValue:  got.v.soldValue || 0,
    dayLabor:  got.v.laborCost || 0,
    chaosCost: got.v.chaosCost || 0
  };
  ACCOUNTS[i].records.push(rec);
  Array.prototype.forEach.call(got.ins, function(el){ el.value = ''; });
  return rec;
}

/* 记录后刷新该卡片的显示与明细 */
function afterCommit(i){
  markDirty(i, false);
  refreshNumbers(i);
  const d = document.getElementById('detail-' + i);
  if(d){
    const wasOpen = d.closest('.row') && d.closest('.row').classList.contains('open');
    d.innerHTML = detailHTML(i);
    if(wasOpen) syncDetailCols(i);
  }
}

/* 凌晨时段（0:00~7:59）录入归前一天 —— toast 里明确告知归属，避免"我明明今天录的" */
function weeNote(rec){
  return (new Date().getHours() < 8) ? '（凌晨时段，计入 ' + rec.date + '）' : '';
}

/* 单卡提交：「记录」按钮 */
function commitEntry(i){
  const got = collectRow(i);
  if(!got){ toast('未填写任何数值（未录入按 0 计）'); return; }
  const rec = pushRec(i, got);
  afterCommit(i);
  autoSettle();                    /* 录入后自动刷新当天快照（幂等，通常只动今天） */
  saveLocal();
  syncCommitAll();
  toast('已记录 ' + rec.time + '（净利润 ' + incomeText(rec) + '）' + weeNote(rec));
}

/* 一键提交所有有变动的卡片（顶部「记录全部」）
   逐卡收集，只提交真的填了值的卡片，没填的跳过、不产生空记录 */
function commitAll(){
  const rows = document.querySelectorAll('.row[data-i]');
  const pending = [];
  Array.prototype.forEach.call(rows, function(row){
    const i = Number(row.dataset.i);
    const got = collectRow(i);
    if(got) pending.push({ i:i, got:got });
  });
  if(!pending.length){
    toast('没有需要记录的内容 —— 先在卡片里填入数值');
    return;
  }
  const times = [];
  pending.forEach(function(p){
    const rec = pushRec(p.i, p.got);
    times.push(rec.time);
    afterCommit(p.i);
  });
  autoSettle();                    /* 录入后自动刷新当天快照（幂等） */
  saveLocal();
  syncCommitAll();
  const who = pending.length === 1
    ? '1 个角色'
    : pending.length + ' 个角色';
  toast('已记录 ' + who + '（' + times[times.length - 1] + '）'
        + (pending.length ? weeNote({ date: today() }) : ''));
}

/* 「记录」按钮高亮状态：有未提交内容时闪烁提示 */
function markDirty(i, dirty){
  const row = document.querySelector('.row[data-i="' + i + '"]');
  if(!row) return;
  const btn = row.querySelector('.btnrec');
  if(btn) btn.classList.toggle('dirty', !!dirty);
  syncCommitAll();
}

/* 顶部「记录全部」按钮：统计有多少卡片有待提交内容 */
function countPending(){
  let n = 0;
  Array.prototype.forEach.call(document.querySelectorAll('.row[data-i]'), function(row){
    if(collectRow(Number(row.dataset.i))) n++;
  });
  return n;
}
function syncCommitAll(){
  const btn = document.getElementById('btnCommitAll');
  if(!btn) return;
  const n = countPending();
  const cnt = document.getElementById('commitCnt');
  if(cnt) cnt.textContent = String(n);
  btn.classList.toggle('on', n > 0);
  btn.classList.remove('ok');
}
function anyInputFilled(row){
  const ins = row.querySelectorAll('.input');
  return Array.prototype.some.call(ins, function(el){
    const raw = el.value == null ? '' : String(el.value).trim();
    const n = parseFloat(raw);
    /* 与 collectRow 同口径：余额填 0 也算有效（时点值），流水 0 不算 */
    if(el.dataset.f === 'gemsLeft') return isFinite(n) && raw !== '';
    return isFinite(n) && raw !== '' && n !== 0;
  });
}

/* 录入框内容变化 → 按钮闪烁提示 + 更新顶部计数 */
document.addEventListener('input', function(e){
  const t = e.target;
  if(!(t.classList && t.classList.contains('input'))) return;
  const row = t.closest('.row');
  if(!row) return;
  markDirty(Number(t.dataset.i), anyInputFilled(row));
});

/* 顶部「记录全部」按钮 */
document.getElementById('btnCommitAll').addEventListener('click', function(){
  commitAll();
});

/* ============================================================
 * 今日结算：把缺的日期按明细补齐
 * ------------------------------------------------------------
 * 每天第一次打开点一下即可。连续几天没打开，一次补齐所有缺的日期。
 * 快照按明细的 date 分天统计，彼此独立，互不影响。
 * ============================================================ */

/* 刷新结算按钮外观与计数
 *   有待结算 → 金色呼吸 + 显示缺几天
 *   今天已结算过、且无历史缺漏 → 灰色「今日已结算」
 *   今天已结算但还有更早的缺漏 → 紫色「补 N 天」 */
function syncSettleBtn(){
  const btn = document.getElementById('btnSettle');
  if(!btn) return;
  const txt = document.getElementById('settleTxt');
  const cnt = document.getElementById('settleCnt');
  const pend = pendingSettleDates(ACCOUNTS, SNAPSHOTS);
  const n = pend.missing.length;
  /* 有没有录入过明细（而不是"今天有没有"）——空白天也要补快照，所以只看整体 */
  const hasAnyRecs = pend.all.length > 0;
  const todayDone  = !!SNAPSHOTS[today()];

  btn.classList.remove('on','done');

  if(n > 0){
    btn.classList.add('on');
    if(cnt){ cnt.textContent = String(n); cnt.style.display = ''; }
    if(txt){
      /* 只有「今天」这一天缺 → 写「今日结算」；含历史缺漏 → 写「补结算」 */
      txt.textContent = (n === 1 && pend.missing[0] === today()) ? '今日结算' : '补结算';
    }
    btn.title = '待结算 ' + n + ' 天（含无录入的空白日）：'
              + pend.missing.join('、');
  }else if(!hasAnyRecs){
    /* 一条明细都还没有 —— 没什么可结算的 */
    btn.classList.add('done');
    if(cnt){ cnt.textContent = '—'; cnt.style.display = ''; }
    if(txt) txt.textContent = '暂无明细';
    btn.title = '还没有任何明细记录 —— 先在卡片里填数值并点「记录全部」';
  }else if(!todayDone){
    /* 有明细但今天还没结 —— 理论走不到，兜底 */
    btn.classList.add('on');
    if(cnt){ cnt.textContent = '1'; cnt.style.display = ''; }
    if(txt) txt.textContent = '今日结算';
    btn.title = '点一下补齐 ' + today();
  }else{
    /* 全部结清 */
    btn.classList.add('done');
    if(cnt) cnt.style.display = 'none';
    if(txt) txt.textContent = '今日已结算';
    btn.title = '已结算 ' + settledDates().length + ' 天，点一下可查看';
  }
}

/* 星期几（给弹窗用） */
function weekdayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return '周' + '日一二三四五六'.charAt(d.getDay());
}

/* 渲染结算结果弹窗 */
function renderSettleModal(result, mode){
  const list = document.getElementById('stList');
  const title = document.getElementById('stTitleTxt');
  const hint = document.getElementById('stHint');
  if(!list) return;

  if(mode === 'view'){
    /* 查看模式：列出所有已结算的日子 */
    const dates = settledDates().reverse();
    title.textContent = '已结算记录';
    hint.textContent = dates.length
      ? '共 ' + dates.length + ' 天。结算周期为每日 08:00 → 次日 08:00，凌晨时段（00:00~07:59）的录入归前一天。'
      : '还没有任何结算记录。先录入明细，再点「今日结算」。';
    if(!dates.length){
      list.innerHTML = '<div class="st-none"><span class="big">◷</span>还没有结算记录</div>';
      return;
    }
    list.innerHTML = dates.map(function(d){
      return dayCardHTML(SNAPSHOTS[d], false);
    }).join('');
    return;
  }

  /* 结算模式：展示刚补齐的日子 */
  const added = result.added;
  if(!added.length){
    title.textContent = '无需结算';
    hint.textContent = '从首条明细到今天，所有日期都已经结算过了。';
    const dates = settledDates().reverse();
    list.innerHTML = dates.slice(0, 6).map(function(d){
      return dayCardHTML(SNAPSHOTS[d], false);
    }).join('') || '<div class="st-none"><span class="big">✓</span>暂时没有需要结算的内容</div>';
    return;
  }

  const blankN = added.filter(function(a){ return a.snap && a.snap.total && !a.snap.total.recordCount; }).length;
  title.textContent = '结算完成 · ' + added.length + ' 天';
  const ds = added.map(function(a){ return a.date; });
  const first = ds[0], last = ds[ds.length - 1];
  let msg = (added.length === 1)
    ? '已生成 ' + first + ' 的日结快照'
    : '已补齐 ' + first + ' ～ ' + last + ' 共 ' + added.length + ' 天的日结快照';
  if(blankN) msg += '；其中 ' + blankN + ' 天没有录入，按空白日记录（流水为 0、剩余沿用前值）。';
  hint.textContent = msg;
  list.innerHTML = added.map(function(a){
    return dayCardHTML(a.snap, true);
  }).join('');
}

/* 单日卡片 HTML */
function dayCardHTML(snap, isNew){
  if(!snap) return '';
  const t = snap.total || {};
  const isToday = snap.date === today();
  const isBlank = !(t.recordCount > 0);      /* 当天一条明细都没有 */
  const tag = isBlank
    ? '<span class="tag blank">空白日</span>'
    : (isNew
        ? '<span class="tag">' + (isToday ? '本次结算' : '补录') + '</span>'
        : (isToday ? '<span class="tag today">今天</span>' : '<span class="tag">已结算</span>'));

  const cell = function(k, v, cls){
    return '<div class="st-num"><span class="k">' + k + '</span>'
         + '<span class="v' + (cls ? ' ' + cls : '') + '">' + v + '</span></div>';
  };

  const profitCls = (t.profit || 0) > 0 ? 'pos' : ((t.profit || 0) < 0 ? 'neg' : 'dim');

  /* 角色摘要：名称 已获取/剩余；空白天标一下 */
  const lines = (snap.accounts || []).map(function(a){
    const tail = a.blank
      ? '<span class="bl">（无录入）</span>'
      : ' 获取 ' + num(a.gained) + ' · 已售 ' + num(a.gemsSold) + ' · 净利 ' + money(a.profit);
    return '<b>' + esc(a.name || a.account || '未命名') + '</b>'
         + ' 剩余 ' + num(a.gemsLeft) + tail;
  });

  return '<div class="st-day' + (isBlank ? ' is-blank' : '') + '">'
    + '<div class="st-head">'
    +   '<span class="dt">' + snap.date + '</span>'
    +   '<span class="wk">' + weekdayOf(snap.date) + '</span>'
    +   tag
    + '</div>'
    + '<div class="st-nums">'
    +   cell('角色数量', num(t.roles), 'acc')
    +   cell('剩余晶石总量', num(t.gemsLeft))
    +   cell('已获取晶石总量', num(t.gained))
    +   cell('已出售晶石总量', num(t.gemsSold))
    +   cell('总收入', money(t.soldValue), 'gold')
    +   cell('人工支出', money(t.laborCost))
    +   cell('净利润', money(t.profit), profitCls)
    +   cell('秘境消耗', num(t.chaosCost))
    + '</div>'
    + (lines.length ? '<div class="st-roles">' + lines.join('<br>') + '</div>' : '')
    + '</div>';
}

function openSettleModal(){
  document.getElementById('settleMask').classList.add('show');
}
function closeSettleModal(){
  document.getElementById('settleMask').classList.remove('show');
}

/* 点「今日结算」 */
function doSettle(){
  const pend = pendingSettleDates(ACCOUNTS, SNAPSHOTS);

  /* 没有任何明细 → 提示先去录入 */
  if(!pend.all.length){
    toast('还没有任何明细记录 —— 先在卡片里填数值并点「记录全部」');
    return;
  }

  /* 全结清了 → 改成查看模式 */
  if(!pend.missing.length){
    renderSettleModal(null, 'view');
    openSettleModal();
    return;
  }

  const result = settle(ACCOUNTS, SNAPSHOTS);
  saveLocal();                     /* 立刻落本地 + 推送云端 */
  syncSettleBtn();
  render();
  renderSettleModal(result, 'settle');
  openSettleModal();

  const n = result.added.length;
  toast(n ? ('已结算 ' + n + ' 天：' + result.added.map(function(a){ return a.date; }).join('、'))
          : '没有需要结算的日期');
}

document.getElementById('btnSettle').addEventListener('click', doSettle);
document.getElementById('stClose').addEventListener('click', closeSettleModal);
document.getElementById('settleMask').addEventListener('click', function(e){
  if(e.target === this) closeSettleModal();
});

/* 键盘 */
document.addEventListener('keydown', function(e){
  const t = e.target;
  if(t.classList && t.classList.contains('input')){
    if(e.key === 'Enter'){ e.preventDefault(); commitEntry(Number(t.dataset.i)); }
    return;
  }
  if(t.classList && t.classList.contains('del') && e.key === 'Enter'){ e.preventDefault(); t.click(); }
  /* 弹窗：Esc 关闭，Enter 确定 */
  if(mask.classList.contains('show')){
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); }
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); modalOk(); }
  }
});

/* ============================================================
 * 弹窗：新增 / 编辑角色（账号 / 角色名 / 职业 / 等级）
 * ============================================================ */
const mask = document.getElementById('mask');
const fAccount = document.getElementById('fAccount');
const fName    = document.getElementById('fName');
const fJob     = document.getElementById('fJob');
const fLevel   = document.getElementById('fLevel');
const fWealth  = document.getElementById('fWealth');
const fInitLeft = document.getElementById('fInitLeft');
let modalMode = 'add';   // 'add' | 'edit'
let modalIdx  = -1;

function openModal(mode, idx){
  modalMode = mode; modalIdx = (idx == null ? -1 : idx);
  const c = (mode === 'edit') ? ACCOUNTS[modalIdx] : null;
  document.getElementById('mdTitleTxt').textContent = (mode === 'edit') ? '修改角色信息' : '新增角色';
  document.getElementById('mdHint').textContent = (mode === 'edit')
    ? '修改后点「确定」保存'
    : '填写以下信息，保存后生成一张角色卡片';
  fAccount.value = c ? (c.account || '') : '';
  fName.value    = c ? (c.name    || '') : '';
  fJob.value     = c ? (c.job     || '') : '';
  fLevel.value   = c ? (c.level   || '') : '';
  /* 财富值：与等级一样，直接回填独立数值 */
  fWealth.value = c ? (Number(c.wealth) ? String(c.wealth) : '') : '';
  fWealth.placeholder = '如 12000（可留空）';
  /* 初始存量：同理，直接回填独立数值 */
  fInitLeft.value = c ? (Number(c.initLeft) ? String(c.initLeft) : '') : '';
  [fAccount, fName, fJob, fLevel, fWealth, fInitLeft].forEach(function(el){
    el.classList.remove('bad');
    el.closest('.field').classList.remove('bad');
  });
  mask.classList.add('show');
  setTimeout(function(){ fAccount.focus(); }, 80);
}
function closeModal(){
  mask.classList.remove('show');
}
function modalOk(){
  const account = fAccount.value.trim();
  const name    = fName.value.trim();
  const job     = fJob.value.trim();
  const lvRaw   = fLevel.value.trim();
  const wRaw    = fWealth.value.trim();
  const ilRaw   = fInitLeft.value.trim();

  /* 账号必填 */
  let bad = false;
  if(!account){ fAccount.classList.add('bad'); fAccount.closest('.field').classList.add('bad'); bad = true; }
  else { fAccount.classList.remove('bad'); fAccount.closest('.field').classList.remove('bad'); }
  /* 等级必须是数字（可留空） */
  if(lvRaw !== '' && !/^\d+$/.test(lvRaw)){
    fLevel.classList.add('bad'); fLevel.closest('.field').classList.add('bad'); bad = true;
  } else { fLevel.classList.remove('bad'); fLevel.closest('.field').classList.remove('bad'); }
  /* 财富值必须是数字（可留空） */
  if(wRaw !== '' && !/^-?\d+(\.\d+)?$/.test(wRaw)){
    fWealth.classList.add('bad'); fWealth.closest('.field').classList.add('bad'); bad = true;
  } else { fWealth.classList.remove('bad'); fWealth.closest('.field').classList.remove('bad'); }
  /* 初始存量必须是数字（可留空） */
  if(ilRaw !== '' && !/^-?\d+(\.\d+)?$/.test(ilRaw)){
    fInitLeft.classList.add('bad'); fInitLeft.closest('.field').classList.add('bad'); bad = true;
  } else { fInitLeft.classList.remove('bad'); fInitLeft.closest('.field').classList.remove('bad'); }
  if(bad){
    (fAccount.classList.contains('bad') ? fAccount
      : fLevel.classList.contains('bad') ? fLevel
      : fWealth.classList.contains('bad') ? fWealth : fInitLeft).focus();
    return;
  }

  const level = lvRaw === '' ? '' : Number(lvRaw);
  /* 财富值：独立数值，留空按 0 计 */
  const wealthVal = (wRaw === '') ? 0 : Number(wRaw);
  /* 初始存量：独立数值，留空按 0 计（= 首条整条算获取，老行为） */
  const initLeftVal = (ilRaw === '') ? 0 : Number(ilRaw);

  if(modalMode === 'edit'){
    const c = ACCOUNTS[modalIdx];
    c.account = account; c.name = name; c.job = job; c.level = level;
    c.wealth = wealthVal;
    c.initLeft = initLeftVal;
    /* 同步更新已展开明细的标题 */
    const tt = document.querySelector('.row[data-i="' + modalIdx + '"] .ttl2');
    if(tt) tt.textContent = (name || '未命名角色') + ' · 每日明细';
    render();
    saveLocal();
    toast('已保存修改');
  } else {
    ACCOUNTS.push({
      id:'a' + Date.now(), account:account, name:name, job:job, level:level,
      gemsLeft:0, gemsSold:0, soldValue:0, laborCost:0, chaosCost:0,
      wealth: wealthVal, initLeft: initLeftVal,
      records:[], flags:{}
    });
    render();
    saveLocal();
    toast('已新增角色「' + (name || account) + '」');
  }
  closeModal();
}

document.getElementById('mdCancel').addEventListener('click', closeModal);
document.getElementById('mdOk').addEventListener('click', modalOk);
mask.addEventListener('click', function(e){ if(e.target === mask) closeModal(); });
[fAccount, fName, fJob, fLevel, fWealth, fInitLeft].forEach(function(el){
  el.addEventListener('input', function(){
    el.classList.remove('bad'); el.closest('.field').classList.remove('bad');
  });
});

/* ============================================================
 * 卡片交互
 * ============================================================ */
document.addEventListener('click', function(e){
  /* 记录按钮：提交本卡片录入（手机端主要入口） */
  const sv = e.target.closest('[data-save]');
  if(sv){ commitEntry(Number(sv.dataset.save)); return; }
  /* 展开 / 收起 */
  const tg = e.target.closest('[data-toggle]');
  if(tg){
    const row = tg.closest('.row');
    const open = row.classList.toggle('open');
    tg.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open){
      const i = Number(tg.dataset.toggle);
      /* 展开动画结束后再按实际宽度对齐明细列 */
      setTimeout(function(){ syncDetailCols(i); }, 320);
    }
    return;
  }
  /* 修改（弹窗编辑） */
  const ed = e.target.closest('[data-edit]');
  if(ed){ openModal('edit', Number(ed.dataset.edit)); return; }

  /* 功能开关切换：背包 / 混沌 / 市集 / 宠物 */
  const ft = e.target.closest('[data-feat]');
  if(ft){
    const i = Number(ft.dataset.feat), key = ft.dataset.key;
    const c = ACCOUNTS[i];
    if(!c) return;
    c.flags = c.flags || {};
    c.flags[key] = !c.flags[key];
    ft.classList.toggle('on', c.flags[key]);
    ft.classList.toggle('off', !c.flags[key]);
    const f = FEATURES.find(function(x){ return x.key === key; });
    ft.title = '点击切换「' + (f ? f.label : key) + '」状态（当前：' + (c.flags[key] ? '已开启' : '未开启') + '）';
    saveLocal();
    return;
  }

  /* 删除单条明细 */
  const del = e.target.closest('[data-del]');
  if(del){
    const i = Number(del.dataset.del), ri = Number(del.dataset.ri);
    ACCOUNTS[i].records.splice(ri, 1);
    refreshNumbers(i);
    document.getElementById('detail-' + i).innerHTML = detailHTML(i);
    syncDetailCols(i);
    saveLocal();
    toast('已删除该条记录');
    return;
  }
  /* 清空该角色明细 */
  const cl = e.target.closest('[data-clear]');
  if(cl){
    const i = Number(cl.dataset.clear);
    const n = (ACCOUNTS[i].records || []).length;
    if(!n){ toast('本来就没有明细'); return; }
    if(!confirm('确定清空「' + (ACCOUNTS[i].name || ACCOUNTS[i].account || '未命名角色') + '」的 ' + n + ' 条明细？此操作不可撤销。')) return;
    ACCOUNTS[i].records = [];
    refreshNumbers(i);
    document.getElementById('detail-' + i).innerHTML = detailHTML(i);
    syncDetailCols(i);
    saveLocal();
    toast('已清空 ' + n + ' 条明细');
    return;
  }
  /* 删除角色卡片 */
  const rm = e.target.closest('[data-rm]');
  if(rm){
    const i = Number(rm.dataset.rm);
    if(!confirm('确定删除该角色卡片？其所有明细将一并删除。')) return;
    ACCOUNTS.splice(i, 1);
    render();
    saveLocal();
    toast('已删除该角色');
    return;
  }
});

/* ＋ 新增角色 → 打开弹窗 */
document.getElementById('btnAdd').addEventListener('click', function(){
  openModal('add');
});

/* 导出 / 导入 */
document.getElementById('btnExport').addEventListener('click', function(){
  const data = { v:2, exportedAt:new Date().toISOString(), accounts:ACCOUNTS };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gem-ledger-' + today() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('已导出备份 JSON');
});
document.getElementById('btnImport').addEventListener('click', function(){
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const data = JSON.parse(fr.result);
      if(!data || !Array.isArray(data.accounts)) throw new Error('bad');
      ACCOUNTS = data.accounts.map(function(s, i){
        return {
          id: s.id || ('a' + (i+1)),
          account: s.account || '', name: s.name || '',
          level: s.level != null ? s.level : '', job: s.job || '',
          gemsLeft: Number(s.gemsLeft)||0, gemsSold: Number(s.gemsSold)||0,
          soldValue: Number(s.soldValue)||0, laborCost: Number(s.laborCost)||0,
          chaosCost: Number(s.chaosCost)||0,
          wealth: Number(s.wealth)||0,
          initLeft: Number(s.initLeft)||0,
          records: Array.isArray(s.records) ? s.records.map(function(r){
            return { date:r.date || '', time:r.time || '00:00:00',
                     gemsLeft:Number(r.gemsLeft)||0, daySold:Number(r.daySold)||0,
                     dayValue:Number(r.dayValue)||0, dayLabor:Number(r.dayLabor)||0,
                     chaosCost:Number(r.chaosCost)||0 };
          }) : [],
          flags: (s.flags && typeof s.flags === 'object') ? s.flags : {}
        };
      });
      render(); saveLocal();
      toast('已导入 ' + ACCOUNTS.length + ' 个角色');
    }catch(err){ toast('导入失败：不是有效的备份文件'); }
    e.target.value = '';
  };
  fr.readAsText(f);
});

/* ---------- 全屏 ---------- */
const btnFull = document.getElementById('btnFull');
function fsActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function syncFullBtn(){
  const on = fsActive();
  btnFull.classList.toggle('on', on);
  btnFull.title = on ? '退出全屏' : '全屏显示';
  btnFull.setAttribute('aria-label', on ? '退出全屏' : '全屏显示');
  document.body.classList.toggle('fs', on);
}
btnFull.addEventListener('click', function(){
  const el = document.documentElement;
  if(fsActive()){
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }else{
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){
      const r = req.call(el);
      /* iOS Safari 的 iPhone 不支持元素全屏，降级为「铺满视口」的伪全屏 */
      if(r && r.catch) r.catch(function(){ document.body.classList.toggle('fs'); syncFullBtn(); });
    }else{
      document.body.classList.toggle('fs');
      syncFullBtn();
    }
  }
});
document.addEventListener('fullscreenchange', function(){
  syncFullBtn();
  /* 全屏切换会改变宽度，重新对齐明细列 */
  setTimeout(syncAllDetailCols, 260);
});
document.addEventListener('webkitfullscreenchange', function(){
  syncFullBtn(); setTimeout(syncAllDetailCols, 260);
});

/* ---------- 启动 ---------- */
const lastSavedAt = loadLocal();
const _bootAuto = autoSettle();      /* 打开页面就自动补齐缺失快照、刷新今天 */
if(_bootAuto.added.length || _bootAuto.refreshed.length) saveLocal();
render();
if(_bootAuto.added.length){
  toast('已自动结算 ' + _bootAuto.added.length + ' 天');
}
restoreChanged(lastSavedAt);   /* 恢复「最后更改」为上次改动时间 */
cloudInit();                   /* 异步连云端：比时间戳决定用本机还是云端 */
window.addEventListener('resize', function(){ syncAllDetailCols(); });
syncFullBtn();                 /* 初始化全屏按钮状态 */
</script>
