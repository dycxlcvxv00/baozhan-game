name: assemble-fragments
on:
  push:
    paths:
      - '_parts/sim.done'
      - '_parts/main.done'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 合并分片
        run: |
          mkdir -p js
          if [ -f _parts/sim.js.1 ]; then cat _parts/sim.js.1 _parts/sim.js.2 _parts/sim.js.3 > js/sim.js; wc -c js/sim.js; fi
          if [ -f _parts/main.js.1 ]; then cat _parts/main.js.1 _parts/main.js.2 > js/main.js; wc -c js/main.js; fi
      - name: 提交并清理
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached _parts || true
          rm -rf _parts
          git add js/
          git commit -m "chore: 分片合并入库 [skip ci]" || echo "无变化"
          git push
