name: Publish web build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose v0.33 scripts (safe, restores index.html)
        run: |
          cp index.html index_backup.html
          {
            echo "=== css ==="; python3 tools/v033_css.py; echo "css_exit=$?"
            echo "=== html ==="; python3 tools/v033_html.py; echo "html_exit=$?"
            echo "=== js ==="; python3 tools/v033_js.py; echo "js_exit=$?"
            echo "=== ver ==="; python3 tools/v033_ver.py; echo "ver_exit=$?"
          } > publish_log.txt 2>&1 || true
          cp index_backup.html index.html
          rm -f index_backup.html
      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish_log.txt
          git commit -m "v0.33 publish diagnostic log" || echo "nothing to commit"
          git push
