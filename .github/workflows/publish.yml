name: Publish web build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.33 setup UI rework
        run: python3 tools/v033_css.py && python3 tools/v033_html.py && python3 tools/v033_js.py && python3 tools/v033_ver.py
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Publish v0.33: rework setup UI (4-tab nav, stage list, rune info, hero equip showcase)"
            git push
          fi
