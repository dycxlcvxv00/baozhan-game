<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#07050b"/>
<title>爆战丨无限弹幕 · 新引擎移植版</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#050308;overflow:hidden;font-family:"Segoe UI","Noto Sans SC",sans-serif;touch-action:none;user-select:none}#gameWrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 520px at 48% 35%,#20112d 0%,#0b0712 60%,#030205 100%)}canvas{display:block;box-shadow:0 0 80px rgba(139,92,246,.28)}#tip{position:fixed;left:0;right:0;bottom:7px;text-align:center;color:#7d6d93;font-size:11px;letter-spacing:2px;pointer-events:none;z-index:4}
</style>
</head>
<body><div id="gameWrap"></div><div id="tip">爆战丨无限弹幕 · 新引擎完整移植体验版 · 空格暂停 / R 重开</div>
<script>
const W=1280,H=720,LANE=6;
const S={scene:null,state:'menu',level:1,unlocked:1,gold:0,kills:0,win:0,speed:1,tab:'rune',selectedLevel:1,wave:0,waveMax:3,wall:{hp:1200,max:1200},hero:{x:184,y:H/2,atk:58,aspd:.72,lv:1},runes:{fire:{n:'炎爆',icon:'🔥',cost:42,c:0},ice:{n:'冰锥',icon:'❄️',cost:54,c:0},bolt:{n:'雷链',icon:'⚡',cost:66,c:0},poison:{n:'毒箭',icon:'☠️',cost:50,c:0},shield:{n:'圣盾',icon:'🛡️',cost:80,c:0}},equips:[],wear:{weapon:null,offhand:null,helm:null,armor:null,glove:null,belt:null,boot:null,neck:null,ring:null,bracelet:null},monsters:null,shots:null,fx:null,ui:null,atkT:0,spawnT:0,queue:[],paused:false};
const slots=['weapon','offhand','helm','armor','glove','belt','boot','neck','ring','bracelet'];
const slotName={weapon:'武器',offhand:'副手',helm:'头盔',armor:'护甲',glove:'手套',belt:'腰带',boot:'鞋子',neck:'项链',ring:'戒指',bracelet:'手镯'};
function save(){localStorage.setItem('baozhan_phaser_port_v1',JSON.stringify({level:S.level,unlocked:S.unlocked,gold:S.gold,win:S.win,equips:S.equips,wear:S.wear,selectedLevel:S.selectedLevel}))}
function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('baozhan_phaser_port_v1')||'{}'))}catch(e){} if(!S.equips.length)for(let i=0;i<12;i++)S.equips.push(dropEq(1+i%4));}
function tex(sc,k,w,h,fn){const g=sc.make.graphics({x:0,y:0,add:false});fn(g,w,h);g.generateTexture(k,w,h);g.destroy()}
function glow(g,x,y,r,c,a=.8){for(let i=3;i>0;i--){g.fillStyle(c,a/i*.35);g.fillCircle(x,y,r*i)}g.fillStyle(c,a);g.fillCircle(x,y,r)}
function buildTex(sc){tex(sc,'hero',78,86,g=>{glow(g,39,46,22,0x7c3aed);g.fillStyle(0x1b1028).fillTriangle(39,4,12,52,66,52);g.fillStyle(0x090511).fillCircle(39,45,16);glow(g,31,43,4,0xd8b4fe,1);glow(g,47,43,4,0xd8b4fe,1);g.lineStyle(3,0xfacc15,.8).strokeCircle(39,46,30)});tex(sc,'skel',48,48,g=>{glow(g,24,22,13,0xd7d0c4);g.fillStyle(0x07040c).fillCircle(18,20,4);g.fillCircle(30,20,4);g.fillStyle(0xd7d0c4).fillRect(15,31,18,5)});tex(sc,'demon',58,58,g=>{glow(g,29,31,17,0xdc2626);g.fillStyle(0x2b0b13).fillTriangle(14,17,7,3,23,14);g.fillTriangle(44,17,51,3,35,14);glow(g,22,30,4,0xfacc15,1);glow(g,36,30,4,0xfacc15,1)});tex(sc,'boss',104,104,g=>{glow(g,52,56,35,0x9333ea);g.fillStyle(0x21051c).fillCircle(52,54,30);g.lineStyle(4,0xfacc15,.8).strokeCircle(52,54,42);glow(g,41,51,6,0xff3333,1);glow(g,63,51,6,0xff3333,1)});['arrow','fire','ice','bolt','poison','shield'].forEach((k,i)=>tex(sc,k,34,34,g=>{const cs=[0xfacc15,0xf97316,0x7dd3fc,0xfef08a,0x86efac,0xa78bfa];glow(g,17,17,10,cs[i],1);if(k==='ice'){g.fillStyle(0xe0f2fe).fillTriangle(30,17,6,8,6,26)}else g.fillStyle(0xffffff,.7).fillCircle(17,17,4)}));tex(sc,'stone',48,48,g=>{g.fillStyle(0x21182a).fillRect(0,0,48,48);g.lineStyle(2,0x0a0610).strokeRect(1,1,46,46);g.fillStyle(0x3b2c4b,.65).fillRect(4,5,18,10);g.fillRect(24,25,18,10)});tex(sc,'slot',54,54,g=>{g.fillStyle(0x12091d,.9).fillRoundedRect(2,2,50,50,8);g.lineStyle(2,0x7250a8,.9).strokeRoundedRect(2,2,50,50,8)})}
function create(){S.scene=this;load();buildTex(this);this.add.graphics().fillGradientStyle(0x170b22,0x170b22,0x050308,0x050308,1).fillRect(0,0,W,H);this.add.particles(0,0,'fire',{x:{min:0,max:W},y:H+20,speedY:{min:-20,max:-70},speedX:{min:-12,max:12},scale:{min:.25,max:.85},alpha:{start:.45,end:0},lifespan:3600,frequency:150,blendMode:'ADD',quantity:2});for(let y=0;y<H;y+=48)for(let x=0;x<72;x+=48)this.add.image(x+24,y+24,'stone').setTint(0x8a7aa0);S.monsters=this.add.group();S.shots=this.add.group();S.fx=this.add.group();this.input.keyboard.on('keydown-SPACE',()=>{if(S.state==='battle'){S.paused=!S.paused;this.scene.pause(S.paused)}});this.input.keyboard.on('keydown-R',()=>restart());showMenu()}
function panel(x,y,w,h){let g=S.scene.add.graphics();g.fillStyle(0x100817,.94).fillRoundedRect(x,y,w,h,18);g.lineStyle(2,0x6d45a8,.85).strokeRoundedRect(x,y,w,h,18);g.lineStyle(1,0xfacc15,.35).strokeRoundedRect(x+6,y+6,w-12,h-12,14);return g}
function btn(x,y,t,cb,w=190){let b=S.scene.add.text(x,y,t,{fontSize:'20px',color:'#13091c',backgroundColor:'#c4a3ff',padding:{x:18,y:10},fontStyle:'bold'}).setOrigin(.5).setInteractive({useHandCursor:true});b.on('pointerover',()=>b.setStyle({backgroundColor:'#eadcff'}));b.on('pointerout',()=>b.setStyle({backgroundColor:'#c4a3ff'}));b.on('pointerdown',cb);return b}
function clearUI(){if(S.ui)S.ui.forEach(o=>o.destroy());S.ui=[]}
function showMenu(){clearUI();S.state='menu';S.ui=[panel(80,54,1120,612)];S.ui.push(S.scene.add.text(120,82,'爆战丨无限弹幕',{fontSize:'38px',color:'#f3e8ff',fontStyle:'bold'}));S.ui.push(S.scene.add.text(122,128,'新引擎完整移植体验版：保留装配、关卡、掉落、符文弹幕与领主战核心循环',{fontSize:'16px',color:'#9f8ab8'}));['符文','装备','专精','设置'].forEach((t,i)=>{let key=['rune','equip','master','setting'][i];S.ui.push(btn(220+i*150,176,(S.tab===key?'◆ ':'')+t,()=>{S.tab=key;showMenu()},120))});if(S.tab==='rune')drawRune();if(S.tab==='equip')drawEquip();if(S.tab==='master')drawMaster();if(S.tab==='setting')drawSetting();drawLevels();S.ui.push(btn(1032,603,'进入战斗',()=>startBattle(),210));S.ui.push(S.scene.add.text(120,610,`金币 ${S.gold}　最高解锁 ${S.unlocked} 关　胜场 ${S.win}`,{fontSize:'18px',color:'#facc15'}))}
function drawRune(){S.ui.push(S.scene.add.text(128,226,'已装配符文：5 / 16 槽（移植版默认装满五系，自动充能释放）',{fontSize:'18px',color:'#e9d5ff'}));Object.entries(S.runes).forEach(([k,r],i)=>{let x=150+i*116,y=294;S.ui.push(S.scene.add.image(x,y,'slot'));S.ui.push(S.scene.add.text(x,y-15,r.icon,{fontSize:'26px'}).setOrigin(.5));S.ui.push(S.scene.add.text(x,y+27,r.n,{fontSize:'14px',color:'#d8b4fe'}).setOrigin(.5));});S.ui.push(S.scene.add.text(130,388,'规则：英雄普攻随机充能；火球范围爆炸、冰锥穿透减速、雷链跳跃、毒箭持续腐蚀、圣盾震退近墙敌人。',{fontSize:'16px',color:'#a998bb',wordWrap:{width:650}}))}
function eqPower(){return slots.reduce((a,s)=>a+(S.wear[s]?.atk||0),0)}
function drawEquip(){S.ui.push(S.scene.add.text(130,222,`英雄属性：攻击 ${S.hero.atk+eqPower()}　攻速 ${S.hero.aspd.toFixed(2)}/秒　城墙 ${S.wall.max}`,{fontSize:'18px',color:'#e9d5ff'}));slots.forEach((s,i)=>{let x=142+(i%5)*82,y=294+Math.floor(i/5)*92,e=S.wear[s];S.ui.push(S.scene.add.image(x,y,'slot').setInteractive().on('pointerdown',()=>{if(e){S.equips.push(e);S.wear[s]=null;save();showMenu()}}));S.ui.push(S.scene.add.text(x,y-30,slotName[s],{fontSize:'12px',color:'#9ca3af'}).setOrigin(.5));S.ui.push(S.scene.add.text(x,y,e?e.icon:'＋',{fontSize:'24px',color:'#fff'}).setOrigin(.5));});S.equips.slice(0,18).forEach((e,i)=>{let x=610+(i%6)*70,y=255+Math.floor(i/6)*70;S.ui.push(S.scene.add.image(x,y,'slot').setInteractive().on('pointerdown',()=>{let old=S.wear[e.slot];if(old)S.equips.push(old);S.wear[e.slot]=e;S.equips=S.equips.filter(q=>q.id!==e.id);save();showMenu()}));S.ui.push(S.scene.add.text(x,y-6,e.icon,{fontSize:'22px'}).setOrigin(.5));S.ui.push(S.scene.add.text(x,y+19,'+'+e.atk,{fontSize:'12px',color:'#86efac'}).setOrigin(.5));});S.ui.push(S.scene.add.text(596,222,'仓库：点击装备穿戴；点击已穿戴格卸下',{fontSize:'16px',color:'#a998bb'}))}
function drawMaster(){Object.entries(S.runes).forEach(([k,r],i)=>S.ui.push(S.scene.add.text(140,235+i*48,`${r.icon} ${r.n} 专精 Lv.${Math.floor(S.win/2)+1}　伤害 +${Math.floor(S.win*3)}%`,{fontSize:'18px',color:'#ddd6fe'})));}
function drawSetting(){S.ui.push(S.scene.add.text(140,240,'版本：Demo v0.34 · Phaser 新引擎完整移植体验版',{fontSize:'18px',color:'#e9d5ff'}));S.ui.push(btn(245,320,'重置存档',()=>{localStorage.removeItem('baozhan_phaser_port_v1');location.reload()},160));S.ui.push(btn(445,320,S.speed===1?'速度 1×':'速度 2×',()=>{S.speed=S.speed===1?2:1;showMenu()},160));}
function drawLevels(){S.ui.push(S.scene.add.text(900,222,'关卡列表',{fontSize:'20px',color:'#e9d5ff'}));for(let i=1;i<=10;i++){let ok=i<=S.unlocked,cur=i===S.selectedLevel;let t=S.scene.add.text(900,250+i*30,`${cur?'▶':' '} 第 ${i} 关 ${i%5===0?'领主':'恶潮'} ${ok?'':'🔒'}`,{fontSize:'15px',color:ok?(cur?'#facc15':'#c4b5fd'):'#555'}).setInteractive();if(ok)t.on('pointerdown',()=>{S.selectedLevel=i;S.level=i;save();showMenu()});S.ui.push(t)}}
function dropEq(lv){let s=slots[Math.floor(Math.random()*slots.length)],q=['⚪','🟢','🔵','🟣','🟠'][Math.min(4,Math.floor(Math.random()*5))];return{id:Date.now()+Math.random(),slot:s,icon:q,atk:Math.round(8+lv*7+Math.random()*18)}}
function startBattle(){clearUI();S.state='battle';S.wave=0;S.wall.hp=S.wall.max;S.kills=0;S.spawnT=0;S.atkT=0;Object.values(S.runes).forEach(r=>r.c=0);S.heroImg=S.scene.add.image(S.hero.x,S.hero.y,'hero');S.hud=[];S.hud.push(S.scene.add.text(18,14,'',{fontSize:'16px',color:'#e9d5ff'}));S.hud.push(S.scene.add.text(W-20,14,'',{fontSize:'16px',color:'#facc15'}).setOrigin(1,0));nextWave()}
function restart(){S.scene.scene.restart()}
function nextWave(){S.wave++;S.spawnT=0;let n=7+S.level*2+S.wave*2;S.queue=[];for(let i=0;i<n;i++)S.queue.push({at:i*Math.max(.45,1.05-S.level*.035),type:i%4===2?'demon':'skel'});if(S.wave===S.waveMax)S.queue.push({at:n*.55+2,type:'boss'});}
function spawn(type){let lane=Math.floor(Math.random()*LANE),y=95+lane*((H-170)/(LANE-1)),m=S.scene.add.image(W+60,y,type).setScale(type==='boss'?1.45:1);let mul=1+S.level*.22+S.wave*.16;m.hp=m.max=type==='boss'?Math.round(820*mul):type==='demon'?Math.round(160*mul):Math.round(82*mul);m.speed=(type==='boss'?20:type==='demon'?34:55)*(1+S.level*.025);m.atk=type==='boss'?70:type==='demon'?28:14;m.r=type==='boss'?45:21;m.atkT=0;m.slow=0;m.dot=0;m.bar=S.scene.add.graphics();S.monsters.add(m);if(type==='boss'){S.scene.cameras.main.shake(450,.012);boom(m.x,m.y,'fire',34,260)}}
function target(){let best=null,x=-1;S.monsters.getChildren().forEach(m=>{if(m.active&&m.hp>0&&W-m.x>x){x=W-m.x;best=m}});return best}
function shoot(tex,x,y,vx,vy,dmg,kind,p=1){let b=S.scene.add.image(x,y,tex);Object.assign(b,{vx,vy,dmg,kind,p,hit:new Set()});b.rotation=Math.atan2(vy,vx);S.shots.add(b)}
function heroAttack(){let t=target();if(!t)return;let d=Math.hypot(t.x-S.hero.x,t.y-S.hero.y)||1,atk=S.hero.atk+eqPower();shoot('arrow',S.hero.x+30,S.hero.y,(t.x-S.hero.x)/d*760,(t.y-S.hero.y)/d*760,atk,'arrow')}
function cast(k){let t=target(),atk=S.hero.atk+eqPower();if(!t&&k!=='shield')return;if(k==='fire'){let d=Math.hypot(t.x-S.hero.x,t.y-S.hero.y)||1;shoot('fire',S.hero.x,S.hero.y,(t.x-S.hero.x)/d*430,(t.y-S.hero.y)/d*430,atk*2.1,'fire')}if(k==='ice')shoot('ice',S.hero.x,S.hero.y,880,0,atk*1.35,'ice',4);if(k==='poison'){let d=Math.hypot(t.x-S.hero.x,t.y-S.hero.y)||1;shoot('poison',S.hero.x,S.hero.y,(t.x-S.hero.x)/d*620,(t.y-S.hero.y)/d*620,atk*.8,'poison',2)}if(k==='bolt'){let cur=t,seen=new Set();for(let i=0;i<5&&cur;i++){hit(cur,atk*1.45*(1-i*.12),'bolt');seen.add(cur);boom(cur.x,cur.y,'bolt',10,160);let nx=null,bd=999;S.monsters.getChildren().forEach(m=>{let d=Math.hypot(m.x-cur.x,m.y-cur.y);if(m.hp>0&&!seen.has(m)&&d<bd&&d<250){bd=d;nx=m}});cur=nx}S.scene.cameras.main.flash(70,255,245,170)}if(k==='shield'){S.monsters.getChildren().forEach(m=>{if(m.x<210){m.x+=90;hit(m,atk*1.1,'shield')}});S.wall.hp=Math.min(S.wall.max,S.wall.hp+90);boom(90,H/2,'shield',22,220)}}
function hit(m,dmg,kind){m.hp-=dmg;m.setTint(0xffffff);S.scene.time.delayedCall(80,()=>m.active&&m.clearTint());if(kind==='ice')m.slow=3;if(kind==='poison')m.dot=4;if(m.hp<=0)kill(m)}
function kill(m){S.kills++;S.gold+=m.texture.key==='boss'?220:m.texture.key==='demon'?16:8;boom(m.x,m.y,m.texture.key==='boss'?'fire':'skel',m.texture.key==='boss'?30:10,m.texture.key==='boss'?260:140);if(m.bar)m.bar.destroy();m.destroy()}
function boom(x,y,tex,n=12,sp=180){S.scene.add.particles(x,y,tex,{speed:{min:-sp,max:sp},lifespan:{min:260,max:720},scale:{start:1,end:0},blendMode:'ADD',quantity:n,emitting:false}).explode(n,x,y)}
function end(win){S.state=win?'win':'lose';if(win){S.win++;S.unlocked=Math.max(S.unlocked,S.level+1);S.equips.push(dropEq(S.level));S.equips.push(dropEq(S.level));save()}panel(420,210,440,250);S.scene.add.text(640,270,win?'胜 利':'石墙告破',{fontSize:'42px',color:win?'#facc15':'#ff6464',fontStyle:'bold'}).setOrigin(.5);S.scene.add.text(640,330,win?'获得金币与随机装备，已解锁下一关':'调整装配后再战',{fontSize:'18px',color:'#c4b5fd'}).setOrigin(.5);btn(640,410,'返回装配',()=>restart())}
function update(time,delta){if(S.state!=='battle')return;let dt=Math.min(.05,delta/1000)*S.speed;let g=S.scene.add.graphics();g.fillStyle(0x000000,.58).fillRect(8,H-27,240,15);g.fillStyle(0xef4444).fillRect(8,H-27,240*Math.max(0,S.wall.hp/S.wall.max),15);S.scene.time.delayedCall(16,()=>g.destroy());S.hud[0].setText(`第 ${S.level} 关 · 波次 ${S.wave}/${S.waveMax} · 击杀 ${S.kills}`);S.hud[1].setText(`金币 ${S.gold} · 攻击 ${S.hero.atk+eqPower()}`);S.spawnT+=dt;S.queue.forEach(q=>{if(!q.done&&S.spawnT>=q.at){q.done=true;spawn(q.type)}});S.atkT-=dt;if(S.atkT<=0){S.atkT=1/S.hero.aspd;heroAttack()}Object.entries(S.runes).forEach(([k,r])=>{r.c+=dt*(8+S.level*.25);if(r.c>=r.cost){r.c=0;cast(k)}});S.monsters.getChildren().forEach(m=>{if(!m.active)return;m.slow=Math.max(0,m.slow-dt);if(m.dot>0){m.dot-=dt;hit(m,12*dt,'dot')}if(m.x-m.r>72)m.x-=m.speed*(m.slow>0?.52:1)*dt;else{m.atkT-=dt;if(m.atkT<=0){m.atkT=1.25;S.wall.hp-=m.atk;S.scene.cameras.main.shake(80,.004);if(S.wall.hp<=0)end(false)}}m.bar.clear();m.bar.fillStyle(0x000000,.7).fillRect(m.x-m.r,m.y-m.r-13,m.r*2,5);m.bar.fillStyle(0x22c55e).fillRect(m.x-m.r,m.y-m.r-13,m.r*2*Math.max(0,m.hp/m.max),5)});S.shots.getChildren().forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;let dead=b.x>W+70||b.x<-70||b.y<-70||b.y>H+70;S.monsters.getChildren().forEach(m=>{if(!dead&&m.hp>0&&!b.hit.has(m)&&Math.hypot(m.x-b.x,m.y-b.y)<m.r+10){b.hit.add(m);if(b.kind==='fire'){boom(b.x,b.y,'fire',20,250);S.monsters.getChildren().forEach(mm=>{if(mm.hp>0&&Math.hypot(mm.x-b.x,mm.y-b.y)<92)hit(mm,b.dmg,'fire')});dead=true}else{hit(m,b.dmg,b.kind);b.p--;if(b.p<=0)dead=true}}});if(dead)b.destroy()});if(S.queue.every(q=>q.done)&&S.monsters.getChildren().length===0){if(S.wave>=S.waveMax)end(true);else nextWave()}}
new Phaser.Game({type:Phaser.AUTO,parent:'gameWrap',width:W,height:H,backgroundColor:'#07050b',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true},scene:{create,update}});
</script></body></html>
