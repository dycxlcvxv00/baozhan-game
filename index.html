<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>爆战丨无限弹幕 v1.0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#0b1020; overflow:hidden; font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
  #game { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #game canvas { display:block; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(7,11,24,.93); z-index:10; padding:16px; }
  h1 { color:#e5e7eb; font-size:28px; margin-bottom:6px; }
  .sub { color:#64748b; font-size:14px; margin-bottom:18px; text-align:center; }
  #runeGrid { display:grid; grid-template-columns:repeat(5,150px); gap:12px; margin-bottom:18px; }
  .rune-card { display:flex; flex-direction:column; align-items:center; gap:5px; min-height:148px; padding:12px 10px;
    background:#111a30; border:2px solid #263451; border-radius:12px; cursor:pointer; color:#cbd5e1; text-align:center; }
  .rune-card .ri { font-size:30px; }
  .rune-card .rn { font-size:16px; font-weight:bold; color:#e5e7eb; }
  .rune-card .re { font-size:13px; color:#fbbf24; }
  .rune-card .rd { font-size:12px; color:#64748b; line-height:1.4; }
  .rune-card.on { border-color:#3b82f6; background:#16264a; box-shadow:0 0 12px rgba(59,130,246,.35); }
  .btn { min-width:170px; min-height:48px; font-size:18px; border-radius:10px; border:none; cursor:pointer; padding:0 22px; }
  #btnStart,#btnAgain { background:#3b82f6; color:#fff; }
  #btnLoadout { background:#1f2937; color:#e5e7eb; border:1px solid #475569; margin-left:12px; }
  #result { display:none; }
  #resultTitle { font-size:44px; }
  #rotateHint { display:none; position:fixed; inset:0; z-index:99; background:#0b1020; color:#fbbf24;
    font-size:22px; text-align:center; padding-top:42vh; }
  @media (orientation: portrait) { #rotateHint { display:block; } }
  @media (max-width: 860px) {
    #runeGrid { grid-template-columns:repeat(2,minmax(140px,1fr)); width:100%; max-width:400px; gap:10px; }
    .rune-card { min-height:120px; }
    h1 { font-size:22px; }
  }
</style>
</head>
<body>
<div id="game"></div>
<div id="loadout" class="overlay">
  <h1>爆战丨无限弹幕</h1>
  <div class="sub">v1.0 · Phaser 3 引擎重构版 · 符文装配（0～5 个，每种最多一次）</div>
  <div id="runeGrid"></div>
  <div id="selCount" class="sub"></div>
  <button id="btnStart" class="btn">进入战斗</button>
</div>
<div id="result" class="overlay">
  <h1 id="resultTitle"></h1>
  <div id="resultStats" class="sub"></div>
  <div>
    <button id="btnAgain" class="btn">再来一局</button>
    <button id="btnLoadout" class="btn">重新装配</button>
  </div>
</div>
<div id="rotateHint">📱 请横屏游玩</div>
<script src="lib/phaser.min.js?v=1.0"></script>
<script src="js/sim.js?v=1.0"></script>
<script src="js/main.js?v=1.0"></script>
</body>
</html>
