<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>爆战丨无限弹幕 · 横版数值验证沙盒（V4）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%232fe6d0'/></svg>" />
<style>
  :root{
    --bg0:#060912; --bg1:#0b1322; --bg2:#0e1830;
    --panel:rgba(16,24,44,0.55); --panel2:rgba(11,17,32,0.66);
    --glass:rgba(255,255,255,0.04);
    --line:rgba(125,165,225,0.16);
    --txt:#eaf0ff; --dim:#93a4c4; --mute:#6c7da0;
    --accent:#2fe6d0;   /* 青绿霓虹（主操作/高亮） */
    --accent2:#9b7bff;  /* 紫霓虹（次操作） */
    --gold:#ffcf6b;     /* 暗金（数值/货币/奖励） */
    --btn:#161f38; --btnOn:#15788c;
    --equipOn:rgba(120,150,220,0.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;
    -webkit-user-select:none;user-select:none;-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;
    background:
      radial-gradient(1100px 620px at 50% -12%, #16243f 0%, rgba(22,36,63,0) 60%),
      radial-gradient(900px 600px at 12% 110%, rgba(34,28,72,0.55) 0%, rgba(34,28,72,0) 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
    color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}

  /* 玻璃拟态通用面板 + 霓虹描边 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    backdrop-filter:blur(11px) saturate(120%);-webkit-backdrop-filter:blur(11px) saturate(120%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 0 36px rgba(40,70,120,0.10),
      0 10px 34px rgba(0,0,0,0.42),
      0 0 0 1px rgba(47,230,208,0.06);
    position:relative}
  .ttl{font-weight:700;font-size:22px;color:var(--txt);letter-spacing:.5px}
  .ttl b{color:var(--accent)}
  .sub{font-size:15px;color:var(--dim)}

  /* 顶部栏 */
  #topbar{position:absolute;left:8px;top:8px;width:1904px;height:60px;display:flex;align-items:center;gap:28px;padding:0 26px}
  #topbar .brand{font-weight:800;font-size:22px;letter-spacing:1px;
    background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  #topbar .stat{font-size:18px;color:var(--dim)}
  #topbar .stat b{color:var(--gold);font-weight:700}
  #topbar .right{margin-left:auto;color:var(--dim);font-size:16px;display:flex;gap:14px;align-items:center}
  #topbar .chip{height:30px;padding:0 14px;border-radius:16px;display:flex;align-items:center;
    background:var(--glass);border:1px solid var(--line);color:var(--dim);font-size:14px}
  #topbar .chip.on{color:var(--accent);border-color:rgba(47,230,208,0.5);box-shadow:0 0 12px rgba(47,230,208,0.25)}

  /* 战斗区 */
  #battleWrap{position:absolute;left:635px;top:90px;width:650px;height:300px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(47,230,208,0.38);
    background:linear-gradient(180deg,#0a1120 0%,#0c1626 100%);
    box-shadow:
      0 0 0 1px rgba(47,230,208,0.10),
      0 0 30px rgba(47,230,208,0.12),
      inset 0 0 54px rgba(8,26,52,0.7),
      0 10px 40px rgba(0,0,0,0.5)}
  #battleWrap canvas{display:block}

  /* 左侧 UI 接口：功能按钮区（仅保留 4 个功能按钮） */
  #leftPanel{position:absolute;left:4px;top:90px;width:619px;height:300px;padding:18px 20px}
  #leftPanel .body{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:14px;height:218px}
  #leftPanel .btns{width:306px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;justify-content:center}
  .fbtn{width:64px;height:64px;border-radius:16px;background:var(--btn);
    border:1px solid var(--line);color:var(--dim);font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;user-select:none}
  .fbtn:hover{border-color:var(--accent);color:var(--txt);box-shadow:0 0 14px rgba(47,230,208,0.22)}
  .fbtn.on{background:linear-gradient(180deg,#1f9fb2,#136479);border-color:var(--accent);color:#eafffb;
    box-shadow:0 0 16px rgba(47,230,208,0.55),inset 0 1px 0 rgba(255,255,255,0.25)}

  /* 右侧 UI 接口：英雄 10 件装备 */
  #rightPanel{position:absolute;left:1293px;top:90px;width:619px;height:300px;padding:18px 20px}
  /* 装备栏顶部切换按钮（预留：装备 / 背包 / 图鉴 / 属性） */
  #equipTabs{position:absolute;left:20px;top:16px;width:579px;height:34px;display:flex;gap:8px}
  .etab{flex:1;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:6px;background:var(--panel2);
    color:var(--mute);font-size:14px;font-weight:600;cursor:pointer;user-select:none;
    transition:color .12s,border-color .12s,box-shadow .12s}
  .etab:hover{color:var(--txt);border-color:var(--accent)}
  .etab.on{color:var(--txt);border-color:var(--accent2);background:var(--equipOn);
    box-shadow:0 0 10px rgba(155,123,255,.25)}
  /* 装备栏：竖版纸娃娃布局（按截图 963x252 精确像素坐标绝对定位，共 10 格）
     整体下移使底部留白 = 顶部标签留白(16px)：grid 视觉高度 236*0.854≈201.5，
     top = 298(面板内高) - 16(底部留白) - 201.5 ≈ 80.5px，上下对称 */
  #equipGrid{position:absolute;left:20px;top:76.2px;width:678px;height:236px;
    transform:scale(0.854);transform-origin:top left}
  .eslot{position:absolute;box-sizing:border-box;border:2px solid;border-radius:3px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-weight:700;letter-spacing:1px;color:#fff;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,rgba(34,32,48,.82) 0%,rgba(16,15,26,.9) 100%);
    text-shadow:0 1px 3px rgba(0,0,0,.9);transition:filter .12s,box-shadow .12s}
  .eslot .nm{opacity:.92}
  /* 已穿戴：仅保留深色内阴影增强质感，取消白色光晕 */
  .eslot.on{box-shadow:inset 0 -16px 26px rgba(0,0,0,.32)}
  /* 未穿戴：灰度 + 降透明度（纯文字区分，无图标） */
  .eslot:not(.on){filter:grayscale(.6) brightness(.72);opacity:.8}
  .eslot:hover{filter:none;opacity:1;box-shadow:0 0 12px rgba(255,220,150,.5)}

  /* 底部面板：可切换视图容器（顶/左/右内缩 4px，底部内缩 8px，属性栏对齐面板） */
  #bottom{position:absolute;left:4px;top:412px;width:1912px;height:660px;padding:0}
  #bottom .bview{position:absolute;inset:4px 4px 8px 4px}
  #bottom .bview[hidden]{display:none}
  #bottom .cols{display:flex;gap:2px;height:100%}
  #bottom .col.l{width:619px;flex:none;padding:0;overflow:hidden;position:relative}
  #bottom .col.r{flex:1;padding:14px 22px;display:flex;flex-direction:column;border-left:1px solid var(--line)}
  #bottom .col.r .ttl{margin-bottom:10px}
  /* 功能视图占位（装备/宠物/铭文 等未接入面板的原型提示） */
  .phView{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);font-size:17px;text-align:center;line-height:1.7}
  .phView b{color:var(--accent);font-size:24px;letter-spacing:.5px}
  /* 技能视图：左 技能区域（列表 + 插槽）/ 右 专精树 —— 复用 #bottom .cols/.col.l/.col.r 分栏 */
  #skillAreaCol{display:flex}                 /* 技能区域：左列表 + 右 120 插槽 */
  /* 左侧技能列表：图标 + 名字，正方形格 */
  #skillList{flex:1;min-width:0;padding:14px;overflow:auto;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;align-content:start}
  .skillItem{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel2);cursor:pointer;user-select:none;transition:.15s}
  .skillItem:hover{border-color:var(--accent);box-shadow:0 0 14px rgba(47,230,208,.18)}
  .skillItem.sel{border-color:var(--accent2);box-shadow:0 0 16px rgba(155,123,255,.35)}
  .skillItem .ic{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12)}
  .skillItem .nm{font-size:13px;font-weight:700;color:var(--txt);text-align:center;line-height:1.2}
  /* 右侧上阵插槽区：宽 120 */
  #skillSlots{width:120px;flex:none;padding:14px 10px;display:flex;flex-direction:column;gap:12px;
    overflow:auto;border-left:1px solid var(--line)}
  .slot{position:relative;height:96px;border:1px dashed var(--line);border-radius:12px;background:rgba(0,0,0,.22);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:.15s;overflow:hidden}
  .slot.over{border-color:var(--accent);background:rgba(47,230,208,.08);box-shadow:inset 0 0 18px rgba(47,230,208,.15)}
  .slot.filled{border-style:solid}
  .slot.sel{border-color:var(--accent2);box-shadow:0 0 16px rgba(155,123,255,.35)}
  .slot .ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14)}
  .slot .nm{font-size:11px;color:var(--dim);text-align:center;line-height:1.1}
  .slot .badge{position:absolute;top:3px;left:5px;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:1px}
  .slot .rm{position:absolute;top:2px;right:4px;font-size:12px;color:var(--mute);display:none}
  .slot.filled:hover .rm{display:block}
  .slot .ph{font-size:12px;color:var(--mute)}
  /* 右栏专精树容器 */
  #skillTreeHost{position:relative;flex:1;min-height:0;overflow:hidden}
  #skillTreeHost iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;background:transparent}
  .treePlaceholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;color:var(--dim);font-size:16px;text-align:center;line-height:1.7}
  .treePlaceholder b{color:var(--accent);font-size:22px}

  /* === 角色面板（严格按截图 492×798，外层 transform:scale 适配 619 内宽） === */
  #charPanel{position:relative;width:100%;height:100%;overflow:hidden}
  #charScale{
    position:relative;display:flex;flex-direction:column;gap:4px;
    width:100%;height:100%;box-sizing:border-box;padding:0 12px 0}
  /* （已移除顶部紫色玩家信息栏 .charHead，玩家信息合并进左侧主属性区展示） */

  /* （需求3：3 大主属性改为「图标衬底 + 文本镶嵌」，顶端内缩） */
  .coreAttrs{
    position:relative;width:100%;flex:none;margin-top:0;
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .coreAttrs .ca{
    position:relative;overflow:hidden;min-height:80px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 4px;border-radius:14px;color:#fff;cursor:default;
    background:linear-gradient(160deg,rgba(255,255,255,0.12),rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.10)}
  .coreAttrs .ca .ic{
    position:absolute;right:4px;bottom:0;font-size:40px;line-height:1;opacity:.20;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.25));pointer-events:none}
  .coreAttrs .ca .lbl{position:relative;font-size:13px;color:#e7ddff;font-weight:600;margin-bottom:2px}
  .coreAttrs .ca .val{position:relative;font-size:25px;font-weight:800;letter-spacing:.5px}
  .coreAttrs .ca.hp{background:linear-gradient(160deg,rgba(255,120,140,0.20),rgba(255,120,140,0.04));border-color:rgba(255,154,170,0.45)}
  .coreAttrs .ca.hp .val{color:#ffd0d8}
  .coreAttrs .ca.atk{background:linear-gradient(160deg,rgba(255,200,80,0.20),rgba(255,200,80,0.04));border-color:rgba(255,200,80,0.45)}
  .coreAttrs .ca.atk .val{color:#ffe08a}
  .coreAttrs .ca.def{background:linear-gradient(160deg,rgba(120,180,255,0.20),rgba(120,180,255,0.04));border-color:rgba(168,211,255,0.45)}
  .coreAttrs .ca.def .val{color:#cfe6ff}

  /* （元素词缀：自然高度、等比 3 列，不拉伸、不滚动；列间距收紧使元素格略宽） */
  .elemGrid{
    position:relative;width:100%;margin-top:5px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:3px 5px}
  .elemGrid .eg{
    display:flex;align-items:center;justify-content:space-between;
    padding:13.5px 12px;border-radius:8px;
    background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.08);
    cursor:default;transition:border-color .12s,background .12s}
  .elemGrid .eg:hover{border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.06)}
  .elemGrid .eg .lhs{display:flex;align-items:center;gap:8px}
  .elemGrid .eg .ic{width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .eg.phys   .ic{background:#c89858;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2)}
  .eg.frost  .ic{background:#3aa8e6;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2)}
  .eg.poison .ic{background:#5fa84e;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2)}
  .eg.chaos  .ic{background:#a35ad8;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2)}
  .eg.fire   .ic{background:#e3603a;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2)}
  .eg.light  .ic{background:#9b87f7;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2)}
  .elemGrid .eg .nm{font-size:16px;color:#fff;font-weight:600}
  .elemGrid .eg .vl{font-size:17px;color:#ffdc7a;font-weight:700}

  .attrTabs{
    position:relative;width:100%;flex:none;height:34px;
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .attrTabs .at{
    display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#9b8fb5;font-weight:700;letter-spacing:1px;
    border-radius:6px;background:rgba(0,0,0,0.32);
    cursor:pointer;border-bottom:3px solid transparent;transition:.12s}
  .attrTabs .at:hover{color:#fff}
  .attrTabs .at.on{
    color:#ffce6a;background:rgba(255,200,80,0.18);
    border-bottom-color:#ffce6a;
    box-shadow:0 4px 14px -4px rgba(255,200,80,0.5)}

  .attrBody{
    position:relative;width:100%;margin:0;flex:1;min-height:0;
    padding-right:6px;overflow:visible}
  /* 兜底：万一内容超出仍不出现可见「滑动块」（行高累计后仅个别分类可能微超） */
  .attrBody::-webkit-scrollbar{display:none}
  .attrBody{scrollbar-width:none;-ms-overflow-style:none}
  /* （需求5：分组标题改为贯穿全宽、略高于文字的渐变长条；相关属性做 3 块分割） */
  .attrBody .sg{display:flex;flex-direction:column;margin-bottom:4px;padding-left:0;border-left:none}
  .attrBody .sgh{display:flex;align-items:center;height:26px;margin-bottom:6px;padding:0 12px;
    border-radius:7px;font-size:15px;font-weight:700;letter-spacing:1px;color:#fff}
  .attrBody .sg.atk .sgh{background:linear-gradient(90deg,rgba(255,122,122,0.55),rgba(255,122,122,0))}
  .attrBody .sg.mgc .sgh{background:linear-gradient(90deg,rgba(122,184,255,0.55),rgba(122,184,255,0))}
  .attrBody .sg.crt .sgh{background:linear-gradient(90deg,rgba(255,174,58,0.55),rgba(255,174,58,0))}
  .attrBody .sg.def .sgh{background:linear-gradient(90deg,rgba(154,219,111,0.55),rgba(154,219,111,0))}
  .attrBody .sg.bst .sgh{background:linear-gradient(90deg,rgba(200,156,255,0.55),rgba(200,156,255,0))}
  .attrBody .sg.oth .sgh{background:linear-gradient(90deg,rgba(124,155,204,0.55),rgba(124,155,204,0))}
  .attrBody .affs{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
  .attrBody .aff{
    display:flex;align-items:center;justify-content:space-between;
    padding:12.5px 12px;border-radius:5px;background:rgba(0,0,0,0.32);
    border:1px solid rgba(255,255,255,0.06);font-size:15px;
    cursor:default;transition:background .12s,border-color .12s}
  .attrBody .aff:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,200,80,0.4)}
  .attrBody .aff .nm{color:#e9defb}
  .attrBody .aff .vl{color:#ffdc7a;font-weight:700}

  .attrTip{
    position:fixed;z-index:9999;pointer-events:none;display:none;
    background:rgba(8,10,22,0.96);color:#fff;font-size:13px;line-height:1.55;
    border:1px solid rgba(255,200,80,0.4);border-radius:8px;
    padding:11px 13px;min-width:160px;max-width:280px;
    box-shadow:0 10px 28px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.06)}
  .attrTip h5{margin:0 0 6px;color:#ffce6a;font-size:14px;font-weight:700;letter-spacing:1px}
  .attrTip .desc{color:#b9a8d9;font-size:11.5px;margin-bottom:8px}
  .attrTip ul{margin:0;padding:0;list-style:none}
  .attrTip li{display:flex;justify-content:space-between;color:#e9defb;font-size:12.5px;padding:2px 0}
  .attrTip li b{color:#ffdc7a;font-weight:700}
  .attrTip .meta{font-size:11px;color:#897bb0;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.12)}

  /* === 背包面板（装备页右侧） === */
  #bagCol{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  /* 顶部导航栏：高 45px，左 整理/分解，右 页面标签 1-10 */
  #bagNav{height:45px;flex:none;display:flex;align-items:center;gap:12px;
    padding:0 2px;margin-bottom:10px}
  .bagTools{display:flex;gap:8px;flex:none}
  .bagTool{height:30px;padding:0 16px;border-radius:8px;cursor:pointer;
    background:var(--btn);border:1px solid var(--line);color:var(--dim);
    font-size:14px;font-weight:600;display:flex;align-items:center;transition:.12s}
  .bagTool:hover{color:var(--txt);border-color:var(--accent);box-shadow:0 0 10px rgba(47,230,208,.2)}
  .bagTool:active{transform:translateY(1px)}
  .bagPages{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
  .bagPage{flex:1;min-width:0;height:32px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel2);border:1px solid var(--line);color:var(--mute);
    font-size:14px;font-weight:700;transition:.12s}
  .bagPage:hover{color:var(--txt);border-color:var(--accent)}
  .bagPage.on{color:var(--txt);background:var(--equipOn);border-color:var(--accent2);
    box-shadow:0 0 10px rgba(155,123,255,.25)}
  /* 背包格子：铺满剩余空间、不滚动、hover 框内略微高亮 */
  #bagGrid{flex:1;min-height:0;display:grid;
    grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,1fr);
    gap:8px;overflow:hidden}
  .bagCell{position:relative;border:1px solid var(--line);border-radius:8px;
    background:rgba(0,0,0,0.25);cursor:pointer;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s,border-color .12s,box-shadow .12s}
  .bagCell:hover{border-color:rgba(47,230,208,0.45);
    background:rgba(47,230,208,0.08);
    box-shadow:inset 0 0 18px rgba(47,230,208,0.16)}
  /* 背包物品格：图标 + 名称；按稀有度着色；已装备青绿高亮 */
  .bagCell.filled{flex-direction:column;gap:2px;cursor:context-menu;
    background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.16)}
  .bagCell.filled .ic{font-size:30px;line-height:1;pointer-events:none;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.25))}
  .bagCell.filled .nm{font-size:11px;color:#e9defb;font-weight:600;text-align:center;
    line-height:1.1;padding:0 2px;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .bagCell.filled.r.magic{border-color:rgba(90,180,255,0.55);box-shadow:inset 0 0 12px rgba(90,180,255,0.12)}
  .bagCell.filled.r.rare {border-color:rgba(200,140,255,0.6);box-shadow:inset 0 0 14px rgba(200,140,255,0.15)}
  .bagCell.filled.r.epic {border-color:rgba(255,180,80,0.65);box-shadow:inset 0 0 16px rgba(255,180,80,0.18)}
  .bagCell.filled.equipped{border-color:rgba(47,230,208,0.85);
    box-shadow:inset 0 0 18px rgba(47,230,208,0.22),0 0 10px rgba(47,230,208,0.25)}
  .bagCell .eq{position:absolute;top:3px;right:4px;font-size:9px;color:#2fe6d0;font-weight:700;
    background:rgba(0,0,0,0.55);padding:1px 4px;border-radius:4px;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <!-- 顶部栏 -->
  <div id="topbar" class="panel">
    <span class="brand">爆战丨无限弹幕</span>
    <span class="stat">关卡 <b id="hLevel">1</b></span>
    <span class="stat">金币 <b>—</b></span>
    <span class="stat">战力 <b>—</b></span>
    <span class="right">
      <span class="chip on">离线收益</span>
      <span class="chip">自动战斗</span>
      <span class="chip">设置</span>
    </span>
  </div>

  <!-- 战斗区（Pixi 注入 canvas） -->
  <div id="battleWrap"></div>

  <!-- 左侧 UI 接口 -->
  <div id="leftPanel" class="panel">
    <div class="body">
      <div class="btns" id="fbtns">
        <div class="fbtn" data-k="装备">装备</div>
        <div class="fbtn" data-k="技能">技能</div>
        <div class="fbtn" data-k="宠物">宠物</div>
        <div class="fbtn" data-k="铭文">铭文</div>
      </div>
    </div>
  </div>

  <!-- 右侧 UI 接口：英雄 10 件装备 -->
  <div id="rightPanel" class="panel">
    <div id="equipTabs"></div>
    <div id="equipGrid"></div>
  </div>

  <!-- 底部信息面板：可切换视图，默认显示角色属性；点击左侧 4 个按钮切换对应功能视图 -->
  <div id="bottom" class="panel">

    <!-- 装备页（默认显示 + 装备按钮激活）：左 属性栏 / 右 背包栏 -->
    <div class="bview" id="viewEquip">
      <div class="cols">

        <div class="col l" id="charPanel">
          <div id="charScale">
            <div class="coreAttrs">
              <div class="ca hp" data-tip="attr:生命值">
                <div class="ic">❤</div><div class="lbl">生命值</div><div class="val">1,000</div>
              </div>
              <div class="ca atk" data-tip="attr:攻击力">
                <div class="ic">⚔</div><div class="lbl">攻击力</div><div class="val">100</div>
              </div>
              <div class="ca def" data-tip="attr:护甲值">
                <div class="ic">🛡</div><div class="lbl">护甲值</div><div class="val">20</div>
              </div>
            </div>
            <div class="elemGrid">
              <div class="eg phys"   data-tip="attr:物理"><div class="lhs"><span class="ic">✶</span><span class="nm">物理</span></div><span class="vl">0%</span></div>
              <div class="eg chaos"  data-tip="attr:混沌"><div class="lhs"><span class="ic">◈</span><span class="nm">混沌</span></div><span class="vl">0%</span></div>
              <div class="eg frost"  data-tip="attr:冰霜"><div class="lhs"><span class="ic">❄</span><span class="nm">冰霜</span></div><span class="vl">0%</span></div>
              <div class="eg fire"   data-tip="attr:火焰"><div class="lhs"><span class="ic">✦</span><span class="nm">火焰</span></div><span class="vl">0%</span></div>
              <div class="eg poison" data-tip="attr:毒素"><div class="lhs"><span class="ic">☣</span><span class="nm">毒素</span></div><span class="vl">0%</span></div>
              <div class="eg light"  data-tip="attr:闪电"><div class="lhs"><span class="ic">⚡</span><span class="nm">闪电</span></div><span class="vl">0%</span></div>
            </div>
            <div class="attrTabs" id="attrTabs">
              <div class="at on" data-cat="damage">伤害</div>
              <div class="at" data-cat="defense">防御</div>
              <div class="at" data-cat="boost">增幅</div>
              <div class="at" data-cat="other">其他</div>
            </div>
            <div class="attrBody" id="attrBody"></div>
          </div>
        </div>

        <!-- 右侧：背包栏 -->
        <div class="col r" id="bagCol">
          <div id="bagNav">
            <div class="bagTools">
              <button class="bagTool" data-act="sort">整理</button>
              <button class="bagTool" data-act="split">分解</button>
            </div>
            <div class="bagPages" id="bagPages"></div>
          </div>
          <div id="bagGrid"></div>
        </div>
      </div>
    </div>

    <!-- 视图②：技能（左 技能区域：列表 + 上阵插槽 / 右 专精树） -->
    <div class="bview" id="viewSkill" hidden>
      <div class="cols">
        <!-- 左：技能区域 -->
        <div class="col l" id="skillAreaCol">
          <div id="skillList"></div>
          <div id="skillSlots"></div>
        </div>
        <!-- 右：当前技能专精树 -->
        <div class="col r" id="skillTreeCol">
          <div id="skillTreeHost"></div>
        </div>
      </div>
    </div>

    <!-- 视图③：宠物 -->
    <div class="bview" id="viewPet" hidden>
      <div class="phView"><b>宠物面板</b>宠物出战、技能与养成系统（开发中）。<br>后续接入主文档宠物章节设定。</div>
    </div>

    <!-- 视图④：铭文 -->
    <div class="bview" id="viewRune" hidden>
      <div class="phView"><b>铭文面板</b>铭文镶嵌、词条与共鸣系统（开发中）。<br>后续接入主文档符文 / 铭文章节设定。</div>
    </div>

  </div>
</div>

<script src="js/pixi.min.js"></script>
<script src="js/runes.js"></script>
<script src="js/game-h.js"></script>
<script src="js/equip-panel.js"></script>
<script src="js/char-panel.js"></script>
<script src="js/skill-panel.js"></script>
<script src="js/bag-panel.js"></script>
<script src="js/left-tabs.js"></script>
<script>
  /* 画布缩放自适应窗口（保持 1920×1080 设计比例，居中铺满可视区） */
  (function fit(){
    const st = document.getElementById('stage');
    if (!st) return;
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    st.style.transform = 'scale(' + s + ')';
    st.style.left = ((window.innerWidth - 1920 * s) / 2) + 'px';
    st.style.top = ((window.innerHeight - 1080 * s) / 2) + 'px';
  })();
  window.addEventListener('resize', function(){
    const st = document.getElementById('stage');
    if (!st) return;
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    st.style.transform = 'scale(' + s + ')';
    st.style.left = ((window.innerWidth - 1920 * s) / 2) + 'px';
    st.style.top = ((window.innerHeight - 1080 * s) / 2) + 'px';
  });
</script>
</body>
</html>
